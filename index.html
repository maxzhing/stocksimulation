<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Market Lab</title>
<meta name="description" content="An educational stock market simulator: virtual money, explainable price movements, and a teaching layer that grades process rather than profit.">
<style>
/* ============================================================================
   MARKET LAB — DESIGN TOKENS
   Palette is a validated data-viz palette: categorical hues are assigned in a
   fixed order (never cycled), status colors are reserved, and every dark value
   is its own selected step rather than an automatic flip of the light one.
   ========================================================================== */
:root {
  color-scheme: dark;

  /* --- surfaces & ink (dark is the default theme) --- */
  --plane:        #0d0d0d;
  --surface-1:    #1a1a19;
  --surface-2:    #201f1e;
  --surface-3:    #2a2a28;
  --ink:          #ffffff;
  --ink-2:        #c3c2b7;
  --ink-3:        #898781;
  --grid:         #2c2c2a;
  --axis:         #383835;
  --hairline:     rgba(255,255,255,0.10);
  --hairline-2:   rgba(255,255,255,0.16);

  /* --- categorical series (fixed order) --- */
  --s1:  #3987e5;  /* blue    */
  --s2:  #d95926;  /* orange  */
  --s3:  #199e70;  /* aqua    */
  --s4:  #c98500;  /* yellow  */
  --s5:  #d55181;  /* magenta */
  --s6:  #008300;  /* green   */
  --s7:  #9085e9;  /* violet  */
  --s8:  #e66767;  /* red     */
  /* Identity-only steps for sectors 9-12. These are used for table marks and
     chips, never as chart series — allocation charts fold past eight into
     "Other" rather than inventing a ninth categorical hue. */
  --s9:  #6aa6c8;  /* steel   */
  --s10: #b08968;  /* clay    */
  --s11: #7fb069;  /* moss    */
  --s12: #9aa0a6;  /* graphite */

  /* --- reserved status colors (never used as "series 9") --- */
  --good:      #0ca30c;
  --warning:   #fab219;
  --serious:   #ec835a;
  --critical:  #d03b3b;

  /* --- semantic finance roles: always paired with an arrow glyph or label --- */
  --up:        #0ca30c;
  --down:      #d03b3b;
  --up-wash:   rgba(12,163,12,0.14);
  --down-wash: rgba(208,59,59,0.14);

  --accent:      #3987e5;
  --accent-wash: rgba(57,135,229,0.14);

  --radius:    14px;
  --radius-sm: 9px;
  --radius-xs: 6px;
  --shadow: 0 1px 2px rgba(0,0,0,.28), 0 8px 24px -12px rgba(0,0,0,.5);
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  --sidebar-w: 236px;
  --topbar-h: 62px;
}

/* Light theme — its own selected steps from the same ramps */
:root[data-theme="light"] {
  color-scheme: light;
  --plane:      #f4f4f1;
  --surface-1:  #fcfcfb;
  --surface-2:  #ffffff;
  --surface-3:  #f0efec;
  --ink:        #0b0b0b;
  --ink-2:      #52514e;
  --ink-3:      #898781;
  --grid:       #e1e0d9;
  --axis:       #c3c2b7;
  --hairline:   rgba(11,11,11,0.10);
  --hairline-2: rgba(11,11,11,0.16);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
  --s9: #3f7c9c; --s10: #8a6642; --s11: #4f7d3a; --s12: #6b7075;
  --up: #006300; --down: #d03b3b;
  --up-wash: rgba(0,99,0,0.10); --down-wash: rgba(208,59,59,0.10);
  --accent: #2a78d6; --accent-wash: rgba(42,120,214,0.10);
  --shadow: 0 1px 2px rgba(11,11,11,.06), 0 10px 24px -14px rgba(11,11,11,.22);
}

/* ============================================================================
   BASE
   ========================================================================== */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--plane);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
h1,h2,h3,h4 { margin: 0; font-weight: 600; letter-spacing: -0.01em; line-height: 1.25; }
h1 { font-size: 1.45rem; }
h2 { font-size: 1.1rem; }
h3 { font-size: .95rem; }
p  { margin: 0 0 .7em; }
p:last-child { margin-bottom: 0; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select, textarea { font: inherit; color: inherit; }
::selection { background: var(--accent-wash); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.sr-only {
  position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;
}
.num { font-variant-numeric: tabular-nums; }
.mut { color: var(--ink-3); }
.sec { color: var(--ink-2); }
.up   { color: var(--up); }
.down { color: var(--down); }
.small { font-size: .82rem; }
.xsmall { font-size: .75rem; }
.strong { font-weight: 600; }
.center { text-align: center; }
.right { text-align: right; }
.nowrap { white-space: nowrap; }
.row { display:flex; align-items:center; gap:10px; }
.row.wrap { flex-wrap: wrap; }
.spread { display:flex; align-items:center; justify-content:space-between; gap:12px; }
.stack { display:flex; flex-direction:column; gap:12px; }
.grow { flex: 1 1 auto; min-width: 0; }

/* ============================================================================
   APP SHELL
   ========================================================================== */
.shell { display: grid; grid-template-columns: var(--sidebar-w) 1fr; min-height: 100vh; }

.sidebar {
  position: sticky; top: 0; height: 100vh;
  background: var(--surface-1);
  border-right: 1px solid var(--hairline);
  display: flex; flex-direction: column;
  padding: 16px 12px; gap: 6px; z-index: 40;
}
.brand { display:flex; align-items:center; gap:10px; padding: 4px 8px 14px; }
.brand-mark {
  width: 30px; height: 30px; border-radius: 8px; flex: none;
  background: linear-gradient(145deg, var(--s1), var(--s7));
  display:grid; place-items:center; color:#fff; font-weight:700; font-size:.8rem;
}
.brand-name { font-weight: 650; letter-spacing: -.02em; font-size: 1.02rem; }
.brand-sub { font-size: .68rem; color: var(--ink-3); letter-spacing: .06em; text-transform: uppercase; }

.nav-label {
  font-size: .66rem; text-transform: uppercase; letter-spacing: .08em;
  color: var(--ink-3); padding: 12px 10px 5px;
}
.sidebar { scrollbar-width: thin; }
.sidebar::-webkit-scrollbar { width: 6px; }
.sidebar::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 99px; }
.nav-item {
  display:flex; align-items:center; gap:10px; width:100%;
  padding: 8px 10px; border-radius: var(--radius-sm);
  background: none; border: 0; cursor: pointer;
  color: var(--ink-2); font-size: .9rem; text-align:left;
}
.nav-item:hover { background: var(--surface-3); color: var(--ink); }
.nav-item[aria-current="page"] { background: var(--accent-wash); color: var(--ink); font-weight: 600; }
.nav-item[aria-current="page"] .nav-ico { color: var(--accent); }
.nav-ico { width: 18px; display:grid; place-items:center; flex:none; color: var(--ink-3); }
.nav-ico svg { width: 17px; height: 17px; }
.nav-badge {
  margin-left:auto; background: var(--surface-3); color: var(--ink-2);
  border-radius: 99px; padding: 1px 7px; font-size: .7rem; font-variant-numeric: tabular-nums;
}
.nav-badge.alert { background: var(--accent-wash); color: var(--accent); }
.sidebar-foot { margin-top: auto; padding: 10px 8px 0; border-top: 1px solid var(--hairline); }

.main { min-width: 0; display: flex; flex-direction: column; }

/* ============================================================================
   TOP BAR
   ========================================================================== */
.topbar {
  position: sticky; top: 0; z-index: 30;
  min-height: var(--topbar-h);
  display: flex; align-items: center; gap: 14px;
  padding: 10px 20px;
  background: color-mix(in srgb, var(--plane) 86%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--hairline);
}
.icon-btn {
  background: var(--surface-1); border: 1px solid var(--hairline);
  color: var(--ink-2); width: 34px; height: 34px; border-radius: var(--radius-sm);
  display:grid; place-items:center; cursor:pointer; flex:none;
}
.icon-btn:hover { color: var(--ink); border-color: var(--hairline-2); }
.icon-btn svg { width: 16px; height: 16px; }
.menu-btn { display: none; }

.search-wrap { position: relative; flex: 1 1 320px; max-width: 420px; }
.search-input {
  width: 100%; padding: 8px 12px 8px 34px; border-radius: var(--radius-sm);
  background: var(--surface-1); border: 1px solid var(--hairline); color: var(--ink);
}
.search-input::placeholder { color: var(--ink-3); }
.search-ico { position:absolute; left:11px; top:50%; transform:translateY(-50%); color: var(--ink-3); pointer-events:none; }
.search-ico svg { width:15px; height:15px; display:block; }
.search-results {
  position:absolute; top: calc(100% + 6px); left:0; right:0; z-index: 60;
  background: var(--surface-2); border:1px solid var(--hairline);
  border-radius: var(--radius-sm); box-shadow: var(--shadow); overflow:hidden;
  max-height: 340px; overflow-y:auto;
}
.search-results:empty { display: none; }
.sr-item { display:flex; align-items:center; gap:10px; padding:9px 12px; cursor:pointer; border:0; background:none; width:100%; text-align:left; }
.sr-item:hover, .sr-item.active { background: var(--surface-3); }
.sr-tick { font-weight:650; width: 58px; flex:none; }

.status-pill {
  display:inline-flex; align-items:center; gap:7px; padding: 5px 11px;
  border-radius: 99px; background: var(--surface-1); border:1px solid var(--hairline);
  font-size: .8rem; color: var(--ink-2); white-space: nowrap;
}
.dot { width:7px; height:7px; border-radius:99px; background: var(--ink-3); flex:none; }
.dot.open { background: var(--good); box-shadow: 0 0 0 3px rgba(12,163,12,.18); }
.dot.closed { background: var(--ink-3); }

.topbar-stat { display:flex; flex-direction:column; line-height:1.15; }
.topbar-stat .k { font-size: .68rem; color: var(--ink-3); text-transform: uppercase; letter-spacing:.06em; }
.topbar-stat .v { font-weight: 600; font-variant-numeric: tabular-nums; }

/* ============================================================================
   BUTTONS / CONTROLS
   ========================================================================== */
.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  padding: 8px 14px; border-radius: var(--radius-sm); cursor: pointer;
  background: var(--surface-1); color: var(--ink); border: 1px solid var(--hairline);
  font-size: .88rem; font-weight: 550; white-space: nowrap;
  transition: background .12s ease, border-color .12s ease, transform .06s ease;
}
.btn:hover { border-color: var(--hairline-2); background: var(--surface-3); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .45; cursor: not-allowed; pointer-events: none; }
.btn svg { width: 15px; height: 15px; }
.btn-primary { background: var(--accent); border-color: transparent; color: #fff; }
.btn-primary:hover { background: color-mix(in srgb, var(--accent) 85%, #000); }
.btn-buy  { background: var(--up); border-color: transparent; color: #fff; }
.btn-buy:hover { background: color-mix(in srgb, var(--up) 85%, #000); }
.btn-sell { background: var(--down); border-color: transparent; color: #fff; }
.btn-sell:hover { background: color-mix(in srgb, var(--down) 85%, #000); }
.btn-ghost { background: none; }
.btn-sm { padding: 5px 10px; font-size: .8rem; }
.btn-block { width: 100%; }

.seg { display:inline-flex; flex-wrap: wrap; max-width: 100%; background: var(--surface-1); border:1px solid var(--hairline); border-radius: var(--radius-sm); padding: 2px; gap: 2px; }
.seg button {
  border:0; background:none; cursor:pointer; color: var(--ink-3);
  padding: 5px 11px; border-radius: 7px; font-size: .8rem; font-weight: 550;
  white-space: nowrap;
}
.seg button[aria-pressed="true"] { background: var(--surface-3); color: var(--ink); }

.field { display:flex; flex-direction:column; gap:6px; }
.field label { font-size: .78rem; color: var(--ink-2); font-weight: 550; }
.input, select.input {
  width: 100%; max-width: 100%; padding: 9px 12px; border-radius: var(--radius-sm);
  background: var(--surface-2); border: 1px solid var(--hairline); color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.input:focus { border-color: var(--accent); outline: none; }

/* ============================================================================
   CARDS / LAYOUT PRIMITIVES
   ========================================================================== */
.view { padding: 20px; max-width: 1480px; width: 100%; margin: 0 auto; }
.view-head { margin-bottom: 18px; display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; max-width:100%; }
/* flex children default to min-width:auto, which lets a wide <select> or a long
   name push the whole page sideways on a phone */
.view-head > * { min-width: 0; max-width: 100%; }
.row.wrap { max-width: 100%; }
.view-head .sub { color: var(--ink-3); font-size: .88rem; margin-top: 3px; }

.card {
  background: var(--surface-1); border: 1px solid var(--hairline);
  border-radius: var(--radius); padding: 16px;
}
.card.pad-0 { padding: 0; }
.card-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom: 12px; flex-wrap: wrap; }
.card-title { font-size: .95rem; font-weight: 600; }
.card-sub { font-size: .78rem; color: var(--ink-3); }

.grid { display: grid; gap: 14px; }
.g-4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
.g-3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.g-2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
.g-main { grid-template-columns: minmax(0, 2.1fr) minmax(0, 1fr); }
.g-research { grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr); }

/* stat tile */
.stat { display:flex; flex-direction:column; gap: 4px; }
.stat .k { font-size: .74rem; color: var(--ink-3); }
.stat .v { font-size: 1.5rem; font-weight: 640; letter-spacing: -.02em; }
.stat .v.hero { font-size: 2.4rem; }
.stat .d { font-size: .82rem; font-variant-numeric: tabular-nums; }
.delta { display:inline-flex; align-items:center; gap:4px; font-variant-numeric: tabular-nums; }
.delta .arrow { font-size: .72em; }

/* ============================================================================
   TABLES
   ========================================================================== */
.table-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: .875rem; }
table.tbl th {
  text-align: left; font-size: .72rem; text-transform: uppercase; letter-spacing: .05em;
  color: var(--ink-3); font-weight: 600; padding: 10px 12px;
  border-bottom: 1px solid var(--hairline); white-space: nowrap; background: var(--surface-1);
}
table.tbl td { padding: 11px 12px; border-bottom: 1px solid var(--hairline); vertical-align: middle; }
table.tbl tr:last-child td { border-bottom: 0; }
table.tbl tbody tr.clickable { cursor: pointer; }
table.tbl tbody tr.clickable:hover { background: var(--surface-2); }
table.tbl td.num, table.tbl th.num { text-align: right; font-variant-numeric: tabular-nums; }
.tick-cell { display:flex; align-items:center; gap:10px; }
.tick-mark { width: 3px; height: 26px; border-radius: 2px; flex:none; background: var(--s1); }
.tick-name { display:flex; flex-direction:column; line-height:1.2; min-width:0; }
.tick-name .t { font-weight: 650; }
.tick-name .n { font-size: .74rem; color: var(--ink-3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* ============================================================================
   BADGES / CHIPS
   ========================================================================== */
.badge {
  display:inline-flex; align-items:center; gap:5px; padding: 2px 8px;
  border-radius: 99px; font-size: .7rem; font-weight: 600; letter-spacing: .01em;
  border: 1px solid var(--hairline); color: var(--ink-2); background: var(--surface-2);
  white-space: nowrap;
}
.badge.minor    { color: var(--ink-2); }
.badge.moderate { color: var(--warning);  border-color: color-mix(in srgb, var(--warning) 40%, transparent); }
.badge.major    { color: var(--serious);  border-color: color-mix(in srgb, var(--serious) 45%, transparent); }
.badge.market   { color: var(--s7); border-color: color-mix(in srgb, var(--s7) 45%, transparent); }
.badge.good     { color: var(--good);     border-color: color-mix(in srgb, var(--good) 40%, transparent); }
.badge.bad      { color: var(--critical); border-color: color-mix(in srgb, var(--critical) 40%, transparent); }
.badge.accent   { color: var(--accent);   border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.chip {
  display:inline-flex; align-items:center; gap:6px; padding: 4px 10px; border-radius: 99px;
  background: var(--surface-2); border:1px solid var(--hairline); font-size: .78rem; color: var(--ink-2);
  cursor: pointer;
}
.chip:hover { border-color: var(--hairline-2); color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--accent-wash); border-color: color-mix(in srgb, var(--accent) 40%, transparent); color: var(--ink); }
.swatch { width: 9px; height: 9px; border-radius: 3px; flex:none; }

/* ============================================================================
   CHARTS
   ========================================================================== */
.chart-box { position: relative; width: 100%; }
.chart-box svg { display:block; width:100%; height:auto; overflow: visible; }
.chart-tip {
  position: fixed; z-index: 90; pointer-events: none;
  background: var(--surface-2); border:1px solid var(--hairline-2);
  border-radius: var(--radius-sm); box-shadow: var(--shadow);
  padding: 9px 11px; font-size: .78rem; min-width: 150px; max-width: 280px;
}
.chart-tip .tip-h { font-weight: 650; margin-bottom: 4px; }
.chart-tip .tip-r { display:flex; justify-content:space-between; gap:14px; font-variant-numeric: tabular-nums; }
.legend { display:flex; flex-wrap:wrap; gap: 14px; font-size: .78rem; color: var(--ink-2); }
.legend .li { display:inline-flex; align-items:center; gap:6px; }
.legend .key { width: 12px; height: 3px; border-radius: 2px; }
.legend .key.sq { width: 10px; height: 10px; border-radius: 3px; }

/* horizontal allocation bars */
.allocbar { display:flex; flex-direction:column; gap: 9px; }
.allocrow { display:grid; grid-template-columns: 132px minmax(0,1fr) 62px; align-items:center; gap: 10px; font-size: .8rem; }
.allocrow.drow { grid-template-columns: minmax(0,1fr) 120px 66px; }
.allocrow.rrow { grid-template-columns: 78px minmax(0,1fr) 70px; }
.allocrow.drow .lbl { white-space: normal; }
.allocrow .track { display:block; height: 10px; background: var(--surface-3); border-radius: 99px; overflow:hidden; }
.allocrow .fill { display:block; height: 100%; border-radius: 99px; min-width: 2px; }
.allocrow .lbl { display:flex; align-items:center; gap:7px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* stacked composition bar */
.compbar { display:flex; height: 14px; border-radius: 99px; overflow:hidden; background: var(--surface-3); gap: 2px; }
.compbar span { display:block; height:100%; min-width: 1px; }

/* ============================================================================
   NEWS
   ========================================================================== */
.news-list { display:flex; flex-direction:column; }
.news-item {
  padding: 13px 14px; border-bottom: 1px solid var(--hairline); cursor: pointer;
  display:flex; gap: 12px; align-items:flex-start; background:none; border-left:0; border-right:0; border-top:0;
  width: 100%; text-align:left; color: inherit;
}
.news-item:last-child { border-bottom: 0; }
.news-item:hover { background: var(--surface-2); }
.news-rail { width: 3px; align-self: stretch; border-radius: 2px; flex:none; background: var(--ink-3); min-height: 34px; }
.news-rail.minor { background: var(--ink-3); }
.news-rail.moderate { background: var(--warning); }
.news-rail.major { background: var(--serious); }
.news-rail.market { background: var(--s7); }
.news-body { min-width: 0; flex: 1; }
.news-h { font-weight: 570; font-size: .9rem; margin-bottom: 4px; }
.news-meta { display:flex; flex-wrap:wrap; gap: 7px; align-items:center; font-size: .72rem; color: var(--ink-3); }
.news-tickers { display:flex; gap:5px; flex-wrap:wrap; }
.tkr {
  font-size: .68rem; font-weight: 650; padding: 1px 6px; border-radius: 5px;
  background: var(--surface-3); color: var(--ink-2); font-variant-numeric: tabular-nums;
}
.tkr.up { background: var(--up-wash); color: var(--up); }
.tkr.down { background: var(--down-wash); color: var(--down); }

/* why-it-matters callout */
.why {
  border-left: 3px solid var(--accent); background: var(--accent-wash);
  padding: 11px 13px; border-radius: 0 var(--radius-sm) var(--radius-sm) 0; font-size: .86rem;
}
.why .why-h { font-weight: 640; font-size: .76rem; text-transform: uppercase; letter-spacing:.05em; color: var(--accent); margin-bottom: 5px; }
.why.danger { border-left-color: var(--critical); background: color-mix(in srgb, var(--critical) 10%, transparent); }
.why.danger .why-h { color: var(--critical); }

/* teaching callout */
.lesson {
  border: 1px solid color-mix(in srgb, var(--s7) 35%, transparent);
  background: color-mix(in srgb, var(--s7) 9%, transparent);
  border-radius: var(--radius-sm); padding: 12px 14px; font-size: .86rem;
}
.lesson .lesson-h { display:flex; align-items:center; gap:7px; font-weight: 640; font-size: .76rem; text-transform: uppercase; letter-spacing:.05em; color: var(--s7); margin-bottom: 6px; }

/* ============================================================================
   TIMELINE
   ========================================================================== */
.timeline { position: relative; padding-left: 26px; }
.timeline::before { content:''; position:absolute; left: 7px; top: 6px; bottom: 6px; width: 2px; background: var(--grid); }
.tl-item { position: relative; padding: 0 0 18px 0; }
.tl-dot { position:absolute; left: -24px; top: 4px; width: 10px; height: 10px; border-radius:99px; background: var(--ink-3); border: 2px solid var(--surface-1); }
.tl-dot.moderate { background: var(--warning); } .tl-dot.major { background: var(--serious); } .tl-dot.market { background: var(--s7); }
.tl-day { font-size: .72rem; color: var(--ink-3); text-transform: uppercase; letter-spacing:.05em; }

/* ============================================================================
   MODALS / DRAWERS / TOASTS
   ========================================================================== */
.backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 80;
  display: grid; place-items: center; padding: 18px;
  animation: fade .16s ease;
}
.modal {
  background: var(--surface-1); border:1px solid var(--hairline); border-radius: var(--radius);
  box-shadow: var(--shadow); width: min(680px, 100%); max-height: 88vh; overflow-y: auto;
  animation: pop .18s cubic-bezier(.2,.8,.3,1);
}
.modal.wide { width: min(900px, 100%); }
.modal-head { padding: 16px 18px; border-bottom: 1px solid var(--hairline); display:flex; align-items:flex-start; justify-content:space-between; gap:12px; position: sticky; top:0; background: var(--surface-1); z-index:2; }
.modal-body { padding: 18px; }
.modal-foot { padding: 14px 18px; border-top: 1px solid var(--hairline); display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; position:sticky; bottom:0; background: var(--surface-1); }
@keyframes fade { from { opacity: 0 } }
@keyframes pop { from { opacity:0; transform: translateY(8px) scale(.99) } }
@keyframes slidein { from { opacity: 0; transform: translateX(16px) } }
@keyframes viewin { from { opacity: 0; transform: translateY(4px) } }
.view.fade-in { animation: viewin .16s ease-out; }
/* the auto-advance button shows its speed as a small badge */
.icon-btn[data-speed="2"]::after, .icon-btn[data-speed="3"]::after {
  content: attr(data-speed) 'x'; position: absolute; bottom: -3px; right: -4px;
  font-size: .56rem; font-weight: 700; background: var(--accent); color: #fff;
  border-radius: 99px; padding: 0 3px; line-height: 1.5;
}
.icon-btn { position: relative; }

#toast-root {
  position: fixed; right: 18px; bottom: 18px; z-index: 95;
  display:flex; flex-direction: column; gap: 10px; width: min(360px, calc(100vw - 36px));
}
.toast {
  background: var(--surface-2); border:1px solid var(--hairline-2); border-radius: var(--radius-sm);
  box-shadow: var(--shadow); padding: 12px 14px; font-size: .85rem;
  animation: slidein .2s ease; border-left: 3px solid var(--accent);
}
.toast.lesson-toast { border-left-color: var(--s7); }
.toast.warn { border-left-color: var(--warning); }
.toast.bad  { border-left-color: var(--critical); }
.toast .th { font-weight: 640; margin-bottom: 3px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
.toast .tclose { background:none;border:0;color:var(--ink-3);cursor:pointer;font-size:1rem;line-height:1;padding:0 2px; }

/* ============================================================================
   TRADE TICKET
   ========================================================================== */
.ticket-row { display:flex; justify-content:space-between; padding: 7px 0; font-size: .86rem; border-bottom: 1px dashed var(--hairline); }
.ticket-row:last-child { border-bottom: 0; }
.ticket-row .v { font-variant-numeric: tabular-nums; font-weight: 550; }
.ticket-total { font-size: 1rem; font-weight: 650; }
.qty-row { display:grid; grid-template-columns: 1fr auto auto auto auto; gap: 8px; }

/* ============================================================================
   QUIZ / SCENARIO
   ========================================================================== */
.opt {
  display:block; width:100%; text-align:left; padding: 12px 14px; border-radius: var(--radius-sm);
  background: var(--surface-2); border:1px solid var(--hairline); cursor:pointer; margin-bottom: 9px; font-size: .88rem;
}
.opt:hover { border-color: var(--hairline-2); background: var(--surface-3); }
.opt.correct { border-color: var(--good); background: color-mix(in srgb, var(--good) 12%, transparent); }
.opt.wrong   { border-color: var(--critical); background: color-mix(in srgb, var(--critical) 12%, transparent); }
.opt.chosen  { border-color: var(--accent); }
.opt[disabled] { cursor: default; }
.opt .opt-k { font-weight: 650; margin-right: 8px; color: var(--ink-3); }

.progress { display:block; height: 7px; background: var(--surface-3); border-radius: 99px; overflow:hidden; }
.progress .fill { display:block; height:100%; background: var(--accent); border-radius: 99px; transition: width .4s ease; }

/* concept card */
.concept {
  border:1px solid var(--hairline); border-radius: var(--radius-sm); padding: 13px;
  background: var(--surface-2); cursor:pointer; display:flex; flex-direction:column; gap:6px;
}
.concept:hover { border-color: var(--hairline-2); }
.concept .ct { font-weight: 600; font-size: .9rem; }
.concept .cs { font-size: .8rem; color: var(--ink-2); }
.concept.seen { border-left: 3px solid var(--good); }

/* grade rows in the report */
.grade-row { display:grid; grid-template-columns: 150px 1fr 46px; gap: 12px; align-items:center; }
.grade-letter { font-weight: 700; font-size: 1.05rem; text-align:right; font-variant-numeric: tabular-nums; }

.empty { padding: 34px 18px; text-align:center; color: var(--ink-3); font-size: .88rem; }

.kv { display:grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: .86rem; }
.kv dt { color: var(--ink-3); }
.kv dd { margin:0; font-variant-numeric: tabular-nums; text-align: right; font-weight: 550; }

.disclaimer {
  font-size: .74rem; color: var(--ink-3); border-top: 1px solid var(--hairline);
  padding-top: 12px; margin-top: 18px; line-height: 1.55;
}

/* ============================================================================
   RESPONSIVE
   ========================================================================== */
@media (max-width: 1180px) {
  .g-4 { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .g-main, .g-research { grid-template-columns: minmax(0,1fr); }
}
@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; }
  .sidebar {
    position: fixed; left: 0; top: 0; bottom: 0; width: 260px;
    transform: translateX(-100%); transition: transform .22s ease; height: 100dvh;
  }
  .sidebar.open { transform: none; box-shadow: var(--shadow); }
  .menu-btn { display: grid; }
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 35; }
  .g-3 { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .view { padding: 14px; }
  .topbar { padding: 8px 12px; gap: 8px; }
  .hide-sm { display: none !important; }
}
@media (max-width: 680px) {
  .g-4, .g-3, .g-2 { grid-template-columns: minmax(0,1fr); }
  /* the top bar folds onto two rows so the search field keeps a usable width */
  .topbar { flex-wrap: wrap; row-gap: 8px; }
  .search-wrap { order: 9; flex: 1 0 100%; max-width: none; }
  .allocrow.drow { grid-template-columns: minmax(0,1fr) 54px 62px; }
  .allocrow.rrow { grid-template-columns: 62px minmax(0,1fr) 62px; }
  .seg button { padding: 5px 8px; font-size: .74rem; }
  .modal-foot { justify-content: stretch; }
  .modal-foot .btn { flex: 1 1 auto; }
  h1 { font-size: 1.2rem; }
  .stat .v { font-size: 1.28rem; }
  .stat .v.hero { font-size: 1.9rem; }
  .grade-row { grid-template-columns: 110px 1fr 40px; }
  .qty-row { grid-template-columns: 1fr auto auto; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}
@media print { .sidebar, .topbar, #toast-root { display: none !important; } }

 * The governing rule of this whole module: a pattern is EVIDENCE, never an

/* --- geometry helpers ------------------------------------------------------ */
const cBody  = b => Math.abs(b.c - b.o);
const cRange = b => Math.max(1e-9, b.h - b.l);
const cUpper = b => b.h - Math.max(b.o, b.c);
const cLower = b => Math.min(b.o, b.c) - b.l;
const cUp    = b => b.c > b.o;
const cDown  = b => b.c < b.o;
const cMidBody = b => (b.o + b.c) / 2;

function avgOf(bars, i, n, fn) {
  let s = 0, k = 0;
  for (let j = Math.max(0, i - n); j < i; j++) { s += fn(bars[j]); k++; }
  return k ? s / k : 0;
}

/* Prevailing direction before index i: +1 up, -1 down, 0 sideways.
   Measured against the average range so a "trend" means a real move, not drift. */
function trendBefore(bars, i, n) {
  n = n || 10;
  const a = Math.max(0, i - n), b = Math.max(0, i - 1);
  if (b - a < 3) return 0;
  const move = bars[b].c - bars[a].c;
  const scale = avgOf(bars, i, n, cRange) * Math.sqrt(b - a);
  if (!scale) return 0;
  const z = move / scale;
  return z > 0.55 ? 1 : z < -0.55 ? -1 : 0;
}

const PATTERN_BY_ID = Object.fromEntries(PATTERNS.map(p => [p.id, p]));
const PATTERN_CATS = { single: 'Single candle', two: 'Two candles', three: 'Three candles' };

/* Scan a series and return every pattern occurrence found. Deliberately
   reports ALL matches, including the ones that went on to fail — a detector
   that only showed the successful ones would teach exactly the wrong lesson. */
function detectPatterns(bars, from, to) {
  const out = [];
  from = Math.max(2, from | 0);
  to = Math.min(bars.length - 1, to);
  for (let i = from; i <= to; i++) {
    PATTERNS.forEach(p => {
      try { if (p.detect(bars, i)) out.push({ i, id: p.id, name: p.name, bias: p.bias, cat: p.cat }); }
      catch (e) { /* a malformed window simply yields no match */ }
    });
  }
  return out;
}

/* Plain-English description of a single candle, used in the chart tooltip. */
function describeCandle(b, prev) {
  const r = cRange(b), body = cBody(b), up = cUp(b);
  const pct = prev ? (b.c / prev.c - 1) : 0;
  let s = up ? 'Closed above its open — buyers finished in control. ' : body < r * 0.05 ? 'Opened and closed at almost the same price — neither side gained ground. ' : 'Closed below its open — sellers finished in control. ';
  if (body < r * 0.12) s += 'The body is tiny relative to the range, so the session was indecisive. ';
  else if (body > r * 0.8) s += 'The body fills nearly the whole range: one-sided from open to close. ';
  if (cLower(b) > body * 1.8 && cLower(b) > r * 0.4) s += 'A long lower wick shows the price was pushed down and bought back. ';
  if (cUpper(b) > body * 1.8 && cUpper(b) > r * 0.4) s += 'A long upper wick shows a rally that was sold into. ';
  if (prev) s += `Overall the price ${pct >= 0 ? 'rose' : 'fell'} ${fmtPct(Math.abs(pct), 2).replace('+', '')} from the previous close.`;
  return s;
}

/* ============================================================================
 * 3b. INDICATORS
 * ----------------------------------------------------------------------------
 * Every one of these is arithmetic performed on prices that have already
 * happened. None of them contains information the price does not, and none of
 * them predicts anything. They are ways of describing a situation compactly.
 * ========================================================================== */

function sma(vals, n) {
  const out = new Array(vals.length).fill(null);
  let sum = 0;
  for (let i = 0; i < vals.length; i++) {
    sum += vals[i];
    if (i >= n) sum -= vals[i - n];
    if (i >= n - 1) out[i] = sum / n;
  }
  return out;
}

function ema(vals, n) {
  const out = new Array(vals.length).fill(null);
  const k = 2 / (n + 1);
  let prev = null;
  for (let i = 0; i < vals.length; i++) {
    if (i === n - 1) { prev = vals.slice(0, n).reduce((a, b) => a + b, 0) / n; out[i] = prev; }
    else if (i >= n) { prev = vals[i] * k + prev * (1 - k); out[i] = prev; }
  }
  return out;
}

/* RSI: of the last n sessions' movement, what share was upward? 0-100. */
function rsi(closes, n) {
  n = n || 14;
  const out = new Array(closes.length).fill(null);
  let gain = 0, loss = 0;
  for (let i = 1; i < closes.length; i++) {
    const d = closes[i] - closes[i - 1];
    const g = Math.max(0, d), l = Math.max(0, -d);
    if (i <= n) { gain += g; loss += l; if (i === n) { gain /= n; loss /= n; out[i] = 100 - 100 / (1 + (loss ? gain / loss : 100)); } }
    else {
      gain = (gain * (n - 1) + g) / n;
      loss = (loss * (n - 1) + l) / n;
      out[i] = 100 - 100 / (1 + (loss ? gain / loss : 100));
    }
  }
  return out;
}

/* MACD: the gap between a fast and a slow moving average, plus a signal line. */
function macd(closes, fast, slow, sig) {
  fast = fast || 12; slow = slow || 26; sig = sig || 9;
  const f = ema(closes, fast), s = ema(closes, slow);
  const line = closes.map((_, i) => (f[i] == null || s[i] == null) ? null : f[i] - s[i]);
  const valid = line.map(v => v == null ? 0 : v);
  const sg = ema(valid, sig).map((v, i) => line[i] == null ? null : v);
  const hist = line.map((v, i) => (v == null || sg[i] == null) ? null : v - sg[i]);
  return { line, signal: sg, hist };
}

/* Bollinger Bands: a moving average plus/minus a multiple of its own standard
   deviation, so the band width IS the recent volatility. */
function bollinger(closes, n, k) {
  n = n || 20; k = k || 2;
  const mid = sma(closes, n);
  const up = new Array(closes.length).fill(null), lo = new Array(closes.length).fill(null);
  for (let i = n - 1; i < closes.length; i++) {
    const win = closes.slice(i - n + 1, i + 1);
    const m = mid[i];
    const sd = Math.sqrt(win.reduce((a, v) => a + (v - m) * (v - m), 0) / n);
    up[i] = m + k * sd; lo[i] = m - k * sd;
  }
  return { mid, up, lo };
}

function atr(bars, n) {
  n = n || 14;
  const tr = bars.map((b, i) => i === 0 ? cRange(b) : Math.max(b.h - b.l, Math.abs(b.h - bars[i - 1].c), Math.abs(b.l - bars[i - 1].c)));
  return sma(tr, n);
}

/* Automatic support / resistance: swing points that the price has revisited.
   Returned as zones with a hit count, because a level tested three times is a
   different piece of evidence from one touched once. */
function findLevels(bars, lookback) {
  const n = bars.length;
  const from = Math.max(2, n - (lookback || 90));
  const swings = [];
  for (let i = from; i < n - 2; i++) {
    const w = bars.slice(i - 2, i + 3);
    const hi = bars[i].h, lo = bars[i].l;
    if (w.every(b => b.h <= hi)) swings.push({ p: hi, kind: 'res' });
    if (w.every(b => b.l >= lo)) swings.push({ p: lo, kind: 'sup' });
  }
  const tol = (avgOf(bars, n - 1, 20, cRange) || 1) * 0.6;
  const zones = [];
  swings.forEach(s => {
    const z = zones.find(z => z.kind === s.kind && Math.abs(z.p - s.p) <= tol);
    if (z) { z.p = (z.p * z.hits + s.p) / (z.hits + 1); z.hits++; }
    else zones.push({ p: s.p, kind: s.kind, hits: 1 });
  });
  return zones.filter(z => z.hits >= 2).sort((a, b) => b.hits - a.hits).slice(0, 4);
}

/* ============================================================================
 * 4d. "READ THE CANDLE" — generated chart-reading questions
 * ----------------------------------------------------------------------------
 * Questions are generated, not scripted, so the same pattern looks different
 * every time and cannot be memorised by its picture. Difficulty rises from
 * naming a single candle, to naming multi-candle formations, to judging what
 * the surrounding context does to the evidence — which is the real skill.
 * ========================================================================== */

const CANDLE_LEVELS = {
  beginner:     { label: 'Beginner', desc: 'Name the single candle in front of you.', cats: ['single'], opts: 3 },
  intermediate: { label: 'Intermediate', desc: 'Name multi-candle formations.', cats: ['two', 'three'], opts: 4 },
  advanced:     { label: 'Advanced', desc: 'Identify the pattern, then judge what the context does to it.', cats: ['single', 'two', 'three'], opts: 4 }
};

/* Turn an idealised pattern shape into a plausible price series, complete with
   a prior trend of the right direction and volume that behaves sensibly. */
function synthPattern(p, opts) {
  opts = opts || {};
  const lead = opts.lead == null ? 12 : opts.lead;
  const base = 60 + rnd() * 120;
  const vol = 0.014 + rnd() * 0.012;
  /* a reversal pattern needs something to reverse, so the lead-in trend is
     chosen to match what the pattern claims to be reversing */
  let dir = opts.trend != null ? opts.trend
    : p.bias === 'bullish' ? -1 : p.bias === 'bearish' ? 1 : (rnd() < 0.5 ? 1 : -1);
  const bars = [];
  let px = base;
  const fake = { vol, shares: 1.2 };
  for (let i = 0; i < lead; i++) {
    const o = px;
    px = px * (1 + dir * (0.006 + rnd() * 0.008) + gauss() * vol * 0.7);
    /* a "sideways" lead-in has to actually range, so pull it back toward the
       starting price — otherwise the context would describe a trend the chart
       does not show, which teaches the opposite of the intended lesson */
    if (dir === 0) px += (base - px) * 0.30;
    bars.push(makeBar(o, px, fake, 0));
  }
  /* map the idealised shape into this price context, starting where we are */
  const vals = p.shape.flatMap(k => [k.o, k.h, k.l, k.c]);
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const scale = (px * (0.055 + rnd() * 0.03)) / Math.max(1, hi - lo);
  const anchor = px;
  const at = v => +(anchor + (v - p.shape[0].o) * scale).toFixed(2);
  const avgV = bars.reduce((a, b) => a + b.v, 0) / bars.length;
  p.shape.forEach((k, idx) => {
    const jitter = 1 + gauss() * 0.06;
    const o = at(k.o), c = at(k.c);
    const h = Math.max(o, c, at(k.h) * jitter > 0 ? at(k.h) : at(k.h));
    const l = Math.min(o, c, at(k.l));
    bars.push({ o, h: +Math.max(h, Math.max(o, c)).toFixed(2), l: +Math.min(l, Math.min(o, c)).toFixed(2), c,
      v: Math.round(avgV * (opts.lowVolume ? 0.35 + rnd() * 0.2 : 0.9 + rnd() * 1.4 + (idx === p.shape.length - 1 ? 0.6 : 0))) });
  });
  return { bars, patternFrom: lead, trendDir: dir, avgV };
}

/* Context factors for the advanced level. Exactly one weak factor is injected,
   and the question asks the player to find it. */
const CTX_FACTORS = {
  trend: [
    { t: 'The pattern formed after a clear 15% decline over three weeks.', weak: false, dir: -1 },
    { t: 'The pattern formed after a clear 14% advance over three weeks.', weak: false, dir: 1 },
    { t: 'The price has gone sideways in a narrow range for a month — there is no trend to reverse.', weak: true, dir: 0, why: 'A reversal pattern with nothing to reverse is not a reversal pattern. In a range, these shapes appear constantly and mean nothing.' }

    { t: 'Volume on the key candle was more than double the 20-session average.', weak: false },
    { t: 'Volume was roughly in line with the recent average.', weak: false },
    { t: 'Volume on the key candle was less than half the recent average.', weak: true, why: 'The pattern claims control changed hands. Very light volume means almost nobody participated in that change, which makes it easy to undo the next session.' }
  ],
  level: [
    { t: 'It formed right at a price the stock has bounced from twice before.', weak: false },
    { t: 'It formed at a level with no particular history.', weak: false },
    { t: 'It formed in the middle of the recent range, nowhere near a level anyone is watching.', weak: true, why: 'Patterns carry more weight where other evidence already says something might happen. In the middle of nowhere, there is no confluence to support it.' }
  ],
  news: [
    { t: 'No company-specific news was released during the period.', weak: false },
    { t: 'The company reported results two sessions earlier that beat expectations.', weak: false },
    { t: 'The company cut its full-year guidance the same morning, and the reason for the decline is still in force.', weak: true, why: 'A chart pattern describes buyer and seller behaviour over a few sessions. It cannot outweigh a deterioration in the business that is still underway — the cause of the selling has not gone away.' }
  ],
  market: [
    { t: 'The broad market is stable and trading in line with its average.', weak: false },
    { t: 'The broad market is rising steadily.', weak: false },
    { t: 'The whole market fell 4% that week, so nearly every chart shows a similar shape.', weak: true, why: 'When everything moves together, a pattern on one chart is telling you about the market, not about the company. Patterns are most informative when a stock is doing something its peers are not.' }
  ]
};

function makeCandleQuestion(level) {
  const cfg = CANDLE_LEVELS[level] || CANDLE_LEVELS.beginner;
  const pool = PATTERNS.filter(p => cfg.cats.includes(p.cat));
  const answer = pick(pool);
  const advanced = level === 'advanced';
  /* The weakening factor is chosen BEFORE the chart is drawn, so that the
     context always describes the series the player is actually looking at.
     Saying "no trend to reverse" over a visibly trending chart would teach the
     wrong thing twice over. */
  const weakKey = advanced ? pick(Object.keys(CTX_FACTORS)) : null;
  const gen = synthPattern(answer, {
    lowVolume: weakKey === 'volume',
    trend: weakKey === 'trend' ? 0 : undefined
  });

  /* distractors come from the same category so the question is about reading
     the candles, not about spotting the odd one out */
  const distract = PATTERNS.filter(p => p.cat === answer.cat && p.id !== answer.id);
  const opts = [answer];
  while (opts.length < cfg.opts && distract.length) {
    const d = distract.splice(Math.floor(rnd() * distract.length), 1)[0];
    opts.push(d);
  }
  for (let i = opts.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [opts[i], opts[j]] = [opts[j], opts[i]]; }

  const base = {
    level, patternId: answer.id, bars: gen.bars, from: gen.patternFrom,
    q: cfg.cats.length === 1 && answer.cat === 'single'
      ? 'Which single-candle pattern is the highlighted candle?'
      : 'Which pattern is formed by the highlighted candles?',
    opts: opts.map(p => ({ id: p.id, t: p.name })),
    answer: opts.findIndex(p => p.id === answer.id),
    explain: `${answer.name}: ${answer.look} ${answer.means} ${answer.caveat}`,
    bias: answer.bias
  };
  if (!advanced) return base;

  /* Advanced: identify it, then find the factor that undermines it. */
  const keys = Object.keys(CTX_FACTORS);
  const ctx = keys.map(k => {
    const choices = CTX_FACTORS[k];
    if (k === weakKey) return choices.find(c => c.weak);
    if (k === 'trend') {
      /* must match the direction actually drawn on the chart */
      return choices.find(c => !c.weak && c.dir === gen.trendDir) || choices.find(c => !c.weak);
    }
    return pick(choices.filter(c => !c.weak));
  });
  const weakIdx = ctx.findIndex(c => c.weak);
  return Object.assign(base, {
    context: ctx.map(c => c.t),
    follow: {
      q: `You have identified a ${answer.name.toLowerCase()}, which is conventionally read as ${answer.bias === 'directional' ? 'a strong directional signal' : answer.bias}. Looking at the five pieces of context below, which one most WEAKENS it as evidence?`,
      opts: ctx.map(c => c.t),
      answer: weakIdx,
      explain: ctx[weakIdx].why + ' Identifying a pattern correctly is the easy half. Knowing when a correctly identified pattern should be ignored is the half that matters.'
    }
  });
}

/* ============================================================================
 * 4e. "WHAT DO YOU SEE?" — chart analysis challenges on live simulated data
 * ----------------------------------------------------------------------------
 * These freeze a real moment in the running simulation and lay out the evidence
 * — pattern, price action, volume, news, market conditions. The player chooses
 * an action and is shown the trade-offs of ALL of them. There is no correct
 * answer and the app never supplies one.
 * ========================================================================== */

const CHART_CHOICES = [
  { k: 'Buy', t: 'Buy (or add to) the position' },
  { k: 'Sell', t: 'Sell (or reduce) the position' },
  { k: 'Hold', t: 'Hold and do nothing for now' },
  { k: 'Research', t: 'Research further before acting' }
];

/* Assemble the evidence from the actual simulated series. Everything here is
   real data from the run, not a scripted vignette. */
function buildChartChallenge(t) {
  const co = BY_TICKER[t];
  const s = state.prices[t];
  const end = si(state.day);
  const from = Math.max(0, end - 39);
  const bars = s.slice(from, end + 1);
  const found = detectPatterns(bars, Math.max(2, bars.length - 6), bars.length - 1);
  const pat = found.length ? PATTERN_BY_ID[found[found.length - 1].id] : null;
  const patIdx = found.length ? found[found.length - 1].i : null;

  const ret10 = s[end].c / s[Math.max(0, end - 10)].c - 1;
  const ret30 = s[end].c / s[Math.max(0, end - 30)].c - 1;
  const avgV = bars.slice(-21, -1).reduce((a, b) => a + b.v, 0) / 20;
  const volRatio = avgV ? s[end].v / avgV : 1;
  const trendDir = trendBefore(bars, bars.length - 1, 14);
  const levels = findLevels(bars, 40);
  const px = s[end].c;
  const nearLevel = levels.find(l => Math.abs(l.p - px) / px < 0.03);
  const recent = state.news.find(n => (n.targets || []).includes(t) || (n.spill || []).includes(t));
  const r = rsi(bars.map(b => b.c), 14);
  const rsiNow = r[r.length - 1];

  return {
    t, day: state.day, bars, from, pat: pat ? pat.id : null, patIdx,
    evidence: [
      { k: 'Candlestick pattern', v: pat ? `${pat.name} — conventionally read as ${pat.bias}` : 'No recognised pattern in the last few sessions', note: pat ? pat.means : 'Most sessions contain no pattern at all, which is itself worth knowing.' },
      { k: 'Recent price action', v: `${fmtPct(ret10)} over 10 sessions, ${fmtPct(ret30)} over 30. Trend reads as ${trendDir > 0 ? 'up' : trendDir < 0 ? 'down' : 'sideways'}.`, note: 'A reversal pattern only reverses something if there was a trend in place.' },
      { k: 'Volume', v: `${volRatio.toFixed(1)}x the 20-session average`, note: volRatio > 1.6 ? 'Heavy participation — whatever happened, a lot of people acted on it.' : volRatio < 0.7 ? 'Light participation — few people were involved, so the move is easier to undo.' : 'Ordinary participation.' },
      { k: 'Nearby level', v: nearLevel ? `${nearLevel.kind === 'sup' ? 'Support' : 'Resistance'} near ${fmtMoney(nearLevel.p)}, tested ${nearLevel.hits} times` : 'No level with repeated history nearby', note: 'Levels are zones where something might happen, not where something must.' },
      { k: 'RSI (14)', v: rsiNow ? rsiNow.toFixed(0) : 'n/a', note: rsiNow > 70 ? 'Conventionally called overbought — which only means the recent move has been one-sided, not that it must stop.' : rsiNow < 30 ? 'Conventionally called oversold — one-sided selling, not a valuation judgement.' : 'Neutral momentum.' },
      { k: 'Recent news', v: recent ? recent.head : 'Nothing specific to this company recently', note: recent ? recent.why.split('. ')[0] + '.' : 'Without a catalyst, chart patterns are describing positioning alone.' },
      { k: 'Market conditions', v: `${marketTrend().label}, ${macroRegime().label.toLowerCase()} backdrop, policy rate ${state.macro.rate.toFixed(2)}%`, note: 'When the whole market moves, a single chart tells you less about the company.' },
      { k: 'Your position', v: sharesHeld(t) ? `${fmtNum(sharesHeld(t))} shares at an average cost of ${fmtMoney(state.positions[t].avg)} (${fmtPct(px / state.positions[t].avg - 1)})` : 'You do not own this', note: 'What you paid is a fact about your past, not about the company\'s future.' }
    ],
    notes: {
      Buy: `Adding here means you believe the evidence points to demand outweighing supply from this price. The pattern and ${volRatio > 1.3 ? 'the heavy volume' : 'the recent action'} are the case for it. Against it: you would be increasing exposure to a single company after a ${ret10 >= 0 ? 'rise' : 'fall'} of ${fmtPct(Math.abs(ret10)).replace('+', '')} in ten sessions, and a chart pattern contains no information about whether the business is improving. Position size decides whether being wrong here is a lesson or a problem.`,
      Sell: `Selling removes the exposure and the uncertainty. It also crystallises the outcome, pays the spread, and requires a second correct decision about when — or whether — to return. Selling is most defensible when the reason you bought has been disproved${recent ? `, and the most recent news here is the place to check that` : `, and there has been no company news to disprove it`}. Selling because a chart looks uncomfortable is a different decision, and a more expensive one on average.`,
      Hold: `Doing nothing costs nothing and avoids acting on a few sessions of price movement. It is the right answer more often than beginners expect. The risk is that "hold" becomes a way of not deciding — if the evidence would not persuade you to buy at this price today, holding is a decision you should be able to defend on its own terms.`,
      Research: `The cheapest move: find out what changed. ${recent ? `There is recent news here — reading why it mattered, and to whom, tells you far more than the candles do.` : `With no recent catalyst, the useful questions are about valuation and expectations rather than about the chart.`} The cost is time, and the price may move while you look. Research is not a way of avoiding a decision, it is a way of making a better one.`
    },
    close: 'None of these four is marked correct, because none of them is. The evidence above supports a range of reasonable actions depending on your time horizon, your position size and what you already believe about the business. What separates good decisions from bad ones is not picking the winning option — it is whether you can state, before you act, what would tell you that you were wrong.'
  };
}

 * 5. ENGINE — helpers, state, calendar
 * ========================================================================== */

/* --- 5a. Formatting -------------------------------------------------------- */
const fmtMoney = (v, dp = 2) =>
  (v < 0 ? '-' : '') + '$' + Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: dp, maximumFractionDigits: dp });
const fmtCompact = v => {
  const a = Math.abs(v), s = v < 0 ? '-' : '';
  if (a >= 1e12) return s + '$' + (a / 1e12).toFixed(2) + 'T';
  if (a >= 1e9)  return s + '$' + (a / 1e9).toFixed(1) + 'B';
  if (a >= 1e6)  return s + '$' + (a / 1e6).toFixed(1) + 'M';
  if (a >= 1e3)  return s + '$' + (a / 1e3).toFixed(1) + 'K';
  return s + '$' + a.toFixed(0);
};
const fmtPct = (v, dp = 2) => (v > 0 ? '+' : '') + (v * 100).toFixed(dp) + '%';
const fmtNum = (v, dp = 0) => v.toLocaleString('en-US', { minimumFractionDigits: dp, maximumFractionDigits: dp });
const arrow = v => v > 0.00005 ? '▲' : v < -0.00005 ? '▼' : '■';
const signClass = v => v > 0.00005 ? 'up' : v < -0.00005 ? 'down' : 'mut';
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const esc = s => String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));

/* --- 5b. Seeded random ----------------------------------------------------
 * Everything random in this simulation comes from one seeded generator, so a
 * given seed always produces the same market. That makes runs reproducible —
 * useful in a classroom, and essential for save/restore to be honest.
 */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hashSeed(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
let RNG = mulberry32(1);
const rnd = () => RNG();
const rndIn = (lo, hi) => lo + RNG() * (hi - lo);
const pick = arr => arr[Math.floor(RNG() * arr.length)];
/* Box–Muller: a normal distribution for the ordinary no-news wiggle. */
function gauss() {
  let u = 0, v = 0;
  while (u === 0) u = RNG();
  while (v === 0) v = RNG();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

/* --- 5c. Constants --------------------------------------------------------- */
const BACKFILL   = 110;    // trading days of simulated history before day 1
const SPREAD     = 0.0005; // bid-ask spread: you buy 0.05% above mid, sell 0.05% below
const BASE_RATE   = 4.50;  // starting policy interest rate, %
const RATE_IMPACT = 0.030; // price impact per 1 percentage point of rate change, x rateBeta
const START_DATE  = new Date(2026, 0, 5); // a Monday
const HOLIDAYS = ['2026-01-19', '2026-02-16', '2026-04-03', '2026-05-25', '2026-06-19'];

const TIER_LABEL = { minor: 'Minor', moderate: 'Moderate', major: 'Major', market: 'Market-wide' };

/* --- 5d. Trading calendar -------------------------------------------------
 * Sessions run Monday to Friday and skip market holidays. The days the market
 * is shut still exist — news can break over a weekend, and it shows up as a
 * gap in Monday's opening price rather than as a gradual move.
 */
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const isTradingDay = d => d.getDay() !== 0 && d.getDay() !== 6 && !HOLIDAYS.includes(iso(d));

/* Trading dates for the simulated history that precedes session 1, walked
   backwards from the start date so the charts carry real dates throughout. */
function buildPreCalendar(n) {
  const out = [];
  const cur = new Date(START_DATE.getTime());
  while (out.length < n) {
    cur.setDate(cur.getDate() - 1);
    if (isTradingDay(cur)) out.unshift(cur.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }));
  }
  return out;
}

function buildCalendar(n) {
  const out = [];
  const cur = new Date(START_DATE.getTime());
  while (out.length < n) {
    if (isTradingDay(cur)) {
      const closed = [];
      const look = new Date(cur.getTime());
      // record which non-trading days preceded this session
      for (let k = 1; k <= 4; k++) {
        look.setDate(cur.getDate() - k);
        if (out.length === 0) break;
        if (isTradingDay(look)) break;
        closed.unshift(look.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' }));
      }
      out.push({
        iso: iso(cur),
        label: cur.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }),
        long: cur.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }),
        closedBefore: closed
      });
    }
    cur.setDate(cur.getDate() + 1);
  }
  return out;
}

/* --- 5e. Application state ------------------------------------------------- */
let state = null;

function blankState(opts) {
  return {
    v: 2,
    seed: opts.seed,
    length: opts.length,
    day: 1,                    // current session, 1-based
    startCash: opts.cash,
    cash: opts.cash,
    positions: {},             // ticker -> { sh, avg, invested, firstDay }
    tx: [],
    queued: [],                // orders placed while a stock is halted after the close
    news: [],
    effects: [],
    pendingOpen: [],           // events announced after the close; they hit tomorrow's open
    prices: {},                // ticker -> [{ o, c, drivers: [{l, p, ev}] }]
    fund: {},                  // mutable fundamentals (earnings change them)
    index: [],                 // cap-weighted benchmark, one value per series index
    hist: [],                  // portfolio value history
    macro: { rate: BASE_RATE, inflation: 2.9, growth: 2.1, sentiment: 0.05, rateExpect: 0 },
    schedule: { fomc: [], cpi: [], earnings: {}, exDiv: {} },
    watch: ['NVDA', 'AAPL', 'JPM'],
    learn: {
      concepts: {}, quiz: {}, scenarios: {}, research: {}, coach: {}, eventReads: 0,
      patterns: {},          // candlestick patterns opened in the School
      candleQuiz: {},        // "Read the Candle" results by level
      chartReads: {},        // "What do you see?" challenges answered
      lab: { opens: 0, indicators: {}, levels: 0, trends: 0, compares: 0 },
      flipsSeen: {}          // counter-intuitive reactions the player read the explanation for
    },
    stats: { buys: 0, sells: 0, researchedBeforeBuy: 0, boughtUnresearched: 0, panicSells: 0, quickFlips: 0,
             spreadPaid: 0, dividends: 0, maxDD: 0, peak: opts.cash, cashDays: 0, etfBought: 0, rebalances: 0 },
    eventImpact: {},           // news id -> cumulative $ effect on YOUR holdings
    activeScenario: null,
    ended: false,
    calendar: buildCalendar(opts.length + 2),
    preCal: buildPreCalendar(BACKFILL)
  };
}

/* series index for a given game day (day 1 -> first live session) */
const si = day => BACKFILL + (day - 1);
const seriesOf = t => state.prices[t];
const barAt = (t, day) => state.prices[t][si(day)];
const priceOf = t => state.prices[t][si(state.day)].c;
const prevCloseOf = t => { const s = state.prices[t]; const i = si(state.day); return i > 0 ? s[i - 1].c : s[0].c; };
const dayChangeOf = t => { const p = priceOf(t), q = prevCloseOf(t); return q ? p / q - 1 : 0; };
const fundOf = t => state.fund[t];


/* --- 5f. Building one bar --------------------------------------------------
 * A candle needs four prices and a volume, not two. The high and low are drawn
 * around the open-to-close body, scaled by how big the session's move was, and
 * volume rises with the size of the move and with event activity — which is
 * what makes volume worth checking alongside a candlestick pattern.
 */
function makeBar(o, c, co, boost) {
  boost = boost || 0;
  const top = Math.max(o, c), bot = Math.min(o, c);
  const span = Math.max(Math.abs(c - o), c * (co.vol || 0.012) * 0.45);
  const h = +(top + Math.abs(gauss()) * span * (0.55 + boost * 0.35)).toFixed(2);
  const l = +Math.max(0.25, bot - Math.abs(gauss()) * span * (0.55 + boost * 0.35)).toFixed(2);
  const move = o ? Math.abs(c / o - 1) : 0;
  const turnover = co.shares * 1e9 * 0.0045;
  const v = Math.max(1000, Math.round(turnover * (0.5 + 0.85 * Math.min(3.2, move / (co.vol || 0.012)) + Math.abs(gauss()) * 0.28) * (1 + boost * 0.8)));
  return { o: +o.toFixed(2), h, l, c: +c.toFixed(2), v };
}

/* An ETF is not a company: its price is the value of what it holds. This
   returns the basket's return for the day plus the named contributors, so the
   research card can show WHY the fund moved rather than just that it did. */
function etfDayReturn(co, idx) {
  const e = co.etf;
  if (e.holds === 'all' || Array.isArray(e.holds)) {
    const list = e.holds === 'all' ? STOCKS : e.holds.map(t => BY_TICKER[t]).filter(Boolean);
    let wsum = 0, ret = 0;
    const contrib = [];
    list.forEach(m => {
      const s = state.prices[m.t];
      if (!s || !s[idx] || !s[idx - 1]) return;
      const w = s[idx - 1].c * m.shares * (e.smallTilt && m.shares < 1 ? 1 + e.smallTilt : 1);
      const r = s[idx].c / s[idx - 1].c - 1;
      wsum += w; ret += w * r;
      contrib.push({ t: m.t, c: w * r });
    });
    if (!wsum) return { r: 0, contrib: [] };
    contrib.forEach(x => { x.c /= wsum; });
    contrib.sort((a, b) => Math.abs(b.c) - Math.abs(a.c));
    return { r: ret / wsum, contrib: contrib.slice(0, 3), n: list.length };
  }
  /* Synthetic baskets (small caps, international) have no modelled holdings,
     so they are driven by the same macro forces at their own sensitivities. */
  const m = state.macro;
  const syn = e.synth || {};
  let r = (syn.drift || 0.0002) + m.sentiment * 0.0020 * co.mktBeta + (m.growth - 2.0) * 0.0007 * (syn.cyc || 0.7);
  r += -(m.rate - BASE_RATE) * co.rateBeta * 0.0008;
  r += gauss() * co.vol * 0.8;
  const notes = [];
  if (syn.fx) {
    const fx = gauss() * 0.0035;
    r += fx;
    notes.push({ l: `Currency: the dollar ${fx < 0 ? 'strengthened' : 'weakened'}, which ${fx < 0 ? 'reduces' : 'increases'} the value of overseas holdings in dollar terms`, p: fx });
  }
  return { r, contrib: [], notes };
}

/* ============================================================================
 * 6. ENGINE — market construction
 * ========================================================================== */

/* Build a plausible price history so the app opens with real-looking charts,
 * a 52-week range and a few historical events to reference. The backfill uses
 * the same machinery as live play: drift, a slow sentiment wave, and labelled
 * one-off shocks — never unexplained jumps. */
function buildBackfill() {
  const HIST_EVENTS = [
    { at: 0.14, tag: 'ai',     l: 'Sector re-rating on AI demand',        p: 0.055 },
    { at: 0.26, tag: 'rates',  l: 'Rate-cut expectations pushed back',    p: -0.035 },
    { at: 0.38, tag: 'earn',   l: 'Quarterly results season',            p: 0.028 },
    { at: 0.52, tag: 'macro',  l: 'Growth scare across the market',      p: -0.048 },
    { at: 0.63, tag: 'macro',  l: 'Recovery as recession fears faded',   p: 0.042 },
    { at: 0.77, tag: 'earn',   l: 'Results season, mixed reactions',     p: 0.022 },
    { at: 0.88, tag: 'rates',  l: 'Inflation cooled, yields fell',       p: 0.030 }
  ];
  STOCKS.forEach(co => {
    /* walk backwards from today's starting price so the series ENDS where the
       company record says it should, then build candles from the path */
    const rev = [];
    let p = co.price, wave = rndIn(0, Math.PI * 2);
    const boosts = [];
    for (let i = BACKFILL - 1; i >= 0; i--) {
      rev.push(p);
      let chg = 0.0004 * co.mktBeta;
      chg += Math.sin(wave + i * 0.09) * 0.0012 * co.mktBeta;
      chg += gauss() * co.vol * 0.75;
      let boost = 0;
      HIST_EVENTS.forEach(h => {
        if (i === Math.round(h.at * BACKFILL)) {
          let f = 1;
          if (h.tag === 'ai')    f = co.tags.includes('ai') ? 1.8 : 0.35;
          if (h.tag === 'rates') f = -co.rateBeta * 0.9;
          if (h.tag === 'macro') f = co.mktBeta;
          if (h.tag === 'earn')  f = 0.6 + co.vol * 25;
          chg += h.p * f; boost = 1.4;
        }
      });
      boosts.push(boost);
      p = p / (1 + chg);
      if (p < 1) p = 1;
    }
    rev.reverse(); boosts.reverse();
    rev[rev.length - 1] = co.price;
    const series = rev.map((c, i) => {
      const prevC = i ? rev[i - 1] : c;
      const o = prevC * (1 + gauss() * co.vol * 0.25);
      return makeBar(o, c, co, boosts[i]);
    });
    series.push(makeBar(co.price, co.price, co, 0));
    state.prices[co.t] = series;
  });

  /* ETFs are priced from their baskets, so they are built after the shares. */
  COMPANIES.filter(c => c.kind === 'etf').forEach(co => {
    const series = [];
    let p = co.price;
    const path = [p];
    for (let i = BACKFILL - 1; i >= 1; i--) {
      const r = etfBackfillReturn(co, i);
      p = p / (1 + r);
      path.push(p);
    }
    path.reverse();
    path[path.length - 1] = co.price;
    path.forEach((c, i) => {
      const prevC = i ? path[i - 1] : c;
      series.push(makeBar(prevC * (1 + gauss() * co.vol * 0.18), c, co, 0));
    });
    series.push(makeBar(co.price, co.price, co, 0));
    state.prices[co.t] = series;
  });
}

/* During backfill the basket's own bars already exist, so an ETF's historical
   return is simply the weighted return of what it holds on that day. */
function etfBackfillReturn(co, i) {
  const e = co.etf;
  const list = e.holds === 'all' ? STOCKS : Array.isArray(e.holds) ? e.holds.map(t => BY_TICKER[t]).filter(Boolean) : null;
  if (!list) return 0.0003 + gauss() * co.vol;
  let wsum = 0, ret = 0;
  list.forEach(m => {
    const s = state.prices[m.t];
    if (!s || !s[i] || !s[i - 1]) return;
    const w = s[i - 1].c * m.shares;
    wsum += w; ret += w * (s[i].c / s[i - 1].c - 1);
  });
  return wsum ? ret / wsum : 0;
}

/* Cap-weighted benchmark. Owning "the market" is the comparison every active
   decision is really being measured against. */
function indexValue(idx) {
  let cap = 0, base = 0;
  STOCKS.forEach(co => {   /* ETFs hold these companies, so counting them too would double-count */
    cap  += state.prices[co.t][idx].c * co.shares;
    base += co.price * co.shares;
  });
  return 100 * cap / base;
}
function rebuildIndex() {
  state.index = [];
  const len = state.prices[COMPANIES[0].t].length;
  for (let i = 0; i < len; i++) state.index.push(indexValue(i));
}

/* Schedule the things that are known in advance: central bank meetings,
   inflation releases, earnings dates and dividend dates. Real markets know
   these dates too, which is why the surprises come from the content, not the
   timing. */
function buildSchedule() {
  const L = state.length;
  for (let d = 9; d <= L; d += 21) state.schedule.fomc.push(d);
  for (let d = 5; d <= L; d += 20) state.schedule.cpi.push(d);
  STOCKS.forEach(co => {
    const days = [];
    for (let d = co.earnOffset; d <= L; d += 63) days.push(d);
    state.schedule.earnings[co.t] = days;
    if (co.div > 0) {
      const ex = [];
      for (let d = (co.earnOffset * 2 + 5) % 40 + 4; d <= L; d += 63) ex.push(d);
      state.schedule.exDiv[co.t] = ex;
    }
    state.fund[co.t] = {
      eps: co.eps, revenue: co.revenue, netIncome: co.netIncome, div: co.div,
      basePE: co.eps > 0 ? co.price / co.eps : null,
      basePS: co.price / (co.revenue / co.shares),
      lastSurprise: null, lastGuide: null
    };
  });
  COMPANIES.filter(c => c.kind === 'etf').forEach(co => {
    state.fund[co.t] = { eps: 0, revenue: 0, netIncome: 0, div: co.div, basePE: null, basePS: null, lastSurprise: null, lastGuide: null };
    const ex = [];
    for (let d = (co.earnOffset == null ? 12 : co.earnOffset); d <= state.length; d += 63) ex.push(d);
    state.schedule.exDiv[co.t] = [18 + (COMPANIES.indexOf(co) % 9), 81 + (COMPANIES.indexOf(co) % 9)].filter(d => d <= state.length);
  });
}

function newGame(opts) {
  RNG = mulberry32(hashSeed(String(opts.seed)));
  state = blankState(opts);
  buildBackfill();
  buildSchedule();
  rebuildIndex();
  state.hist.push({ day: 0, value: opts.cash, cash: opts.cash, invested: 0, index: 100 });
  pushNews({
    tier: 'minor', cat: 'Welcome', scope: 'market', targets: [],
    head: 'Simulation begins — ' + state.calendar[0].long,
    body: 'You start with ' + fmtMoney(opts.cash, 0) + ' in virtual cash and ' + opts.length + ' trading sessions. Every price move in this simulation has a stated cause: an event, an earnings result, a change in interest rates, a valuation adjustment, or ordinary buying and selling between investors.',
    why: 'Before buying anything, it is worth deciding what you are trying to learn. Trying to finish with the largest number is the least interesting use of this tool — and the end-of-game report deliberately grades how you invested, not only how much you made.',
    concepts: ['supply-demand', 'long-vs-short']
  });
  save();
}

/* ============================================================================
 * 7. ENGINE — macro regime
 * ========================================================================== */

function macroRegime() {
  const m = state.macro;
  if (m.sentiment > 0.30 && m.growth > 1.8) return { k: 'expansion', label: 'Expansion', desc: 'Growth is solid and confidence is high. Cyclical businesses — banks, airlines, consumer discretionary — usually lead in this phase.' };
  if (m.sentiment < -0.30 && m.growth < 1.2) return { k: 'contraction', label: 'Contraction', desc: 'Growth is deteriorating and confidence is poor. Defensive sectors — staples, healthcare, utilities — tend to hold up best.' };
  if (m.inflation > 3.4) return { k: 'inflationary', label: 'Inflationary', desc: 'Prices are rising faster than the central bank wants, which keeps interest rates high and pressures companies whose profits are far in the future.' };
  if (m.sentiment < -0.12) return { k: 'slowdown', label: 'Slowdown', desc: 'Momentum is fading. Markets are pricing in weaker growth ahead, and the reaction to good news tends to be muted.' };
  return { k: 'steady', label: 'Steady', desc: 'No single force dominates. Individual company news matters more than the macro backdrop in this kind of market.' };
}

/* Bull / bear is measured the way the market measures it: distance from the
   recent high and low of the benchmark, not from an arbitrary starting point. */
function marketTrend() {
  const idx = state.index, end = si(state.day);
  const from = Math.max(0, end - 45);
  const win = idx.slice(from, end + 1);
  const hi = Math.max(...win), lo = Math.min(...win), now = idx[end];
  if (now >= lo * 1.13 && now > win[0]) return { k: 'bull', label: 'Bull trend', desc: 'The benchmark is well above its recent low and rising. In this kind of market, dips are bought quickly and bad news is often shrugged off — which can make risky positions feel safer than they are.' };
  if (now <= hi * 0.90) return { k: 'bear', label: 'Bear trend', desc: 'The benchmark is well below its recent high. Rallies tend to fade and good news gets sold. The same earnings report can produce the opposite reaction to the one it would get in a rising market.' };
  return { k: 'choppy', label: 'Range-bound', desc: 'The benchmark is moving sideways. Sector and company news drives more of the return than market direction does.' };
}

/* Sector rotation. In a strengthening economy money moves toward cyclical
   businesses (banks, airlines, discretionary) and out of defensives; in a
   weakening one it does the reverse. Modelling it explicitly means a large part
   of what would otherwise be unexplained drift gets a real, teachable cause. */
function updateSectorTilt() {
  state.tilt = state.tilt || {};
  const m = state.macro;
  SECTORS.forEach(s => {
    const members = COMPANIES.filter(c => c.sector === s);
    const cyc = members.reduce((a, c) => a + c.cyclical, 0) / members.length;
    const bias = (cyc - 0.5) * (m.sentiment * 0.0055 + (m.growth - 2.0) * 0.0022);
    const prev = state.tilt[s] || 0;
    state.tilt[s] = clamp(prev * 0.6 + bias + gauss() * 0.0013, -0.0065, 0.0065);
  });
}

function driftMacro() {
  const m = state.macro;
  // gentle mean reversion — moods and growth rates do not persist forever
  m.sentiment += (0.05 - m.sentiment) * 0.05 + gauss() * 0.02;
  m.growth    += (2.0 - m.growth) * 0.03 + gauss() * 0.03;
  m.inflation += (2.5 - m.inflation) * 0.02 + gauss() * 0.02;
  m.rateExpect *= 0.88;
  m.sentiment = clamp(m.sentiment, -1, 1);
  m.growth    = clamp(m.growth, -1.5, 5);
  m.inflation = clamp(m.inflation, 0.4, 7);
}

/* ============================================================================
 * 8. ENGINE — news, events and earnings
 * ========================================================================== */

let NEWS_SEQ = 1;

function pushNews(o) {
  const n = Object.assign({
    id: 'n' + (NEWS_SEQ++),
    day: state ? state.day : 0,
    date: state ? (state.calendar[Math.min(state.day - 1, state.calendar.length - 1)] || {}).label : '',
    reactions: {}       // ticker -> % move attributed to this story
  }, o);
  state.news.unshift(n);
  return n;
}

function matches(co, m) {
  if (!m) return false;
  if (m.market) return true;
  if (m.ticker) return co.t === m.ticker;
  if (m.sector) return co.sector === m.sector;
  if (m.tag) return m.tag === 'any' || co.tags.includes(m.tag);
  return false;
}

function addEffect(evId, label, match, shock, drift, days, factor) {
  const q = [shock];
  let d = drift;
  for (let i = 1; i < Math.max(1, days); i++) { q.push(d); d *= 0.68; }
  state.effects.push({ evId, label, match, queue: q, factor: factor == null ? 1 : factor });
}

/* How far a stock has run relative to the market over the last 20 sessions.
   This is what makes an event "already priced in". */
function runUp(t, n = 20) {
  const s = state.prices[t], i = si(state.day), j = Math.max(0, i - n);
  const stock = s[i].c / s[j].c - 1;
  const mkt = state.index[i] / state.index[j] - 1;
  return stock - mkt;
}

function eligible(tpl) {
  const last = state.lastFired && state.lastFired[tpl.id];
  if (last != null && state.day - last < tpl.cooldown) return false;
  if (tpl.pick) {
    const pool = candidatesFor(tpl);
    if (!pool.length) return false;
  }
  return tpl.weight > 0;
}

function candidatesFor(tpl) {
  const p = tpl.pick || { market: true };
  if (p.market) return STOCKS;
  if (p.ticker) return STOCKS.filter(c => c.t === p.ticker);
  if (p.sector) return STOCKS.filter(c => c.sector === p.sector);
  if (p.tag) return p.tag === 'any' ? STOCKS : STOCKS.filter(c => c.tags.includes(p.tag));
  return STOCKS;
}

/* Fire one template: write the story, then create the price effects that the
   story explains. The news is never decorative — these two things are the same
   object, which is the whole point of the design. */
function fireEvent(tplId, forced) {
  const tpl = EVENT_TEMPLATES.find(t => t.id === tplId);
  if (!tpl) return null;
  state.lastFired = state.lastFired || {};
  state.lastFired[tpl.id] = state.day;

  const pool = candidatesFor(tpl);
  const c = pick(pool);
  let shock = tpl.effect.shock, drift = tpl.effect.drift, note = '';

  /* Expectations adjustment: if a stock has already run hard into good news,
     the good news is largely in the price and the reaction shrinks or inverts. */
  if (tpl.pricedIn && tpl.scope === 'company') {
    const ru = runUp(c.t);
    if (ru > 0.09) {
      shock = shock * -0.45; drift = drift * -0.3;
      note = `${c.t} had already risen ${fmtPct(ru, 1)} more than the market over the past month going into this. Much of the good news was in the price before the announcement, so buyers who acted on the anticipation sold into the confirmation — the stock fell on news that was, on its own, positive.`;
    } else if (ru < -0.08) {
      shock = shock * 1.35;
      note = `${c.t} had lagged the market by ${fmtPct(Math.abs(ru), 1)} over the past month, so expectations going in were low. The same news lands harder when little of it was already assumed.`;
    }
  }

  const targetsFor = scope => {
    if (scope === 'market') return { market: true };
    if (scope === 'sector') {
      const p = tpl.pick || {};
      return p.sector ? { sector: p.sector } : { tag: p.tag };
    }
    return { ticker: c.t };
  };
  const match = targetsFor(tpl.scope);
  const affected = STOCKS.filter(co => matches(co, match)).map(co => co.t);
  const spillTickers = [];
  (tpl.spill || []).forEach(sp => {
    STOCKS.forEach(co => {
      if (matches(co, sp) && !affected.includes(co.t)) spillTickers.push(co.t);
    });
  });

  /* A "flip" is a reaction that runs against what the headline suggests. It can
     be built into the template, or produced by the expectations mechanism when
     a stock has already run up into good news. Either way it is flagged so the
     UI can highlight it and the report can count whether the player read it. */
  let flip = tpl.flip || null;
  if (!flip && tpl.pricedIn && tpl.effect.shock > 0 && shock < 0) flip = 'good-news-fell';
  const news = pushNews({
    tplId: tpl.id, tier: tpl.tier, scope: tpl.scope, cat: tpl.cat,
    head: tpl.head(c), body: tpl.body(c), why: tpl.why(c),
    note, targets: affected, spill: [...new Set(spillTickers)],
    concepts: tpl.concepts || [], surprise: !!tpl.surprise, flip,
    flipNote: flip && !note ? (flip === 'good-news-fell'
      ? 'Read the headline, then read the price. They point in opposite directions, and the explanation above is why. This is not a glitch — it is the single most common way beginners misread a market.'
      : 'The headline sounds negative and the shares rose. The explanation above says why: the market was measuring this against what it already feared, not against perfection.') : null
  });

  addEffect(news.id, tpl.head(c), match, shock, drift, tpl.effect.days, 1);
  (tpl.spill || []).forEach(sp => {
    const m = sp.sector ? { sector: sp.sector } : { tag: sp.tag };
    addEffect(news.id, tpl.head(c) + ' (knock-on effect)', m, shock * sp.factor, drift * sp.factor, tpl.effect.days, 1);
  });

  if (tpl.macro) {
    const m = state.macro;
    if (tpl.macro.rate)       applyRateChange(tpl.macro.rate, news.id);
    if (tpl.macro.rateExpect) applyRateChange(tpl.macro.rateExpect, news.id, true);
    if (tpl.macro.inflation)  m.inflation = clamp(m.inflation + tpl.macro.inflation, 0.4, 7);
    if (tpl.macro.growth)     m.growth = clamp(m.growth + tpl.macro.growth, -1.5, 5);
    if (tpl.macro.sentiment)  m.sentiment = clamp(m.sentiment + tpl.macro.sentiment, -1, 1);
  }
  return news;
}

/* A rate change is not one number applied to everything. It is repriced
   through each company's own sensitivity, which is why a single headline sends
   a utility down and a bank up. */
function applyRateChange(delta, evId, expectationOnly) {
  if (!expectationOnly) state.macro.rate = clamp(state.macro.rate + delta, 0, 12);
  const w = expectationOnly ? 0.5 : 1;
  const label = expectationOnly
    ? `Interest-rate expectations shifted ${delta > 0 ? 'higher' : 'lower'}`
    : `Policy rate ${delta > 0 ? 'raised' : 'cut'} to ${(state.macro.rate).toFixed(2)}%`;
  STOCKS.forEach(co => {
    const imp = -delta * co.rateBeta * RATE_IMPACT * w;
    if (Math.abs(imp) < 0.0004) return;
    addEffect(evId, label + ` — ${co.t} ${co.rateBeta > 0 ? 'benefits from' : 'is hurt by'} higher rates`,
      { ticker: co.t }, imp * 0.65, imp * 0.2, 3, 1);
  });
}

/* --- Earnings -------------------------------------------------------------
 * Reported after the close, reacting at the next open — as in real markets.
 * The reaction is built from three things: the surprise versus the estimate,
 * the guidance for next quarter, and how much the stock had already moved in
 * anticipation. That third term is what produces "beat and fell".
 */
function runEarnings(t) {
  const co = BY_TICKER[t], f = state.fund[t];
  const g = macroGrowthFactor();
  const estEps = +(f.eps / 4 * (1 + co.growth / 4) * g).toFixed(2);
  let surprise = gauss() * 0.075 + 0.018;             // companies usually beat, slightly
  surprise = clamp(surprise, -0.30, 0.30);
  const actual = +(estEps * (1 + surprise)).toFixed(2);
