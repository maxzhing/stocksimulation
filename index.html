/* --- 5a. Formatting -------------------------------------------------------- */
const fmtMoney = (v, dp = 2) =>
  (v < 0 ? '-' : '') + '$' + Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: dp, maximumFractionDigits: dp });
const fmtCompact = v => {
  const a = Math.abs(v), s = v < 0 ? '-' : '';
  if (a >= 1e12) return s + '$' + (a / 1e12).toFixed(2) + 'T';
  if (a >= 1e9)  return s + '$' + (a / 1e9).toFixed(1) + 'B';
  if (a >= 1e6)  return s + '$' + (a / 1e6).toFixed(1) + 'M';
  if (a >= 1e3)  return s + '$' + (a / 1e3).toFixed(1) + 'K';
  return s + '$' + a.toFixed(0);
};
const fmtPct = (v, dp = 2) => (v > 0 ? '+' : '') + (v * 100).toFixed(dp) + '%';
const fmtNum = (v, dp = 0) => v.toLocaleString('en-US', { minimumFractionDigits: dp, maximumFractionDigits: dp });
const arrow = v => v > 0.00005 ? '▲' : v < -0.00005 ? '▼' : '■';
const signClass = v => v > 0.00005 ? 'up' : v < -0.00005 ? 'down' : 'mut';
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const esc = s => String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));

/* --- 5b. Seeded random ----------------------------------------------------
 * Everything random in this simulation comes from one seeded generator, so a
 * given seed always produces the same market. That makes runs reproducible —
 * useful in a classroom, and essential for save/restore to be honest.
 */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hashSeed(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
let RNG = mulberry32(1);
const rnd = () => RNG();
const rndIn = (lo, hi) => lo + RNG() * (hi - lo);
const pick = arr => arr[Math.floor(RNG() * arr.length)];
/* Box–Muller: a normal distribution for the ordinary no-news wiggle. */
function gauss() {
  let u = 0, v = 0;
  while (u === 0) u = RNG();
  while (v === 0) v = RNG();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

/* --- 5c. Constants --------------------------------------------------------- */
const BACKFILL   = 110;    // trading days of simulated history before day 1
const SPREAD     = 0.0005; // bid-ask spread: you buy 0.05% above mid, sell 0.05% below
const BASE_RATE   = 4.50;  // starting policy interest rate, %
const RATE_IMPACT = 0.030; // price impact per 1 percentage point of rate change, x rateBeta
const START_DATE  = new Date(2026, 0, 5); // a Monday
const HOLIDAYS = ['2026-01-19', '2026-02-16', '2026-04-03', '2026-05-25', '2026-06-19'];

const TIER_LABEL = { minor: 'Minor', moderate: 'Moderate', major: 'Major', market: 'Market-wide' };

/* --- 5d. Trading calendar -------------------------------------------------
 * Sessions run Monday to Friday and skip market holidays. The days the market
 * is shut still exist — news can break over a weekend, and it shows up as a
 * gap in Monday's opening price rather than as a gradual move.
 */
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const isTradingDay = d => d.getDay() !== 0 && d.getDay() !== 6 && !HOLIDAYS.includes(iso(d));

/* Trading dates for the simulated history that precedes session 1, walked
   backwards from the start date so the charts carry real dates throughout. */
function buildPreCalendar(n) {
  const out = [];
  const cur = new Date(START_DATE.getTime());
  while (out.length < n) {
    cur.setDate(cur.getDate() - 1);
    if (isTradingDay(cur)) out.unshift(cur.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }));
  }
  return out;
}

function buildCalendar(n) {
  const out = [];
  const cur = new Date(START_DATE.getTime());
  while (out.length < n) {
    if (isTradingDay(cur)) {
      const closed = [];
      const look = new Date(cur.getTime());
      // record which non-trading days preceded this session
      for (let k = 1; k <= 4; k++) {
        look.setDate(cur.getDate() - k);
        if (out.length === 0) break;
        if (isTradingDay(look)) break;
        closed.unshift(look.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' }));
      }
      out.push({
        iso: iso(cur),
        label: cur.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }),
        long: cur.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }),
        closedBefore: closed
      });
    }
    cur.setDate(cur.getDate() + 1);
  }
  return out;
}

/* --- 5e. Application state ------------------------------------------------- */
let state = null;

function blankState(opts) {
  return {
    v: 1,
    seed: opts.seed,
    length: opts.length,
    day: 1,                    // current session, 1-based
    startCash: opts.cash,
    cash: opts.cash,
    positions: {},             // ticker -> { sh, avg, invested, firstDay }
    tx: [],
    queued: [],                // orders placed while a stock is halted after the close
    news: [],
    effects: [],
    pendingOpen: [],           // events announced after the close; they hit tomorrow's open
    prices: {},                // ticker -> [{ o, c, drivers: [{l, p, ev}] }]
    fund: {},                  // mutable fundamentals (earnings change them)
    index: [],                 // cap-weighted benchmark, one value per series index
    hist: [],                  // portfolio value history
    macro: { rate: BASE_RATE, inflation: 2.9, growth: 2.1, sentiment: 0.05, rateExpect: 0 },
    schedule: { fomc: [], cpi: [], earnings: {}, exDiv: {} },
    watch: ['NVDA', 'AAPL', 'JPM'],
    learn: { concepts: {}, quiz: {}, scenarios: {}, research: {}, coach: {}, eventReads: 0 },
    stats: { buys: 0, sells: 0, researchedBeforeBuy: 0, panicSells: 0, quickFlips: 0, spreadPaid: 0, dividends: 0, maxDD: 0, peak: opts.cash, cashDays: 0 },
    eventImpact: {},           // news id -> cumulative $ effect on YOUR holdings
    activeScenario: null,
    ended: false,
    calendar: buildCalendar(opts.length + 2),
    preCal: buildPreCalendar(BACKFILL)
  };
}

/* series index for a given game day (day 1 -> first live session) */
const si = day => BACKFILL + (day - 1);
const seriesOf = t => state.prices[t];
const barAt = (t, day) => state.prices[t][si(day)];
const priceOf = t => state.prices[t][si(state.day)].c;
const prevCloseOf = t => { const s = state.prices[t]; const i = si(state.day); return i > 0 ? s[i - 1].c : s[0].c; };
const dayChangeOf = t => { const p = priceOf(t), q = prevCloseOf(t); return q ? p / q - 1 : 0; };
const fundOf = t => state.fund[t];

/* ============================================================================
 * 6. ENGINE — market construction
 * ========================================================================== */

/* Build a plausible price history so the app opens with real-looking charts,
 * a 52-week range and a few historical events to reference. The backfill uses
 * the same machinery as live play: drift, a slow sentiment wave, and labelled
 * one-off shocks — never unexplained jumps. */
function buildBackfill() {
  const HIST_EVENTS = [
    { at: 0.14, tag: 'ai',     l: 'Sector re-rating on AI demand',        p: 0.055 },
    { at: 0.26, tag: 'rates',  l: 'Rate-cut expectations pushed back',    p: -0.035 },
    { at: 0.38, tag: 'earn',   l: 'Quarterly results season',            p: 0.028 },
    { at: 0.52, tag: 'macro',  l: 'Growth scare across the market',      p: -0.048 },
    { at: 0.63, tag: 'macro',  l: 'Recovery as recession fears faded',   p: 0.042 },
    { at: 0.77, tag: 'earn',   l: 'Results season, mixed reactions',     p: 0.022 },
    { at: 0.88, tag: 'rates',  l: 'Inflation cooled, yields fell',       p: 0.030 }
  ];
  COMPANIES.forEach(co => {
    const series = [];
    // walk backwards from today's starting price so the series ENDS where the
    // company data says it should
    const rev = [];
    let p = co.price;
    let wave = rndIn(0, Math.PI * 2);
    for (let i = BACKFILL - 1; i >= 0; i--) {
      rev.push(p);
      const frac = i / BACKFILL;
      let chg = 0.0004 * co.mktBeta;                       // long-run upward drift
      chg += Math.sin(wave + i * 0.09) * 0.0012 * co.mktBeta; // slow sentiment wave
      chg += gauss() * co.vol * 0.75;                       // ordinary noise
      HIST_EVENTS.forEach(h => {
        const at = Math.round(h.at * BACKFILL);
        if (i === at) {
          let f = 1;
          if (h.tag === 'ai')    f = co.tags.includes('ai') ? 1.8 : 0.35;
          if (h.tag === 'rates') f = -co.rateBeta * 0.9;
          if (h.tag === 'macro') f = co.mktBeta;
          if (h.tag === 'earn')  f = 0.6 + co.vol * 25;
          chg += h.p * f;
        }
      });
      p = p / (1 + chg);                                    // step backwards
      if (p < 1) p = 1;
    }
    rev.reverse();
    rev.forEach((c, i) => {
      const o = i === 0 ? c : rev[i - 1] * (1 + gauss() * co.vol * 0.25);
      series.push({ o: +o.toFixed(2), c: +c.toFixed(2), drivers: null });
    });
    series[series.length - 1].c = co.price;                 // exact starting price
    // the live session's own bar starts flat at the opening price
    series.push({ o: co.price, c: co.price, drivers: [] });
    state.prices[co.t] = series;
  });
}

/* Cap-weighted benchmark. Owning "the market" is the comparison every active
   decision is really being measured against. */
function indexValue(idx) {
  let cap = 0, base = 0;
  COMPANIES.forEach(co => {
    cap  += state.prices[co.t][idx].c * co.shares;
    base += co.price * co.shares;
  });
  return 100 * cap / base;
}
function rebuildIndex() {
  state.index = [];
  const len = state.prices[COMPANIES[0].t].length;
  for (let i = 0; i < len; i++) state.index.push(indexValue(i));
}

/* Schedule the things that are known in advance: central bank meetings,
   inflation releases, earnings dates and dividend dates. Real markets know
   these dates too, which is why the surprises come from the content, not the
   timing. */
function buildSchedule() {
  const L = state.length;
  for (let d = 9; d <= L; d += 21) state.schedule.fomc.push(d);
  for (let d = 5; d <= L; d += 20) state.schedule.cpi.push(d);
  COMPANIES.forEach(co => {
    const days = [];
    for (let d = co.earnOffset; d <= L; d += 63) days.push(d);
    state.schedule.earnings[co.t] = days;
    if (co.div > 0) {
      const ex = [];
      for (let d = (co.earnOffset * 2 + 5) % 40 + 4; d <= L; d += 63) ex.push(d);
      state.schedule.exDiv[co.t] = ex;
    }
    state.fund[co.t] = {
      eps: co.eps, revenue: co.revenue, netIncome: co.netIncome, div: co.div,
      basePE: co.eps > 0 ? co.price / co.eps : null,
      basePS: co.price / (co.revenue / co.shares),
      lastSurprise: null, lastGuide: null
    };
  });
}

function newGame(opts) {
  RNG = mulberry32(hashSeed(String(opts.seed)));
  state = blankState(opts);
  buildBackfill();
  buildSchedule();
  rebuildIndex();
  state.hist.push({ day: 0, value: opts.cash, cash: opts.cash, invested: 0, index: 100 });
  pushNews({
    tier: 'minor', cat: 'Welcome', scope: 'market', targets: [],
    head: 'Simulation begins — ' + state.calendar[0].long,
    body: 'You start with ' + fmtMoney(opts.cash, 0) + ' in virtual cash and ' + opts.length + ' trading sessions. Every price move in this simulation has a stated cause: an event, an earnings result, a change in interest rates, a valuation adjustment, or ordinary buying and selling between investors.',
    why: 'Before buying anything, it is worth deciding what you are trying to learn. Trying to finish with the largest number is the least interesting use of this tool — and the end-of-game report deliberately grades how you invested, not only how much you made.',
    concepts: ['supply-demand', 'long-vs-short']
  });
  save();
}

/* ============================================================================
 * 7. ENGINE — macro regime
 * ========================================================================== */

function macroRegime() {
  const m = state.macro;
  if (m.sentiment > 0.30 && m.growth > 1.8) return { k: 'expansion', label: 'Expansion', desc: 'Growth is solid and confidence is high. Cyclical businesses — banks, airlines, consumer discretionary — usually lead in this phase.' };
  if (m.sentiment < -0.30 && m.growth < 1.2) return { k: 'contraction', label: 'Contraction', desc: 'Growth is deteriorating and confidence is poor. Defensive sectors — staples, healthcare, utilities — tend to hold up best.' };
  if (m.inflation > 3.4) return { k: 'inflationary', label: 'Inflationary', desc: 'Prices are rising faster than the central bank wants, which keeps interest rates high and pressures companies whose profits are far in the future.' };
  if (m.sentiment < -0.12) return { k: 'slowdown', label: 'Slowdown', desc: 'Momentum is fading. Markets are pricing in weaker growth ahead, and the reaction to good news tends to be muted.' };
  return { k: 'steady', label: 'Steady', desc: 'No single force dominates. Individual company news matters more than the macro backdrop in this kind of market.' };
}

/* Bull / bear is measured the way the market measures it: distance from the
   recent high and low of the benchmark, not from an arbitrary starting point. */
function marketTrend() {
  const idx = state.index, end = si(state.day);
  const from = Math.max(0, end - 45);
  const win = idx.slice(from, end + 1);
  const hi = Math.max(...win), lo = Math.min(...win), now = idx[end];
  if (now >= lo * 1.13 && now > win[0]) return { k: 'bull', label: 'Bull trend', desc: 'The benchmark is well above its recent low and rising. In this kind of market, dips are bought quickly and bad news is often shrugged off — which can make risky positions feel safer than they are.' };
  if (now <= hi * 0.90) return { k: 'bear', label: 'Bear trend', desc: 'The benchmark is well below its recent high. Rallies tend to fade and good news gets sold. The same earnings report can produce the opposite reaction to the one it would get in a rising market.' };
  return { k: 'choppy', label: 'Range-bound', desc: 'The benchmark is moving sideways. Sector and company news drives more of the return than market direction does.' };
}

/* Sector rotation. In a strengthening economy money moves toward cyclical
   businesses (banks, airlines, discretionary) and out of defensives; in a
   weakening one it does the reverse. Modelling it explicitly means a large part
   of what would otherwise be unexplained drift gets a real, teachable cause. */
function updateSectorTilt() {
  state.tilt = state.tilt || {};
  const m = state.macro;
  SECTORS.forEach(s => {
    const members = COMPANIES.filter(c => c.sector === s);
    const cyc = members.reduce((a, c) => a + c.cyclical, 0) / members.length;
    const bias = (cyc - 0.5) * (m.sentiment * 0.0055 + (m.growth - 2.0) * 0.0022);
    const prev = state.tilt[s] || 0;
    state.tilt[s] = clamp(prev * 0.6 + bias + gauss() * 0.0013, -0.0065, 0.0065);
  });
}

function driftMacro() {
  const m = state.macro;
  // gentle mean reversion — moods and growth rates do not persist forever
  m.sentiment += (0.05 - m.sentiment) * 0.05 + gauss() * 0.02;
  m.growth    += (2.0 - m.growth) * 0.03 + gauss() * 0.03;
  m.inflation += (2.5 - m.inflation) * 0.02 + gauss() * 0.02;
  m.rateExpect *= 0.88;
  m.sentiment = clamp(m.sentiment, -1, 1);
  m.growth    = clamp(m.growth, -1.5, 5);
  m.inflation = clamp(m.inflation, 0.4, 7);
}

/* ============================================================================
 * 8. ENGINE — news, events and earnings
 * ========================================================================== */

let NEWS_SEQ = 1;

function pushNews(o) {
  const n = Object.assign({
    id: 'n' + (NEWS_SEQ++),
    day: state ? state.day : 0,
    date: state ? (state.calendar[Math.min(state.day - 1, state.calendar.length - 1)] || {}).label : '',
    reactions: {}       // ticker -> % move attributed to this story
  }, o);
  state.news.unshift(n);
  return n;
}

function matches(co, m) {
  if (!m) return false;
  if (m.market) return true;
  if (m.ticker) return co.t === m.ticker;
  if (m.sector) return co.sector === m.sector;
  if (m.tag) return m.tag === 'any' || co.tags.includes(m.tag);
  return false;
}

function addEffect(evId, label, match, shock, drift, days, factor) {
  const q = [shock];
  let d = drift;
  for (let i = 1; i < Math.max(1, days); i++) { q.push(d); d *= 0.68; }
  state.effects.push({ evId, label, match, queue: q, factor: factor == null ? 1 : factor });
}

/* How far a stock has run relative to the market over the last 20 sessions.
   This is what makes an event "already priced in". */
function runUp(t, n = 20) {
  const s = state.prices[t], i = si(state.day), j = Math.max(0, i - n);
  const stock = s[i].c / s[j].c - 1;
  const mkt = state.index[i] / state.index[j] - 1;
  return stock - mkt;
}

function eligible(tpl) {
  const last = state.lastFired && state.lastFired[tpl.id];
  if (last != null && state.day - last < tpl.cooldown) return false;
  if (tpl.pick) {
    const pool = candidatesFor(tpl);
    if (!pool.length) return false;
  }
  return tpl.weight > 0;
}

function candidatesFor(tpl) {
  const p = tpl.pick || { market: true };
  if (p.market) return COMPANIES;
  if (p.ticker) return COMPANIES.filter(c => c.t === p.ticker);
  if (p.sector) return COMPANIES.filter(c => c.sector === p.sector);
  if (p.tag) return p.tag === 'any' ? COMPANIES : COMPANIES.filter(c => c.tags.includes(p.tag));
  return COMPANIES;
}

/* Fire one template: write the story, then create the price effects that the
   story explains. The news is never decorative — these two things are the same
   object, which is the whole point of the design. */
function fireEvent(tplId, forced) {
  const tpl = EVENT_TEMPLATES.find(t => t.id === tplId);
  if (!tpl) return null;
  state.lastFired = state.lastFired || {};
  state.lastFired[tpl.id] = state.day;

  const pool = candidatesFor(tpl);
  const c = pick(pool);
  let shock = tpl.effect.shock, drift = tpl.effect.drift, note = '';

  /* Expectations adjustment: if a stock has already run hard into good news,
     the good news is largely in the price and the reaction shrinks or inverts. */
  if (tpl.pricedIn && tpl.scope === 'company') {
    const ru = runUp(c.t);
    if (ru > 0.09) {
      shock = shock * -0.45; drift = drift * -0.3;
      note = `${c.t} had already risen ${fmtPct(ru, 1)} more than the market over the past month going into this. Much of the good news was in the price before the announcement, so buyers who acted on the anticipation sold into the confirmation — the stock fell on news that was, on its own, positive.`;
    } else if (ru < -0.08) {
      shock = shock * 1.35;
      note = `${c.t} had lagged the market by ${fmtPct(Math.abs(ru), 1)} over the past month, so expectations going in were low. The same news lands harder when little of it was already assumed.`;
    }
  }

  const targetsFor = scope => {
    if (scope === 'market') return { market: true };
    if (scope === 'sector') {
      const p = tpl.pick || {};
      return p.sector ? { sector: p.sector } : { tag: p.tag };
    }
    return { ticker: c.t };
  };
  const match = targetsFor(tpl.scope);
  const affected = COMPANIES.filter(co => matches(co, match)).map(co => co.t);
  const spillTickers = [];
  (tpl.spill || []).forEach(sp => {
    COMPANIES.forEach(co => {
      if (matches(co, sp) && !affected.includes(co.t)) spillTickers.push(co.t);
    });
  });

  const news = pushNews({
    tplId: tpl.id, tier: tpl.tier, scope: tpl.scope, cat: tpl.cat,
    head: tpl.head(c), body: tpl.body(c), why: tpl.why(c),
    note, targets: affected, spill: [...new Set(spillTickers)],
    concepts: tpl.concepts || [], surprise: !!tpl.surprise
  });

  addEffect(news.id, tpl.head(c), match, shock, drift, tpl.effect.days, 1);
  (tpl.spill || []).forEach(sp => {
    const m = sp.sector ? { sector: sp.sector } : { tag: sp.tag };
    addEffect(news.id, tpl.head(c) + ' (knock-on effect)', m, shock * sp.factor, drift * sp.factor, tpl.effect.days, 1);
  });

  if (tpl.macro) {
    const m = state.macro;
    if (tpl.macro.rate)       applyRateChange(tpl.macro.rate, news.id);
    if (tpl.macro.rateExpect) applyRateChange(tpl.macro.rateExpect, news.id, true);
    if (tpl.macro.inflation)  m.inflation = clamp(m.inflation + tpl.macro.inflation, 0.4, 7);
    if (tpl.macro.growth)     m.growth = clamp(m.growth + tpl.macro.growth, -1.5, 5);
    if (tpl.macro.sentiment)  m.sentiment = clamp(m.sentiment + tpl.macro.sentiment, -1, 1);
  }
  return news;
}

/* A rate change is not one number applied to everything. It is repriced
   through each company's own sensitivity, which is why a single headline sends
   a utility down and a bank up. */
function applyRateChange(delta, evId, expectationOnly) {
  if (!expectationOnly) state.macro.rate = clamp(state.macro.rate + delta, 0, 12);
  const w = expectationOnly ? 0.5 : 1;
  const label = expectationOnly
    ? `Interest-rate expectations shifted ${delta > 0 ? 'higher' : 'lower'}`
    : `Policy rate ${delta > 0 ? 'raised' : 'cut'} to ${(state.macro.rate).toFixed(2)}%`;
  COMPANIES.forEach(co => {
    const imp = -delta * co.rateBeta * RATE_IMPACT * w;
    if (Math.abs(imp) < 0.0004) return;
    addEffect(evId, label + ` — ${co.t} ${co.rateBeta > 0 ? 'benefits from' : 'is hurt by'} higher rates`,
      { ticker: co.t }, imp * 0.65, imp * 0.2, 3, 1);
  });
}

/* --- Earnings -------------------------------------------------------------
 * Reported after the close, reacting at the next open — as in real markets.
 * The reaction is built from three things: the surprise versus the estimate,
 * the guidance for next quarter, and how much the stock had already moved in
 * anticipation. That third term is what produces "beat and fell".
 */
function runEarnings(t) {
  const co = BY_TICKER[t], f = state.fund[t];
  const g = macroGrowthFactor();
  const estEps = +(f.eps / 4 * (1 + co.growth / 4) * g).toFixed(2);
  let surprise = gauss() * 0.075 + 0.018;             // companies usually beat, slightly
  surprise = clamp(surprise, -0.30, 0.30);
  const actual = +(estEps * (1 + surprise)).toFixed(2);

  const gRoll = rnd() + state.macro.sentiment * 0.12 + (state.macro.growth - 2) * 0.06;
  const guide = gRoll > 0.70 ? 'raise' : gRoll > 0.30 ? 'inline' : 'cut';
  const volK = clamp(co.vol / 0.015, 0.6, 2.0);
  const ru = runUp(t, 15);

  let move = surprise * 0.55 * volK;
  move += (guide === 'raise' ? 0.035 : guide === 'cut' ? -0.055 : 0) * volK;
  let pricedNote = '';
  if (ru > 0.07) {
    const drag = Math.min(0.06, (ru - 0.07) * 0.45);
    move -= drag;
    pricedNote = `Going in, ${t} had already outperformed the market by ${fmtPct(ru, 1)} over three weeks — a lot of good news was in the price before the numbers were published.`;
  } else if (ru < -0.07) {
    const relief = Math.min(0.045, (Math.abs(ru) - 0.07) * 0.40);
    move += relief;
    pricedNote = `${t} had underperformed the market by ${fmtPct(Math.abs(ru), 1)} into the report, so expectations were low and the bar to clear was correspondingly lower.`;
  }
  move = clamp(move, -0.14, 0.14);

  const revenue = +(f.revenue * (1 + co.growth / 4 * g + surprise * 0.25)).toFixed(1);
  const netInc  = +(actual * 4 * co.shares).toFixed(1);
  f.eps = +(f.eps * 0.55 + actual * 4 * 0.45).toFixed(2);
  f.revenue = revenue;
  f.netIncome = netInc;
  f.lastSurprise = surprise;
  f.lastGuide = guide;

  const beat = surprise > 0.005, miss = surprise < -0.005;
  const gWord = guide === 'raise' ? 'raised its guidance for the coming quarter'
    : guide === 'cut' ? 'cut its guidance for the coming quarter'
    : 'left its guidance for the coming quarter unchanged';

  const head = `${co.name} reports ${beat ? 'stronger-than-expected' : miss ? 'weaker-than-expected' : 'in-line'} quarterly earnings`;
  const body = `${co.name} reported earnings of ${fmtMoney(actual)} per share against an expected ${fmtMoney(estEps)} — `
    + `${beat ? 'a beat of ' + fmtPct(surprise, 1).replace('+', '') : miss ? 'a miss of ' + (surprise * 100).toFixed(1) + '%' : 'essentially in line'}. `
    + `Revenue came in at $${revenue.toFixed(1)}B. Management ${gWord}. The result was released after the closing bell; the shares will react at tomorrow's open.`;

  const why = `Earnings are judged against expectations, not against zero. `
    + (beat ? 'The company earned more than analysts forecast, ' : miss ? 'The company earned less than analysts forecast, ' : 'The company earned roughly what was forecast, ')
    + (guide === 'cut' ? 'but its outlook for next quarter was cut — and the outlook changes every future year in an investor\'s model, not just the quarter that has passed. That is why guidance usually matters more than the result itself. '
      : guide === 'raise' ? 'and it raised its outlook, which lifts every future year in an investor\'s model rather than just the quarter reported. '
      : 'and the outlook was unchanged, so the result had to carry the reaction on its own. ')
    + (pricedNote ? pricedNote + ' ' : '')
    + `Remember that a company can be highly profitable and still see its shares fall: the market is pricing the gap between what happened and what was already assumed.`;

  const news = pushNews({
    tplId: 'earnings', tier: Math.abs(move) > 0.05 ? 'major' : 'moderate', scope: 'company',
    cat: 'Earnings', head, body, why, targets: [t], spill: [],
    concepts: ['earnings', 'expectations', 'priced-in', 'pe-ratio'],
    earnings: { eps: actual, est: estEps, surprise, guide, revenue }, afterClose: true
  });

  state.pendingOpen.push({ ticker: t, gap: move, label: `Earnings reaction: ${beat ? 'beat' : miss ? 'miss' : 'in line'}, guidance ${guide}`, evId: news.id });
  addEffect(news.id, `Follow-through from ${t} earnings`, { ticker: t }, 0, move * 0.12, 4, 1);
  /* sympathy move for close peers — results read across an industry */
  addEffect(news.id, `Read-across from ${t}'s results`, { sector: co.sector }, move * 0.18, 0, 2, 1);
  return news;
}

const macroGrowthFactor = () => clamp(1 + (state.macro.growth - 2.0) * 0.05 + state.macro.sentiment * 0.02, 0.9, 1.12);

/* Choose the day's unscheduled news. Weighted so that minor stories are common
   and market-shaking ones are rare — as in life. */
function generateEvents() {
  const fired = [];
  const day = state.day;

  if (state.schedule.fomc.includes(day)) {
    const m = state.macro;
    let id;
    if (m.inflation > 3.05 && rnd() < 0.7) id = 'fed_hike';
    else if ((m.growth < 1.5 || m.sentiment < -0.35) && m.inflation < 3.0 && rnd() < 0.65) id = 'fed_cut';
    else if (rnd() < 0.32) id = m.inflation > 2.7 ? 'fed_hike' : 'fed_cut';   // data-dependent move
    else id = rnd() < 0.5 ? 'fed_hold_hawkish' : 'fed_hold_dovish';
    fired.push(fireEvent(id));
  }
  if (state.schedule.cpi.includes(day)) {
    const hot = rnd() < clamp(0.35 + (state.macro.inflation - 2.5) * 0.18, 0.15, 0.75);
    fired.push(fireEvent(hot ? 'cpi_hot' : 'cpi_cool'));
  }

  let n = (rnd() < 0.82 ? 1 : 0) + (rnd() < 0.45 ? 1 : 0) + (rnd() < 0.15 ? 1 : 0);
  const tierW = { minor: 1.7, moderate: 1.0, major: 0.42, market: 0.55 };
  for (let k = 0; k < n; k++) {
    const pool = EVENT_TEMPLATES.filter(eligible);
    if (!pool.length) break;
    let total = 0;
    const weights = pool.map(t => { const w = t.weight * (tierW[t.tier] || 1); total += w; return w; });
    let r = rnd() * total, chosen = pool[0];
    for (let i = 0; i < pool.length; i++) { r -= weights[i]; if (r <= 0) { chosen = pool[i]; break; } }
    fired.push(fireEvent(chosen.id));
  }
  return fired.filter(Boolean);
}

/* ============================================================================
 * 9. ENGINE — the price model
 * ----------------------------------------------------------------------------
 * Every day, every stock's move is assembled from named components and the
 * components are stored with the bar. Nothing is hidden: the research card can
 * show you exactly what moved a price and by how much.
 * ========================================================================== */
function stepPrices() {
  const idx = si(state.day);
  const gaps = {};
  state.pendingOpen.forEach(p => {
    gaps[p.ticker] = gaps[p.ticker] || [];
    gaps[p.ticker].push(p);
  });
  const trend = state.macro;
  const marketDrift = 0.00035 + trend.sentiment * 0.0022 + (trend.growth - 2.0) * 0.0006;
  updateSectorTilt();

  COMPANIES.forEach(co => {
    const s = state.prices[co.t];
    const prev = s[idx - 1].c;
    const drivers = [];

    /* --- overnight: anything announced after yesterday's close --- */
    let gapPct = 0;
    (gaps[co.t] || []).forEach(g => { gapPct += g.gap; drivers.push({ l: g.label, p: g.gap, ev: g.evId, gap: true }); });
    const open = +(prev * (1 + gapPct + gauss() * co.vol * 0.12)).toFixed(2);

    /* --- ex-dividend adjustment --- */
    let divPct = 0;
    const exDays = state.schedule.exDiv[co.t] || [];
    if (exDays.includes(state.day) && state.fund[co.t].div > 0) {
      const q = state.fund[co.t].div / 4;
      divPct = -q / prev;
      drivers.push({ l: `Ex-dividend: ${fmtMoney(q)} per share paid out of the company`, p: divPct });
    }

    /* --- broad market conditions --- */
    const macroPct = marketDrift * co.mktBeta;
    if (Math.abs(macroPct) > 0.0004) {
      drivers.push({ l: `Market conditions — ${macroRegime().label.toLowerCase()} backdrop, ${co.t} moves ${co.mktBeta.toFixed(2)}x the market`, p: macroPct });
    }

    /* --- active event effects --- */
    let evPct = 0;
    state.effects.forEach(e => {
      if (!matches(co, e.match)) return;
      const base = e.queue[0];
      if (base == null) return;
      const scale = e.match.market ? co.mktBeta : 1;
      const p = base * scale * e.factor;
      if (Math.abs(p) < 0.0003) return;
      evPct += p;
      drivers.push({ l: e.label, p, ev: e.evId });
    });

    /* --- sector rotation --- */
    const tilt = (state.tilt && state.tilt[co.sector]) || 0;
    if (Math.abs(tilt) > 0.0004) {
      drivers.push({
        l: `Sector rotation — money ${tilt > 0 ? 'moving into' : 'moving out of'} ${co.sector} as the ${macroRegime().label.toLowerCase()} backdrop shifts`,
        p: tilt
      });
    }

    /* --- valuation anchor: prices drift back toward what earnings support --- */
    const f = state.fund[co.t];
    const regimeMult = 1 + (BASE_RATE - state.macro.rate) * 0.045 + state.macro.sentiment * 0.05;
    const fair = f.basePE && f.eps > 0
      ? f.eps * f.basePE * regimeMult
      : (f.revenue / co.shares) * f.basePS * regimeMult;
    const gapToFair = clamp(fair / prev - 1, -0.35, 0.35);
    const anchor = gapToFair * 0.011;
    if (Math.abs(anchor) > 0.0005) {
      drivers.push({
        l: gapToFair < 0
          ? `Valuation: price sits ${fmtPct(-gapToFair, 0).replace('+', '')} above what current earnings support`
          : `Valuation: price sits ${fmtPct(gapToFair, 0).replace('+', '')} below what current earnings support`,
        p: anchor
      });
    }

    /* --- ordinary buying and selling ---------------------------------------
       Deliberately kept small and hard-capped, so it can never be the reason a
       stock moves several percent. Big moves in this simulation always trace
       back to a named cause. It is labelled rather than hidden, because a price
       drifting on the balance of buyers and sellers IS the explanation — that is
       what supply and demand looks like on an ordinary day. */
    const noise = clamp(gauss() * co.vol * 0.36, -co.vol * 0.9, co.vol * 0.9);
    drivers.push({ l: 'Ordinary buying and selling between investors — no specific news', p: noise });

    let total = gapPct + divPct + macroPct + tilt + evPct + anchor + noise;
    total = clamp(total, -0.24, 0.24);
    const close = Math.max(0.5, +(prev * (1 + total)).toFixed(2));

    drivers.sort((a, b) => Math.abs(b.p) - Math.abs(a.p));
    s[idx] = { o: open, c: close, drivers: drivers.slice(0, 6) };

    /* attribute the day's move to the stories that caused it, and to YOUR book */
    const held = state.positions[co.t];
    drivers.forEach(d => {
      if (!d.ev) return;
      const n = state.news.find(x => x.id === d.ev);
      if (n) n.reactions[co.t] = (n.reactions[co.t] || 0) + d.p;
      if (held && held.sh > 0) {
        state.eventImpact[d.ev] = (state.eventImpact[d.ev] || 0) + held.sh * prev * d.p;
      }
    });
  });

  /* age the effects: shift one day off each queue, drop the spent ones */
  state.effects.forEach(e => e.queue.shift());
  state.effects = state.effects.filter(e => e.queue.length > 0);
  state.index[idx] = indexValue(idx);
}

/* --- Advance one session --------------------------------------------------- */
function advanceDay() {
  if (state.ended) return;
  if (state.day >= state.length) { endGame(); return; }

  state.day++;
  // make room for the new bar
  COMPANIES.forEach(co => { state.prices[co.t][si(state.day)] = { o: 0, c: 0, drivers: [] }; });
  state.index[si(state.day)] = state.index[si(state.day) - 1];

  driftMacro();
  generateEvents();
  stepPrices();
  state.pendingOpen = [];

  fillQueuedOrders();
  payDividends();
  recordHistory();
  checkCoach();
  afterCloseAnnouncements();
  maybeScenario();

  if (state.day >= state.length) endGame();
  save();
}

/* Earnings are released after the closing bell. The stock is effectively
   untradeable until the next open, and any order placed now is queued. */
function afterCloseAnnouncements() {
  COMPANIES.forEach(co => {
    const days = state.schedule.earnings[co.t] || [];
    if (days.includes(state.day)) runEarnings(co.t);
  });
}

function payDividends() {
  COMPANIES.forEach(co => {
    const ex = state.schedule.exDiv[co.t] || [];
    if (!ex.includes(state.day)) return;
    const pos = state.positions[co.t];
    if (!pos || pos.sh <= 0) return;
    const q = state.fund[co.t].div / 4;
    const cash = +(q * pos.sh).toFixed(2);
    state.cash += cash;
    state.stats.dividends += cash;
    state.tx.unshift({ day: state.day, date: dateLabel(state.day), side: 'DIV', t: co.t, sh: pos.sh, px: q, value: cash });
    coach('dividend');
    toast('lesson', 'Dividend received', `${co.t} paid ${fmtMoney(q)} per share — ${fmtMoney(cash)} into your cash balance. The share price was adjusted down by the same amount today, so nothing appeared from nowhere: value moved from the share price into your account.`);
  });
}

const dateLabel = d => (state.calendar[d - 1] || { label: '' }).label;

/* ============================================================================
 * 10. ENGINE — portfolio, trading and constraints
 * ----------------------------------------------------------------------------
 * The constraints here are deliberate teaching devices: no borrowing, no short
 * selling, no trading a stock that is halted pending an announcement, and a
 * bid-ask spread on every fill so that activity has a visible cost.
 * ========================================================================== */

const askOf = t => +(priceOf(t) * (1 + SPREAD)).toFixed(2);
const bidOf = t => +(priceOf(t) * (1 - SPREAD)).toFixed(2);
const sharesHeld = t => (state.positions[t] && state.positions[t].sh) || 0;

/* A stock whose results are pending cannot be traded until the market reopens. */
function haltedTickers() {
  return new Set(state.pendingOpen.map(p => p.ticker));
}
const isHalted = t => haltedTickers().has(t);

function totalValue() {
  let v = state.cash;
  Object.keys(state.positions).forEach(t => { v += state.positions[t].sh * priceOf(t); });
  return v;
}
function investedValue() {
  let v = 0;
  Object.keys(state.positions).forEach(t => { v += state.positions[t].sh * priceOf(t); });
  return v;
}

function holdings() {
  return Object.keys(state.positions)
    .filter(t => state.positions[t].sh > 0)
    .map(t => {
      const p = state.positions[t], co = BY_TICKER[t], px = priceOf(t);
      const value = p.sh * px, cost = p.sh * p.avg;
      return {
        t, co, sh: p.sh, avg: p.avg, px, value, cost,
        pl: value - cost, plPct: cost ? value / cost - 1 : 0,
        dayPl: p.sh * (px - prevCloseOf(t)),
        dayPct: dayChangeOf(t),
        weight: value / Math.max(1, totalValue())
      };
    })
    .sort((a, b) => b.value - a.value);
}

function sectorAllocation() {
  const map = {};
  holdings().forEach(h => { map[h.co.sector] = (map[h.co.sector] || 0) + h.value; });
  const tv = totalValue();
  const rows = Object.entries(map).map(([k, v]) => ({ k, v, w: v / tv })).sort((a, b) => b.v - a.v);
  if (state.cash > 0) rows.push({ k: 'Cash', v: state.cash, w: state.cash / tv, cash: true });
  return rows;
}

function buy(t, sh, opts) {
  opts = opts || {};
  sh = Math.floor(sh);
  if (!sh || sh < 1) return { ok: false, msg: 'Enter a whole number of shares.' };
  if (state.ended) return { ok: false, msg: 'The simulation has finished. Restart to trade again.' };
  if (isHalted(t)) return queueOrder(t, 'BUY', sh);

  const px = askOf(t), cost = +(sh * px).toFixed(2);
  if (cost > state.cash) {
    coach('insufficient-cash');
    return { ok: false, msg: `That order costs ${fmtMoney(cost)} but you have ${fmtMoney(state.cash)}. There is no borrowing in this simulation — you can only invest money you actually hold.` };
  }
  const p = state.positions[t] || { sh: 0, avg: 0, invested: 0, firstDay: state.day };
  const newSh = p.sh + sh;
  p.avg = +(((p.avg * p.sh) + cost) / newSh).toFixed(4);
  p.sh = newSh;
  p.invested = +(p.invested + cost).toFixed(2);
  p.lastBuyDay = state.day;
  state.positions[t] = p;
  state.cash = +(state.cash - cost).toFixed(2);
  state.stats.buys++;
  state.stats.spreadPaid += sh * priceOf(t) * SPREAD;
  if (state.learn.research[t]) state.stats.researchedBeforeBuy++;
  state.tx.unshift({ day: state.day, date: dateLabel(state.day), side: 'BUY', t, sh, px, value: cost });

  coach('first-buy');
  checkCoach();
  save();
  return { ok: true, msg: `Bought ${sh} ${t} at ${fmtMoney(px)} — ${fmtMoney(cost)}.`, px, cost };
}

function sell(t, sh, opts) {
  opts = opts || {};
  sh = Math.floor(sh);
  const held = sharesHeld(t);
  if (!sh || sh < 1) return { ok: false, msg: 'Enter a whole number of shares.' };
  if (state.ended) return { ok: false, msg: 'The simulation has finished. Restart to trade again.' };
  if (sh > held) {
    coach('oversell');
    return { ok: false, msg: `You hold ${held} shares of ${t}. Selling shares you do not own (short selling) is not available in this simulation.` };
  }
  if (isHalted(t)) return queueOrder(t, 'SELL', sh);

  const px = bidOf(t), proceeds = +(sh * px).toFixed(2);
  const p = state.positions[t];
  const realized = +((px - p.avg) * sh).toFixed(2);
  const heldDays = state.day - (p.lastBuyDay || p.firstDay || state.day);

  p.sh -= sh;
  if (p.sh <= 0) delete state.positions[t]; else state.positions[t] = p;
  state.cash = +(state.cash + proceeds).toFixed(2);
  state.stats.sells++;
  state.stats.spreadPaid += sh * priceOf(t) * SPREAD;
  state.realized = state.realized || {};
  state.realized[t] = +((state.realized[t] || 0) + realized).toFixed(2);
  state.tx.unshift({ day: state.day, date: dateLabel(state.day), side: 'SELL', t, sh, px, value: proceeds, realized });

  coach('first-sell');
  if (heldDays <= 3) { state.stats.quickFlips++; coach('quick-flip'); }
  if (realized < 0 && dayChangeOf(t) < -0.025) { state.stats.panicSells++; coach('panic-sell'); }
  checkCoach();
  save();
  return { ok: true, msg: `Sold ${sh} ${t} at ${fmtMoney(px)} — ${fmtMoney(proceeds)}. Realised ${realized >= 0 ? 'gain' : 'loss'} of ${fmtMoney(Math.abs(realized))}.`, px, proceeds, realized };
}

/* Orders placed while a stock is halted fill at the NEXT open, which may be far
   from the last price you saw. That is gap risk, and it is real. */
function queueOrder(t, side, sh) {
  state.queued.push({ t, side, sh, placedDay: state.day, ref: priceOf(t) });
  coach('queued-order');
  save();
  return { ok: true, queued: true, msg: `${side === 'BUY' ? 'Buy' : 'Sell'} order for ${sh} ${t} queued. ${t} reports after the close, so the order will fill at tomorrow's opening price — which may differ from tonight's ${fmtMoney(priceOf(t))}.` };
}

function fillQueuedOrders() {
  if (!state.queued.length) return;
  const rest = [];
  state.queued.forEach(o => {
    const openPx = state.prices[o.t][si(state.day)].o;
    const gap = openPx / o.ref - 1;
    if (o.side === 'BUY') {
      const px = +(openPx * (1 + SPREAD)).toFixed(2), cost = +(o.sh * px).toFixed(2);
      if (cost > state.cash) {
        toast('warn', 'Queued order could not fill', `Your queued buy of ${o.sh} ${o.t} needed ${fmtMoney(cost)} at the open but you hold ${fmtMoney(state.cash)}. The order was cancelled. Prices move overnight — an order sized to your last cash balance can become unaffordable by morning.`);
        return;
      }
      const p = state.positions[o.t] || { sh: 0, avg: 0, invested: 0, firstDay: state.day };
      const n = p.sh + o.sh;
      p.avg = +(((p.avg * p.sh) + cost) / n).toFixed(4);
      p.sh = n; p.invested = +(p.invested + cost).toFixed(2); p.lastBuyDay = state.day;
      state.positions[o.t] = p;
      state.cash = +(state.cash - cost).toFixed(2);
      state.stats.buys++;
      state.tx.unshift({ day: state.day, date: dateLabel(state.day), side: 'BUY', t: o.t, sh: o.sh, px, value: cost, gapped: true });
    } else {
      const have = sharesHeld(o.t);
      const sh = Math.min(have, o.sh);
      if (!sh) return;
      const px = +(openPx * (1 - SPREAD)).toFixed(2), proceeds = +(sh * px).toFixed(2);
      const p = state.positions[o.t];
      const realized = +((px - p.avg) * sh).toFixed(2);
      p.sh -= sh;
      if (p.sh <= 0) delete state.positions[o.t]; else state.positions[o.t] = p;
      state.cash = +(state.cash + proceeds).toFixed(2);
      state.stats.sells++;
      state.realized = state.realized || {};
      state.realized[o.t] = +((state.realized[o.t] || 0) + realized).toFixed(2);
      state.tx.unshift({ day: state.day, date: dateLabel(state.day), side: 'SELL', t: o.t, sh, px, value: proceeds, realized, gapped: true });
    }
    toast('lesson', 'Queued order filled at the open',
      `${o.side === 'BUY' ? 'Bought' : 'Sold'} ${o.sh} ${o.t} at ${fmtMoney(openPx)}. When you placed it the price was ${fmtMoney(o.ref)} — the market opened ${fmtPct(gap, 1)} away. News that arrives while the market is shut shows up as a jump in the opening price rather than a gradual move.`);
    coach('gap-fill');
  });
  state.queued = rest;
}

function recordHistory() {
  const v = totalValue();
  state.hist.push({ day: state.day, value: v, cash: state.cash, invested: investedValue(), index: state.index[si(state.day)] });
  state.stats.peak = Math.max(state.stats.peak, v);
  state.stats.maxDD = Math.min(state.stats.maxDD, v / state.stats.peak - 1);
  if (state.cash / Math.max(1, v) > 0.8) state.stats.cashDays++;
}

function dayReturn() {
  const h = state.hist;
  if (h.length < 2) return 0;
  const a = h[h.length - 1].value, b = h[h.length - 2].value;
  return b ? a / b - 1 : 0;
}
const totalReturn = () => totalValue() / state.startCash - 1;
const benchReturn = () => state.index[si(state.day)] / 100 - 1;

/* ============================================================================
 * 11. ENGINE — the teaching layer
 * ========================================================================== */

function coach(id) {
  const spec = COACH[id];
  if (!spec) return;
  const last = state.learn.coach[id];
  if (last != null && !spec.repeat) return;
  if (last != null && spec.repeat && state.day - last < 14) return;
  state.learn.coach[id] = state.day;
  markConcept(spec.c);
  toast('lesson', spec.title, spec.text, spec.c);
}

function markConcept(id) {
  if (!id || !CONCEPT_BY_ID[id]) return;
  if (!state.learn.concepts[id]) state.learn.concepts[id] = { firstDay: state.day, count: 0 };
  state.learn.concepts[id].count++;
}

/* Behavioural checks that run after every trade and every session. */
function checkCoach() {
  const hs = holdings(), tv = totalValue();
  if (hs.length && hs[0].weight > 0.38) coach('concentration');
  if (new Set(hs.map(h => h.co.sector)).size >= 4) coach('diversified');
  if (state.day > 6 && state.cash / tv > 0.80 && state.stats.cashDays > 5) coach('all-cash');
  if (state.stats.maxDD < -0.12 && totalValue() / state.stats.peak - 1 < -0.10) coach('big-drawdown');
  COMPANIES.forEach(co => {
    const days = state.schedule.earnings[co.t] || [];
    if (days.includes(state.day) && sharesHeld(co.t) > 0) coach('earnings-hold');
  });
}

/* "What would you do?" — fired by real portfolio conditions, never at random,
   and capped so the simulation teaches without nagging. */
function maybeScenario() {
  if (state.activeScenario) return;
  const done = Object.keys(state.learn.scenarios).length;
  if (done >= 5) return;
  if (state.learn.lastScenarioDay != null && state.day - state.learn.lastScenarioDay < 6) return;

  const hs = holdings();
  const idxNow = si(state.day);
  const mktDay = state.index[idxNow] / state.index[idxNow - 1] - 1;
  const cands = [];

  COMPANIES.forEach(co => {
    if ((state.schedule.earnings[co.t] || []).includes(state.day + 1) && sharesHeld(co.t) > 0) cands.push('sc-earnings-eve');
  });
  if (hs.some(h => h.plPct < -0.18)) cands.push('sc-down-20');
  if (hs.length >= 3 && hs[0].weight > 0.35) cands.push('sc-hot-sector');
  if (state.day > 8 && state.cash / totalValue() > 0.7) cands.push('sc-all-cash');
  if (mktDay < -0.022) cands.push('sc-crash-day');
  if (state.news[0] && state.news[0].tplId === 'earnings' && state.news[0].earnings
      && state.news[0].earnings.surprise > 0.01 && sharesHeld(state.news[0].targets[0]) > 0) cands.push('sc-priced-in');
  if (state.news.slice(0, 3).some(n => n.tplId && n.tplId.startsWith('fed_'))
      && hs.some(h => Math.abs(h.co.rateBeta) > 1.2)) cands.push('sc-rate-shock');
  if (state.news[0] && state.news[0].surprise && sharesHeld(state.news[0].targets[0]) > 0) cands.push('sc-unknown-shock');

  const fresh = cands.filter(id => !state.learn.scenarios[id]);
  if (!fresh.length) return;
  state.activeScenario = pick(fresh);
  state.learn.lastScenarioDay = state.day;
}

/* ============================================================================
 * 12. ENGINE — end-of-game report
 * ----------------------------------------------------------------------------
 * Profit is ONE of six dimensions and not the most heavily weighted. The report
 * grades process — diversification, sizing, research, reaction to events and
 * trading discipline — because process is the part that transfers to real life.
 * ========================================================================== */

function letter(score) {
  return score >= 85 ? 'A' : score >= 72 ? 'B' : score >= 58 ? 'C' : score >= 42 ? 'D' : 'E';
}

function computeReport() {
  const val = totalValue();
  const ret = val / state.startCash - 1;
  const bench = benchReturn();
  const hs = holdings();
  const realized = state.realized || {};

  /* per-company result: realised plus unrealised */
  const perCo = {};
  Object.keys(realized).forEach(t => { perCo[t] = (perCo[t] || 0) + realized[t]; });
  hs.forEach(h => { perCo[h.t] = (perCo[h.t] || 0) + h.pl; });
  const ranked = Object.entries(perCo).map(([t, v]) => ({ t, v })).sort((a, b) => b.v - a.v);
  const best = ranked[0], worst = ranked[ranked.length - 1];

  /* diversification: sectors held and concentration (Herfindahl index) */
  const sectors = new Set(hs.map(h => h.co.sector));
  const weights = hs.map(h => h.value / Math.max(1, val));
  const hhi = weights.reduce((a, w) => a + w * w, 0);
  const topWeight = weights.length ? Math.max(...weights) : 0;
  let divScore = 0;
  divScore += clamp(sectors.size / 5, 0, 1) * 55;
  divScore += clamp((0.45 - hhi) / 0.35, 0, 1) * 30;
  divScore += clamp((0.45 - topWeight) / 0.30, 0, 1) * 15;
  if (!hs.length) divScore = state.stats.buys ? 30 : 12;

  /* risk management: drawdown versus the market's own, sizing, cash discipline */
  let benchDD = 0, peak = 0;
  state.hist.forEach(h => { peak = Math.max(peak, h.index); benchDD = Math.min(benchDD, h.index / peak - 1); });
  const ddRatio = benchDD < -0.001 ? state.stats.maxDD / benchDD : (state.stats.maxDD < -0.05 ? 2 : 1);
  let riskScore = clamp((1.6 - ddRatio) / 1.2, 0, 1) * 55;
  riskScore += clamp((0.5 - topWeight) / 0.35, 0, 1) * 25;
  riskScore += (state.stats.panicSells === 0 ? 20 : clamp(20 - state.stats.panicSells * 8, 0, 20));

  /* research behaviour */
  const researchedPct = state.stats.buys ? state.stats.researchedBeforeBuy / state.stats.buys : 0;
  const pagesRead = Object.keys(state.learn.research).length;
  let researchScore = researchedPct * 60 + clamp(pagesRead / 8, 0, 1) * 25 + clamp(state.learn.eventReads / 10, 0, 1) * 15;

  /* understanding of events: quiz accuracy and engagement with explanations */
  const qs = Object.values(state.learn.quiz);
  const qCorrect = qs.filter(q => q.correct).length;
  const qAcc = qs.length ? qCorrect / qs.length : 0;
  let eventScore = qs.length ? (qAcc * 70 + clamp(qs.length / 6, 0, 1) * 30) : clamp(state.learn.eventReads * 4, 0, 35);

  /* discipline: turnover and reactive selling */
  const trades = state.stats.buys + state.stats.sells;
  const perWeek = trades / Math.max(1, state.length / 5);
  let discScore = clamp((6 - perWeek) / 5, 0, 1) * 55
    + (state.stats.quickFlips === 0 ? 25 : clamp(25 - state.stats.quickFlips * 7, 0, 25))
    + (state.stats.panicSells === 0 ? 20 : 0);
  if (trades === 0) discScore = 45;

  /* outcome, judged against the market rather than against zero */
  const excess = ret - bench;
  let outcomeScore = clamp(55 + excess * 320, 0, 100);

  const dims = [
    { k: 'Diversification', s: Math.round(clamp(divScore, 0, 100)), w: 0.2,
      note: sectors.size >= 4 ? `You held ${sectors.size} sectors with a largest position of ${fmtPct(topWeight, 0)}. Genuinely different exposures — no single event could take down the whole book.`
        : sectors.size >= 2 ? `You held ${sectors.size} sectors, with ${fmtPct(topWeight, 0)} in your largest position. Workable, but check whether those holdings really respond to different forces or just have different names.`
        : `Your holdings were concentrated in ${sectors.size || 'no'} sector${sectors.size === 1 ? '' : 's'}. Concentration amplifies both directions; the result you got this run says less about the decision than it feels like it does.` },
    { k: 'Risk management', s: Math.round(clamp(riskScore, 0, 100)), w: 0.2,
      note: `Your deepest fall from peak was ${fmtPct(state.stats.maxDD, 1)} against the market's ${fmtPct(benchDD, 1)}. `
        + (state.stats.panicSells ? `You sold at a loss immediately after a sharp fall ${state.stats.panicSells} time${state.stats.panicSells > 1 ? 's' : ''} — the most common way a temporary loss becomes a permanent one.` : `You did not sell into a sharp decline at a loss, which is harder than it sounds.`) },
    { k: 'Research', s: Math.round(clamp(researchScore, 0, 100)), w: 0.2,
      note: `You opened research on ${pagesRead} compan${pagesRead === 1 ? 'y' : 'ies'} and read ${state.learn.eventReads} event explanation${state.learn.eventReads === 1 ? '' : 's'}. `
        + (state.stats.buys ? `${fmtPct(researchedPct, 0).replace('+', '')} of your purchases were in companies whose research card you had opened first.` : 'You did not buy anything, so there is nothing to compare research against.') },
    { k: 'Event literacy', s: Math.round(clamp(eventScore, 0, 100)), w: 0.2,
      note: qs.length ? `You answered ${qs.length} quiz question${qs.length === 1 ? '' : 's'} with ${qCorrect} correct (${fmtPct(qAcc, 0).replace('+', '')}).`
        : 'You did not attempt the quizzes. They are the fastest way to find out which market mechanics you have actually absorbed.' },
    { k: 'Discipline', s: Math.round(clamp(discScore, 0, 100)), w: 0.1,
      note: `${trades} trade${trades === 1 ? '' : 's'} over ${state.length} sessions — about ${perWeek.toFixed(1)} per week — costing ${fmtMoney(state.stats.spreadPaid)} in spread. `
        + (perWeek > 5 ? 'That is a high rate of activity; each round trip needs two correct decisions and pays the spread twice.' : 'A measured pace: you let positions work rather than trading around them.') },
    { k: 'Outcome vs. market', s: Math.round(outcomeScore), w: 0.1,
      note: `You returned ${fmtPct(ret)} against the market's ${fmtPct(bench)} — ${excess >= 0 ? 'ahead by ' : 'behind by '}${fmtPct(Math.abs(excess))}. Over ${state.length} sessions this gap is mostly noise; it is weighted lightly here on purpose.` }
  ];

  const overall = Math.round(dims.reduce((a, d) => a + d.s * d.w, 0));

  /* which concepts the player demonstrated, and which to revisit */
  const strong = [], weak = [];
  Object.entries(state.learn.quiz).forEach(([qid, r]) => {
    const q = QUIZ.find(x => x.id === qid);
    if (!q) return;
    (r.correct ? strong : weak).push(q.concept);
  });
  if (sectors.size >= 4) strong.push('diversification'); else if (state.stats.buys) weak.push('diversification');
  if (topWeight > 0.45) weak.push('position-sizing'); else if (hs.length) strong.push('position-sizing');
  if (state.stats.panicSells > 0) weak.push('time-horizon'); else if (state.hist.length > 10) strong.push('time-horizon');
  if (perWeek > 5) weak.push('long-vs-short'); else if (trades > 0) strong.push('long-vs-short');
  if (state.stats.dividends > 0) strong.push('dividends');
  if (researchedPct < 0.5 && state.stats.buys > 2) weak.push('pe-ratio');

  const topEvents = Object.entries(state.eventImpact)
    .map(([id, v]) => ({ news: state.news.find(n => n.id === id), v }))
    .filter(x => x.news && Math.abs(x.v) > 1)
    .sort((a, b) => Math.abs(b.v) - Math.abs(a.v)).slice(0, 5);

  return {
    val, ret, bench, excess, dims, overall, best, worst, ranked, sectors: [...sectors],
    hhi, topWeight, trades, perWeek, topEvents,
    strong: [...new Set(strong)].filter(c => !weak.includes(c)),
    weak: [...new Set(weak)],
    cashPct: state.cash / val, benchDD
  };
}

function endGame() {
  if (state.ended) return;
  state.ended = true;
  state.report = computeReport();
  save();
}

/* ============================================================================
 * 13. ENGINE — persistence
 * ----------------------------------------------------------------------------
 * localStorage can be unavailable (private windows, blocked site data), so
 * every read and write is guarded and the app works fine without it.
 * ========================================================================== */
const SAVE_KEY = 'market-lab-save-v1';

function save() {
  try {
    const slim = Object.assign({}, state);
    localStorage.setItem(SAVE_KEY, JSON.stringify(slim));
  } catch (e) { /* storage unavailable — play continues in memory */ }
}
function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const s = JSON.parse(raw);
    if (!s || s.v !== 1 || !s.prices) return false;
    state = s;
    state.calendar = state.calendar || buildCalendar(state.length + 2);
    state.preCal = state.preCal || buildPreCalendar(BACKFILL);
    RNG = mulberry32(hashSeed(String(state.seed)) + state.day * 7919);
    NEWS_SEQ = state.news.reduce((m, n) => Math.max(m, +String(n.id).slice(1) || 0), 0) + 1;
    return true;
  } catch (e) { return false; }
}
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }
/* ============================================================================
 * 14. CHARTS
 * ----------------------------------------------------------------------------
 * Hand-built SVG, no chart library. House rules applied throughout:
 *   - 2px lines, >=8px end markers with a 2px surface ring, 10% area washes
 *   - hairline gridlines one step off the surface, never dashed
 *   - a legend whenever there are two or more series; one series needs none
 *   - crosshair + tooltip on every time series (an HTML chart is interactive)
 *   - text always wears text tokens, never the series color
 * ========================================================================== */

const CHARTS = {};
let CHART_SEQ = 0;

function niceTicks(min, max, count) {
  const span = max - min || Math.abs(max) || 1;
  const step0 = span / count;
  const mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const norm = step0 / mag;
  const step = (norm >= 5 ? 10 : norm >= 2 ? 5 : norm >= 1 ? 2 : 1) * mag;
  const out = [];
  for (let v = Math.ceil(min / step) * step; v <= max + 1e-9; v += step) out.push(+v.toFixed(10));
  return out;
}

/* cfg: { series:[{name,color,data:[n]}], xLabels:[], height, yFmt, area, markers } */
function lineChart(cfg) {
  const id = 'ch' + (++CHART_SEQ);
  /* The viewBox is narrower on small screens so that axis text, which scales
     with the box, stays legible on a phone instead of shrinking to 5px. */
  const small = typeof window !== 'undefined' && window.innerWidth < 760;
  const W = small ? 430 : 820;
  const FS = small ? 13 : 12;
  const H = (cfg.height || 230) * (small ? 0.92 : 1);
  const pad = { l: cfg.yFmt === 'none' ? 10 : (small ? 46 : 56), r: small ? 10 : 16, t: 14, b: small ? 24 : 26 };
  const n = Math.max(...cfg.series.map(s => s.data.length));
  const all = cfg.series.flatMap(s => s.data).filter(v => isFinite(v));
  let min = Math.min(...all), max = Math.max(...all);
  if (min === max) { min -= 1; max += 1; }
  const span = max - min;
  min -= span * 0.10; max += span * 0.10;
  if (cfg.zeroBase) min = Math.min(0, min);

  const X = i => pad.l + (n <= 1 ? 0 : (i / (n - 1)) * (W - pad.l - pad.r));
  const Y = v => pad.t + (1 - (v - min) / (max - min)) * (H - pad.t - pad.b);
  const fmt = cfg.fmt || (v => fmtNum(v, 2));

  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(cfg.aria || 'Time series chart')}" data-chart="${id}">`;

  // gridlines + y axis labels
  const ticks = niceTicks(min, max, 4);
  ticks.forEach(t => {
    svg += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>`;
    if (cfg.yFmt !== 'none') svg += `<text x="${pad.l - 8}" y="${(Y(t) + 4).toFixed(1)}" text-anchor="end" font-size="${FS}" fill="var(--ink-3)" font-family="var(--sans)">${fmt(t)}</text>`;
  });

  // optional reference line (e.g. starting value)
  if (cfg.refLine != null && cfg.refLine >= min && cfg.refLine <= max) {
    svg += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${Y(cfg.refLine).toFixed(1)}" y2="${Y(cfg.refLine).toFixed(1)}" stroke="var(--axis)" stroke-width="1"/>`;
  }

  // event markers sit on the baseline so they never collide with the lines
  (cfg.markers || []).forEach(m => {
    const x = X(m.i);
    svg += `<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${pad.t}" y2="${H - pad.b}" stroke="var(--axis)" stroke-width="1" opacity=".55"/>`;
    svg += `<circle cx="${x.toFixed(1)}" cy="${H - pad.b}" r="3.5" fill="var(--${m.tier === 'market' ? 's7' : m.tier === 'major' ? 'serious' : 'warning'})"/>`;
  });

  cfg.series.forEach((s, si2) => {
    const pts = s.data.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
    /* an area wash only reads on a single series; under two lines it is noise */
    if (cfg.area && si2 === 0 && cfg.series.length === 1) {
      svg += `<polygon points="${X(0).toFixed(1)},${Y(min).toFixed(1)} ${pts} ${X(s.data.length - 1).toFixed(1)},${Y(min).toFixed(1)}" fill="${s.color}" opacity="0.10"/>`;
    }
    svg += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"${s.dash ? ' stroke-dasharray="5 4"' : ''}/>`;
    // end marker with a surface ring so it stays legible where lines cross
    const li = s.data.length - 1;
    svg += `<circle cx="${X(li).toFixed(1)}" cy="${Y(s.data[li]).toFixed(1)}" r="4.5" fill="${s.color}" stroke="var(--surface-1)" stroke-width="2"/>`;
  });

  // x labels: first, middle, last only — enough to orient, never a wall of text
  if (cfg.xLabels && cfg.xLabels.length) {
    [0, Math.floor((n - 1) / 2), n - 1].forEach((i, k) => {
      const anchor = k === 0 ? 'start' : k === 2 ? 'end' : 'middle';
      svg += `<text x="${X(i).toFixed(1)}" y="${H - 7}" text-anchor="${anchor}" font-size="${FS}" fill="var(--ink-3)" font-family="var(--sans)">${esc(cfg.xLabels[i] || '')}</text>`;
    });
  }

  svg += `<line class="crosshair" x1="0" x2="0" y1="${pad.t}" y2="${H - pad.b}" stroke="var(--ink-3)" stroke-width="1" opacity="0"/>`;
  cfg.series.forEach(s => {
    svg += `<circle class="hoverdot" cx="0" cy="0" r="4.5" fill="${s.color}" stroke="var(--surface-1)" stroke-width="2" opacity="0"/>`;
  });
  svg += `<rect x="${pad.l}" y="${pad.t}" width="${W - pad.l - pad.r}" height="${H - pad.t - pad.b}" fill="transparent" class="hit"/>`;
  svg += `</svg>`;

  CHARTS[id] = { cfg, X, Y, pad, W, H, n, fmt };

  const legend = cfg.series.length > 1
    ? `<div class="legend" style="margin-top:10px">${cfg.series.map(s => `<span class="li"><span class="key" style="background:${s.color}${s.dash ? ';opacity:.7' : ''}"></span>${esc(s.name)}</span>`).join('')}</div>`
    : '';
  return `<div class="chart-box">${svg}</div>${legend}`;
}

/* Small inline trend line for tables and tiles. No axes, no hover — it is a
   shape, not a readable chart, and the number beside it carries the value. */
function sparkline(data, color, w, h) {
  w = w || 92; h = h || 26;
  if (!data || data.length < 2) return '';
  const min = Math.min(...data), max = Math.max(...data), span = (max - min) || 1;
  const pts = data.map((v, i) => `${(i / (data.length - 1) * (w - 2) + 1).toFixed(1)},${(h - 2 - ((v - min) / span) * (h - 4)).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true" style="display:block">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

/* Ranked horizontal bars: the right form for comparing magnitudes, and it
   labels every row directly, which a pie or donut cannot do. */
function allocBars(rows, total) {
  if (!rows.length) return '<div class="empty">Nothing allocated yet.</div>';
  const max = Math.max(...rows.map(r => r.v));
  return `<div class="allocbar">` + rows.map(r => `
    <div class="allocrow">
      <span class="lbl"><span class="swatch" style="background:${r.cash ? 'var(--ink-3)' : (SECTOR_COLOR[r.k] || 'var(--s1)')}"></span>${esc(r.k)}</span>
      <span class="track"><span class="fill" style="width:${(r.v / max * 100).toFixed(1)}%;background:${r.cash ? 'var(--ink-3)' : (SECTOR_COLOR[r.k] || 'var(--s1)')}"></span></span>
      <span class="num right small">${(r.v / total * 100).toFixed(1)}%</span>
    </div>`).join('') + `</div>`;
}

/* Stacked composition bar with a 2px surface gap between segments. */
function compBar(rows, total) {
  return `<div class="compbar">` + rows.map(r =>
    `<span style="width:${(r.v / total * 100).toFixed(2)}%;background:${r.cash ? 'var(--ink-3)' : (SECTOR_COLOR[r.k] || 'var(--s1)')}" title="${esc(r.k)}"></span>`
  ).join('') + `</div>`;
}

/* --- hover layer ----------------------------------------------------------- */
function bindCharts(root) {
  root.querySelectorAll('svg[data-chart]').forEach(svg => {
    const rec = CHARTS[svg.dataset.chart];
    if (!rec) return;
    const tip = document.getElementById('chart-tip');
    const cross = svg.querySelector('.crosshair');
    const dots = [...svg.querySelectorAll('.hoverdot')];

    const move = e => {
      const r = svg.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width * rec.W;
      let i = Math.round((px - rec.pad.l) / ((rec.W - rec.pad.l - rec.pad.r) || 1) * (rec.n - 1));
      i = clamp(i, 0, rec.n - 1);
      const x = rec.X(i);
      cross.setAttribute('x1', x); cross.setAttribute('x2', x); cross.setAttribute('opacity', '.55');
      rec.cfg.series.forEach((s, k) => {
        const v = s.data[i];
        if (v == null || !dots[k]) return;
        dots[k].setAttribute('cx', x); dots[k].setAttribute('cy', rec.Y(v)); dots[k].setAttribute('opacity', '1');
      });
      tip.hidden = false;
      tip.innerHTML = `<div class="tip-h">${esc((rec.cfg.xLabels && rec.cfg.xLabels[i]) || '')}</div>`
        + rec.cfg.series.map(s => `<div class="tip-r"><span class="sec"><span class="swatch" style="display:inline-block;background:${s.color};margin-right:6px"></span>${esc(s.name)}</span><span>${rec.fmt(s.data[i])}</span></div>`).join('')
        + (rec.cfg.tipExtra ? rec.cfg.tipExtra(i) : '');
      const tw = tip.offsetWidth, th = tip.offsetHeight;
      tip.style.left = Math.min(window.innerWidth - tw - 10, e.clientX + 14) + 'px';
      tip.style.top = Math.max(8, e.clientY - th - 12) + 'px';
    };
    const leave = () => {
      tip.hidden = true;
      cross.setAttribute('opacity', '0');
      dots.forEach(d => d.setAttribute('opacity', '0'));
    };
    svg.addEventListener('mousemove', move);
    svg.addEventListener('mouseleave', leave);
    svg.addEventListener('touchmove', e => { if (e.touches[0]) move(e.touches[0]); }, { passive: true });
    svg.addEventListener('touchend', leave);
  });
}

V.market = () => {

    cap: (a, b) => b.cap - a.cap, gain: (a, b) => b.ch - a.ch, loss: (a, b) => a.ch - b.ch,

  list.sort(sorters[app.marketSort] || sorters.cap);

  return `

    <div class="seg">

        `<button data-act="sort" data-k="${k}" aria-pressed="${app.marketSort === k}">${l}</button>`).join('')}
    </div>
  </div>

  <div class="row wrap" style="margin-bottom:14px">
    ${['All', ...SECTORS].map(s => `<button class="chip" data-act="filter-sector" data-s="${esc(s)}" aria-pressed="${app.marketFilter === s}">
      ${s === 'All' ? '' : `<span class="swatch" style="background:${SECTOR_COLOR[s]}"></span>`}${esc(s)}</button>`).join('')}
  </div>

  ${state.watch.length ? `<div class="card pad-0" style="margin-bottom:14px">
    <div class="card-head" style="padding:16px 16px 0"><div class="card-title">Watchlist</div>
    <span class="card-sub">Companies you are following but do not own</span></div>
    ${marketTable(state.watch.map(t => {
      const co = BY_TICKER[t], f = fundOf(t), px = priceOf(t);

    }))}
