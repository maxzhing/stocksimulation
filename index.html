  const gRoll = rnd() + state.macro.sentiment * 0.12 + (state.macro.growth - 2) * 0.06;
  const guide = gRoll > 0.70 ? 'raise' : gRoll > 0.30 ? 'inline' : 'cut';
  const volK = clamp(co.vol / 0.015, 0.6, 2.0);
  const ru = runUp(t, 15);

  /* ------------------------------------------------------------------------
     THE REACTION. Built from five named ingredients, deliberately including a
     genuinely random one — how the market happened to receive the report on the
     day. That randomness is the point: real reactions are not predictable from
     the numbers, so this simulation must not be either. Every ingredient is
     recorded so the news card can explain what actually dominated, which keeps
     the move explainable without making it forecastable. */
  const parts = [];
  let move = surprise * 0.55 * volK;
  parts.push({ k: 'surprise', p: move, l: `Profit came in ${fmtPct(surprise, 1)} versus the estimate` });

  const gp = (guide === 'raise' ? 0.035 : guide === 'cut' ? -0.055 : 0) * volK;
  move += gp;
  if (gp) parts.push({ k: 'guidance', p: gp, l: `Guidance for next quarter was ${guide === 'raise' ? 'raised' : 'cut'}` });

  /* margin and one-off quality of the result — good revenue can hide bad profit */
  const quality = gauss() * 0.022;
  move += quality;
  parts.push({ k: 'quality', p: quality, l: quality < -0.008
    ? 'The quality of the result was weaker than the headline: margins slipped and part of the beat came from one-off items'
    : quality > 0.008 ? 'The quality of the result was better than the headline: margins expanded and the beat was operational rather than one-off'
    : 'Margins were broadly in line with the previous quarter' });

  let pricedNote = '';
  if (ru > 0.07) {
    const drag = Math.min(0.06, (ru - 0.07) * 0.45);
    move -= drag;
    parts.push({ k: 'priced-in', p: -drag, l: 'Expectations had already risen into the report' });
    pricedNote = `Going in, ${t} had already outperformed the market by ${fmtPct(ru, 1)} over three weeks — a lot of good news was in the price before the numbers were published.`;
  } else if (ru < -0.07) {
    const relief = Math.min(0.045, (Math.abs(ru) - 0.07) * 0.40);
    move += relief;
    parts.push({ k: 'priced-in', p: relief, l: 'Expectations going in were low' });
    pricedNote = `${t} had underperformed the market by ${fmtPct(Math.abs(ru), 1)} into the report, so expectations were low and the bar to clear was correspondingly lower.`;
  }

  /* how it was received: positioning, the mood of the market that morning, what
     other companies said this week. Unknowable in advance — as in reality. */
  const reception = gauss() * 0.030 * volK + state.macro.sentiment * 0.010;
  move += reception;
  parts.push({ k: 'reception', p: reception, l: reception >= 0
    ? 'Investors chose to focus on the encouraging parts of the report'
    : 'Investors chose to focus on the cautious parts of the report' });

  move = clamp(move, -0.15, 0.15);
  parts.sort((a, b) => Math.abs(b.p) - Math.abs(a.p));
  const driverPart = parts[0];

  const revenue = +(f.revenue * (1 + co.growth / 4 * g + surprise * 0.25)).toFixed(1);
  const netInc  = +(actual * 4 * co.shares).toFixed(1);
  f.eps = +(f.eps * 0.55 + actual * 4 * 0.45).toFixed(2);
  f.revenue = revenue;
  f.netIncome = netInc;
  f.lastSurprise = surprise;
  f.lastGuide = guide;

  const beat = surprise > 0.005, miss = surprise < -0.005;
  const gWord = guide === 'raise' ? 'raised its guidance for the coming quarter'
    : guide === 'cut' ? 'cut its guidance for the coming quarter'
    : 'left its guidance for the coming quarter unchanged';

  const head = `${co.name} reports ${beat ? 'stronger-than-expected' : miss ? 'weaker-than-expected' : 'in-line'} quarterly earnings`;
  const body = `${co.name} reported earnings of ${fmtMoney(actual)} per share against an expected ${fmtMoney(estEps)} — `
    + `${beat ? 'a beat of ' + fmtPct(surprise, 1).replace('+', '') : miss ? 'a miss of ' + (surprise * 100).toFixed(1) + '%' : 'essentially in line'}. `
    + `Revenue came in at $${revenue.toFixed(1)}B. Management ${gWord}. The result was released after the closing bell; the shares will react at tomorrow's open.`;

  /* Did the market do the counter-intuitive thing? If so, say so loudly — this
     is the single most valuable lesson the news system can teach. */
  const flip = (beat && move < -0.008) ? 'beat-fell' : (miss && move > 0.008) ? 'miss-rose' : null;

  const why = `Earnings are judged against expectations, not against zero. `
    + (beat ? 'The company earned more than analysts forecast, ' : miss ? 'The company earned less than analysts forecast, ' : 'The company earned roughly what was forecast, ')
    + (guide === 'cut' ? 'but its outlook for next quarter was cut — and the outlook changes every future year in an investor\'s model, not just the quarter that has passed. '
      : guide === 'raise' ? 'and it raised its outlook, which lifts every future year in an investor\'s model rather than just the quarter reported. '
      : 'and the outlook was unchanged, so the result had to carry the reaction on its own. ')
    + (pricedNote ? pricedNote + ' ' : '')
    + `The largest single factor in the reaction was this: ${driverPart.l.toLowerCase()}. `
    + `Remember that a company can be highly profitable and still see its shares fall: the market prices the gap between what happened and what was already assumed.`;

  const news = pushNews({
    tplId: 'earnings', tier: Math.abs(move) > 0.05 ? 'major' : 'moderate', scope: 'company',
    cat: 'Earnings', head, body, why, targets: [t], spill: [],
    concepts: ['earnings', 'expectations', 'priced-in', 'pe-ratio'],
    earnings: { eps: actual, est: estEps, surprise, guide, revenue, move, parts: parts.slice(0, 5) },
    afterClose: true, flip: flip,
    flipNote: flip === 'beat-fell'
      ? `${co.name} beat expectations and the shares are set to FALL ${fmtPct(Math.abs(move), 1).replace('+', '')} at the open. A beginner would expect the opposite. What happened is that the result was measured against what was already assumed — ${driverPart.l.toLowerCase()} — and on that measure the report fell short. Profit going up is not the same as profit going up by more than people had already paid for.`
      : flip === 'miss-rose'
      ? `${co.name} MISSED expectations and the shares are set to RISE ${fmtPct(move, 1)} at the open. This surprises people, and the mechanism is the mirror image: investors had braced for something worse. When a result is bad but less bad than feared, the uncertainty discount in the price is released and the shares can rally on genuinely poor numbers.`
      : null
  });

  state.pendingOpen.push({ ticker: t, gap: move, label: `Earnings reaction: ${beat ? 'beat' : miss ? 'miss' : 'in line'}, guidance ${guide}`, evId: news.id });
  addEffect(news.id, `Follow-through from ${t} earnings`, { ticker: t }, 0, move * 0.12, 4, 1);
  /* sympathy move for close peers — results read across an industry */
  addEffect(news.id, `Read-across from ${t}'s results`, { sector: co.sector }, move * 0.18, 0, 2, 1);
  return news;
}

const macroGrowthFactor = () => clamp(1 + (state.macro.growth - 2.0) * 0.05 + state.macro.sentiment * 0.02, 0.9, 1.12);

/* Choose the day's unscheduled news. Weighted so that minor stories are common
   and market-shaking ones are rare — as in life. */
function generateEvents() {
  const fired = [];
  const day = state.day;

  if (state.schedule.fomc.includes(day)) {
    const m = state.macro;
    let id;
    if (m.inflation > 3.05 && rnd() < 0.7) id = 'fed_hike';
    else if ((m.growth < 1.5 || m.sentiment < -0.35) && m.inflation < 3.0 && rnd() < 0.65) id = 'fed_cut';
    else if (rnd() < 0.32) id = m.inflation > 2.7 ? 'fed_hike' : 'fed_cut';   // data-dependent move
    else id = rnd() < 0.5 ? 'fed_hold_hawkish' : 'fed_hold_dovish';
    fired.push(fireEvent(id));
  }
  if (state.schedule.cpi.includes(day)) {
    const hot = rnd() < clamp(0.35 + (state.macro.inflation - 2.5) * 0.18, 0.15, 0.75);
    fired.push(fireEvent(hot ? 'cpi_hot' : 'cpi_cool'));
  }

  let n = (rnd() < 0.82 ? 1 : 0) + (rnd() < 0.45 ? 1 : 0) + (rnd() < 0.15 ? 1 : 0);
  const tierW = { minor: 1.7, moderate: 1.0, major: 0.42, market: 0.55 };
  for (let k = 0; k < n; k++) {
    const pool = EVENT_TEMPLATES.filter(eligible);
    if (!pool.length) break;
    let total = 0;
    const weights = pool.map(t => { const w = t.weight * (tierW[t.tier] || 1); total += w; return w; });
    let r = rnd() * total, chosen = pool[0];
    for (let i = 0; i < pool.length; i++) { r -= weights[i]; if (r <= 0) { chosen = pool[i]; break; } }
    fired.push(fireEvent(chosen.id));
  }
  return fired.filter(Boolean);
}

/* ============================================================================
 * 9. ENGINE — the price model
 * ----------------------------------------------------------------------------
 * Every day, every stock's move is assembled from named components and the
 * components are stored with the bar. Nothing is hidden: the research card can
 * show you exactly what moved a price and by how much.
 * ========================================================================== */
function stepPrices() {
  const idx = si(state.day);
  const gaps = {};
  state.pendingOpen.forEach(p => {
    gaps[p.ticker] = gaps[p.ticker] || [];
    gaps[p.ticker].push(p);
  });
  const trend = state.macro;
  const marketDrift = 0.00035 + trend.sentiment * 0.0022 + (trend.growth - 2.0) * 0.0006;
  updateSectorTilt();

  STOCKS.forEach(co => {
    const s = state.prices[co.t];
    const prev = s[idx - 1].c;
    const drivers = [];

    /* --- overnight: anything announced after yesterday's close --- */
    let gapPct = 0;
    (gaps[co.t] || []).forEach(g => { gapPct += g.gap; drivers.push({ l: g.label, p: g.gap, ev: g.evId, gap: true }); });
    const open = +(prev * (1 + gapPct + gauss() * co.vol * 0.12)).toFixed(2);

    /* --- ex-dividend adjustment --- */
    let divPct = 0;
    const exDays = state.schedule.exDiv[co.t] || [];
    if (exDays.includes(state.day) && state.fund[co.t].div > 0) {
      const q = state.fund[co.t].div / 4;
      divPct = -q / prev;
      drivers.push({ l: `Ex-dividend: ${fmtMoney(q)} per share paid out of the company`, p: divPct });
    }

    /* --- broad market conditions --- */
    const macroPct = marketDrift * co.mktBeta;
    if (Math.abs(macroPct) > 0.0004) {
      drivers.push({ l: `Market conditions — ${macroRegime().label.toLowerCase()} backdrop, ${co.t} moves ${co.mktBeta.toFixed(2)}x the market`, p: macroPct });
    }

    /* --- active event effects --- */
    let evPct = 0;
    state.effects.forEach(e => {
      if (!matches(co, e.match)) return;
      const base = e.queue[0];
      if (base == null) return;
      const scale = e.match.market ? co.mktBeta : 1;
      const p = base * scale * e.factor;
      if (Math.abs(p) < 0.0003) return;
      evPct += p;
      drivers.push({ l: e.label, p, ev: e.evId });
    });

    /* --- sector rotation --- */
    const tilt = (state.tilt && state.tilt[co.sector]) || 0;
    if (Math.abs(tilt) > 0.0004) {
      drivers.push({
        l: `Sector rotation — money ${tilt > 0 ? 'moving into' : 'moving out of'} ${co.sector} as the ${macroRegime().label.toLowerCase()} backdrop shifts`,
        p: tilt
      });
    }

    /* --- valuation anchor: prices drift back toward what earnings support --- */
    const f = state.fund[co.t];
    const regimeMult = 1 + (BASE_RATE - state.macro.rate) * 0.045 + state.macro.sentiment * 0.05;
    const fair = f.basePE && f.eps > 0
      ? f.eps * f.basePE * regimeMult
      : (f.revenue / co.shares) * f.basePS * regimeMult;
    const gapToFair = clamp(fair / prev - 1, -0.35, 0.35);
    const anchor = gapToFair * 0.011;
    if (Math.abs(anchor) > 0.0005) {
      drivers.push({
        l: gapToFair < 0
          ? `Valuation: price sits ${fmtPct(-gapToFair, 0).replace('+', '')} above what current earnings support`
          : `Valuation: price sits ${fmtPct(gapToFair, 0).replace('+', '')} below what current earnings support`,
        p: anchor
      });
    }

    /* --- ordinary buying and selling ---------------------------------------
       Deliberately kept small and hard-capped, so it can never be the reason a
       stock moves several percent. Big moves in this simulation always trace
       back to a named cause. It is labelled rather than hidden, because a price
       drifting on the balance of buyers and sellers IS the explanation — that is
       what supply and demand looks like on an ordinary day. */
    /* Capped in ABSOLUTE terms as well as relative: without the absolute cap a
       3%-volatility stock could drift 2.6% on nothing at all, and would then top
       the "biggest movers" list with "no specific news" as its explanation —
       which would quietly undermine the rule the whole app is built on. */
    const noise = clamp(gauss() * co.vol * 0.36, -Math.min(co.vol * 0.9, 0.013), Math.min(co.vol * 0.9, 0.013));
    drivers.push({ l: 'Ordinary buying and selling between investors — no specific news', p: noise });

    let total = gapPct + divPct + macroPct + tilt + evPct + anchor + noise;
    total = clamp(total, -0.24, 0.24);
    const close = Math.max(0.5, +(prev * (1 + total)).toFixed(2));

    drivers.sort((a, b) => Math.abs(b.p) - Math.abs(a.p));
    /* Volume and the high/low wicks rise with the size of the move and with how
       much event activity drove it — which is exactly why volume is worth
       reading next to a candlestick pattern. */
    const boost = Math.min(2.4, Math.abs(evPct + gapPct) / Math.max(0.004, co.vol) * 0.55);
    const bar = makeBar(open, close, co, boost);
    bar.drivers = drivers.slice(0, 7);
    s[idx] = bar;

    attributeMove(co, prev, drivers);
  });

  /* --- ETFs: priced from the basket they hold, after the shares have moved --- */
  COMPANIES.filter(c => c.kind === 'etf').forEach(co => {
    const s = state.prices[co.t];
    const prev = s[idx - 1].c;
    const r = etfDayReturn(co, idx);
    const drivers = [];
    const fee = -(co.etf.exp || 0) / 252;
    let total = r.r + fee;
    if (r.contrib && r.contrib.length) {
      drivers.push({ l: `Tracks its basket of ${r.n} holdings — the fund moved because they did`, p: r.r - r.contrib.reduce((a, x) => a + x.c, 0) });
      r.contrib.forEach(x => drivers.push({ l: `${x.t} contributed ${fmtPct(x.c, 2)} of the fund's move (its weight x its move)`, p: x.c, tkr: x.t }));
    } else {
      drivers.push({ l: 'Tracks a basket of holdings not modelled individually in this simulation', p: r.r });
    }
    (r.notes || []).forEach(n => { drivers.push(n); total += 0; });
    drivers.push({ l: `Expense ratio: ${((co.etf.exp || 0) * 100).toFixed(2)}% a year, charged daily — the cost of owning the fund`, p: fee });
    total = clamp(total, -0.18, 0.18);
    const close = Math.max(0.5, +(prev * (1 + total)).toFixed(2));
    const open = +(prev * (1 + total * 0.45 + gauss() * co.vol * 0.1)).toFixed(2);
    drivers.sort((a, b) => Math.abs(b.p) - Math.abs(a.p));
    const bar = makeBar(open, close, co, Math.min(1.6, Math.abs(total) / Math.max(0.004, co.vol) * 0.4));
    bar.drivers = drivers.slice(0, 6);
    s[idx] = bar;
    attributeMove(co, prev, drivers);
  });

  /* age the effects: shift one day off each queue, drop the spent ones */
  state.effects.forEach(e => e.queue.shift());
  state.effects = state.effects.filter(e => e.queue.length > 0);
  state.index[idx] = indexValue(idx);
}

/* Credit each day's move back to the stories that caused it, and work out what
   those stories did to YOUR holdings specifically. */
function attributeMove(co, prev, drivers) {
  const held = state.positions[co.t];
  drivers.forEach(d => {
    if (!d.ev) return;
    const n = state.news.find(x => x.id === d.ev);
    if (n) n.reactions[co.t] = (n.reactions[co.t] || 0) + d.p;
    if (held && held.sh > 0) state.eventImpact[d.ev] = (state.eventImpact[d.ev] || 0) + held.sh * prev * d.p;
  });
}

/* --- Advance one session --------------------------------------------------- */
function advanceDay() {
  if (state.ended) return;
  if (state.day >= state.length) { endGame(); return; }

  state.day++;
  // make room for the new bar
  COMPANIES.forEach(co => { state.prices[co.t][si(state.day)] = { o: 0, h: 0, l: 0, c: 0, v: 0, drivers: [] }; });
  state.index[si(state.day)] = state.index[si(state.day) - 1];

  driftMacro();
  generateEvents();
  stepPrices();
  state.pendingOpen = [];

  fillQueuedOrders();
  payDividends();
  recordHistory();
  checkCoach();
  afterCloseAnnouncements();
  maybeScenario();
  maybeChartChallenge();

  if (state.day >= state.length) endGame();
  save();
}

/* Earnings are released after the closing bell. The stock is effectively
   untradeable until the next open, and any order placed now is queued. */
function afterCloseAnnouncements() {
  STOCKS.forEach(co => {
    const days = state.schedule.earnings[co.t] || [];
    if (!days.includes(state.day)) return;
    const n = runEarnings(co.t);
    /* A result that moves the price the "wrong" way is the most valuable
       teaching moment in the whole simulation, so it is never buried. */
    if (n && n.flip) {
      markConcept('expectations'); markConcept('priced-in');
      toast('lesson', n.flip === 'beat-fell' ? 'Good news, falling stock' : 'Bad news, rising stock', n.flipNote, 'priced-in');
    }
  });
}

function payDividends() {
  COMPANIES.forEach(co => {
    const ex = state.schedule.exDiv[co.t] || [];
    if (!ex.includes(state.day)) return;
    const pos = state.positions[co.t];
    if (!pos || pos.sh <= 0) return;
    const q = state.fund[co.t].div / 4;
    const cash = +(q * pos.sh).toFixed(2);
    state.cash += cash;
    state.stats.dividends += cash;
    state.tx.unshift({ day: state.day, date: dateLabel(state.day), side: 'DIV', t: co.t, sh: pos.sh, px: q, value: cash });
    coach('dividend');
    toast('lesson', 'Dividend received', `${co.t} paid ${fmtMoney(q)} per share — ${fmtMoney(cash)} into your cash balance. The share price was adjusted down by the same amount today, so nothing appeared from nowhere: value moved from the share price into your account.`);
  });
}

const dateLabel = d => (state.calendar[d - 1] || { label: '' }).label;

/* ============================================================================
 * 10. ENGINE — portfolio, trading and constraints
 * ----------------------------------------------------------------------------
 * The constraints here are deliberate teaching devices: no borrowing, no short
 * selling, no trading a stock that is halted pending an announcement, and a
 * bid-ask spread on every fill so that activity has a visible cost.
 * ========================================================================== */

const askOf = t => +(priceOf(t) * (1 + SPREAD)).toFixed(2);
const bidOf = t => +(priceOf(t) * (1 - SPREAD)).toFixed(2);
const sharesHeld = t => (state.positions[t] && state.positions[t].sh) || 0;

/* A stock whose results are pending cannot be traded until the market reopens. */
function haltedTickers() {
  return new Set(state.pendingOpen.map(p => p.ticker));
}
const isHalted = t => haltedTickers().has(t);

function totalValue() {
  let v = state.cash;
  Object.keys(state.positions).forEach(t => { v += state.positions[t].sh * priceOf(t); });
  return v;
}
function investedValue() {
  let v = 0;
  Object.keys(state.positions).forEach(t => { v += state.positions[t].sh * priceOf(t); });
  return v;
}

function holdings() {
  return Object.keys(state.positions)
    .filter(t => state.positions[t].sh > 0)
    .map(t => {
      const p = state.positions[t], co = BY_TICKER[t], px = priceOf(t);
      const value = p.sh * px, cost = p.sh * p.avg;
      return {
        t, co, sh: p.sh, avg: p.avg, px, value, cost,
        pl: value - cost, plPct: cost ? value / cost - 1 : 0,
        dayPl: p.sh * (px - prevCloseOf(t)),
        dayPct: dayChangeOf(t),
        weight: value / Math.max(1, totalValue())
      };
    })
    .sort((a, b) => b.value - a.value);
}

/* Ranked sector weights. A chart never plots more than seven categories plus
   cash — anything beyond that folds into "Other" rather than inventing new
   hues, which is what keeps the colours meaningful across screens. */
function sectorAllocation(maxCats) {
  const map = {};
  holdings().forEach(h => { map[h.co.sector] = (map[h.co.sector] || 0) + h.value; });
  const tv = totalValue();
  let rows = Object.entries(map).map(([k, v]) => ({ k, v, w: v / tv })).sort((a, b) => b.v - a.v);
  const cap = maxCats || 7;
  if (rows.length > cap) {
    const rest = rows.slice(cap - 1);
    rows = rows.slice(0, cap - 1);
    rows.push({ k: 'Other sectors', v: rest.reduce((a, r) => a + r.v, 0), w: rest.reduce((a, r) => a + r.w, 0), other: true, members: rest.map(r => r.k) });
  }
  if (state.cash > 0) rows.push({ k: 'Cash', v: state.cash, w: state.cash / tv, cash: true });
  return rows;
}

function buy(t, sh, opts) {
  opts = opts || {};
  sh = Math.floor(sh);
  if (!sh || sh < 1) return { ok: false, msg: 'Enter a whole number of shares.' };
  if (state.ended) return { ok: false, msg: 'The simulation has finished. Restart to trade again.' };
  if (isHalted(t)) return queueOrder(t, 'BUY', sh);

  const px = askOf(t), cost = +(sh * px).toFixed(2);
  if (cost > state.cash) {
    coach('insufficient-cash');
    return { ok: false, msg: `That order costs ${fmtMoney(cost)} but you have ${fmtMoney(state.cash)}. There is no borrowing in this simulation — you can only invest money you actually hold.` };
  }
  const p = state.positions[t] || { sh: 0, avg: 0, invested: 0, firstDay: state.day };
  const newSh = p.sh + sh;
  p.avg = +(((p.avg * p.sh) + cost) / newSh).toFixed(4);
  p.sh = newSh;
  p.invested = +(p.invested + cost).toFixed(2);
  p.lastBuyDay = state.day;
  state.positions[t] = p;
  state.cash = +(state.cash - cost).toFixed(2);
  state.stats.buys++;
  state.stats.spreadPaid += sh * priceOf(t) * SPREAD;
  if (state.learn.research[t]) state.stats.researchedBeforeBuy++; else state.stats.boughtUnresearched++;
  if (BY_TICKER[t].kind === 'etf') state.stats.etfBought++;
  state.tx.unshift({ day: state.day, date: dateLabel(state.day), side: 'BUY', t, sh, px, value: cost });

  coach('first-buy');
  checkCoach();
  save();
  return { ok: true, msg: `Bought ${sh} ${t} at ${fmtMoney(px)} — ${fmtMoney(cost)}.`, px, cost };
}

function sell(t, sh, opts) {
  opts = opts || {};
  sh = Math.floor(sh);
  const held = sharesHeld(t);
  if (!sh || sh < 1) return { ok: false, msg: 'Enter a whole number of shares.' };
  if (state.ended) return { ok: false, msg: 'The simulation has finished. Restart to trade again.' };
  if (sh > held) {
    coach('oversell');
    return { ok: false, msg: `You hold ${held} shares of ${t}. Selling shares you do not own (short selling) is not available in this simulation.` };
  }
  if (isHalted(t)) return queueOrder(t, 'SELL', sh);

  const px = bidOf(t), proceeds = +(sh * px).toFixed(2);
  const p = state.positions[t];
  const realized = +((px - p.avg) * sh).toFixed(2);
  const heldDays = state.day - (p.lastBuyDay || p.firstDay || state.day);

  p.sh -= sh;
  if (p.sh <= 0) delete state.positions[t]; else state.positions[t] = p;
  state.cash = +(state.cash + proceeds).toFixed(2);
  state.stats.sells++;
  state.stats.spreadPaid += sh * priceOf(t) * SPREAD;
  state.realized = state.realized || {};
  state.realized[t] = +((state.realized[t] || 0) + realized).toFixed(2);
  state.tx.unshift({ day: state.day, date: dateLabel(state.day), side: 'SELL', t, sh, px, value: proceeds, realized });

  coach('first-sell');
  if (heldDays <= 3) { state.stats.quickFlips++; coach('quick-flip'); }
  if (realized < 0 && dayChangeOf(t) < -0.025) { state.stats.panicSells++; coach('panic-sell'); }
  checkCoach();
  save();
  return { ok: true, msg: `Sold ${sh} ${t} at ${fmtMoney(px)} — ${fmtMoney(proceeds)}. Realised ${realized >= 0 ? 'gain' : 'loss'} of ${fmtMoney(Math.abs(realized))}.`, px, proceeds, realized };
}

/* Orders placed while a stock is halted fill at the NEXT open, which may be far
   from the last price you saw. That is gap risk, and it is real. */
function queueOrder(t, side, sh) {
  state.queued.push({ t, side, sh, placedDay: state.day, ref: priceOf(t) });
  coach('queued-order');
  save();
  return { ok: true, queued: true, msg: `${side === 'BUY' ? 'Buy' : 'Sell'} order for ${sh} ${t} queued. ${t} reports after the close, so the order will fill at tomorrow's opening price — which may differ from tonight's ${fmtMoney(priceOf(t))}.` };
}

function fillQueuedOrders() {
  if (!state.queued.length) return;
  const rest = [];
  state.queued.forEach(o => {
    const openPx = state.prices[o.t][si(state.day)].o;
    const gap = openPx / o.ref - 1;
    if (o.side === 'BUY') {
      const px = +(openPx * (1 + SPREAD)).toFixed(2), cost = +(o.sh * px).toFixed(2);
      if (cost > state.cash) {
        toast('warn', 'Queued order could not fill', `Your queued buy of ${o.sh} ${o.t} needed ${fmtMoney(cost)} at the open but you hold ${fmtMoney(state.cash)}. The order was cancelled. Prices move overnight — an order sized to your last cash balance can become unaffordable by morning.`);
        return;
      }
      const p = state.positions[o.t] || { sh: 0, avg: 0, invested: 0, firstDay: state.day };
      const n = p.sh + o.sh;
      p.avg = +(((p.avg * p.sh) + cost) / n).toFixed(4);
      p.sh = n; p.invested = +(p.invested + cost).toFixed(2); p.lastBuyDay = state.day;
      state.positions[o.t] = p;
      state.cash = +(state.cash - cost).toFixed(2);
      state.stats.buys++;
      state.tx.unshift({ day: state.day, date: dateLabel(state.day), side: 'BUY', t: o.t, sh: o.sh, px, value: cost, gapped: true });
    } else {
      const have = sharesHeld(o.t);
      const sh = Math.min(have, o.sh);
      if (!sh) return;
      const px = +(openPx * (1 - SPREAD)).toFixed(2), proceeds = +(sh * px).toFixed(2);
      const p = state.positions[o.t];
      const realized = +((px - p.avg) * sh).toFixed(2);
      p.sh -= sh;
      if (p.sh <= 0) delete state.positions[o.t]; else state.positions[o.t] = p;
      state.cash = +(state.cash + proceeds).toFixed(2);
      state.stats.sells++;
      state.realized = state.realized || {};
      state.realized[o.t] = +((state.realized[o.t] || 0) + realized).toFixed(2);
      state.tx.unshift({ day: state.day, date: dateLabel(state.day), side: 'SELL', t: o.t, sh, px, value: proceeds, realized, gapped: true });
    }
    toast('lesson', 'Queued order filled at the open',
      `${o.side === 'BUY' ? 'Bought' : 'Sold'} ${o.sh} ${o.t} at ${fmtMoney(openPx)}. When you placed it the price was ${fmtMoney(o.ref)} — the market opened ${fmtPct(gap, 1)} away. News that arrives while the market is shut shows up as a jump in the opening price rather than a gradual move.`);
    coach('gap-fill');
  });
  state.queued = rest;
}

function recordHistory() {
  const v = totalValue();
  state.hist.push({ day: state.day, value: v, cash: state.cash, invested: investedValue(), index: state.index[si(state.day)] });
  state.stats.peak = Math.max(state.stats.peak, v);
  state.stats.maxDD = Math.min(state.stats.maxDD, v / state.stats.peak - 1);
  if (state.cash / Math.max(1, v) > 0.8) state.stats.cashDays++;
}

function dayReturn() {
  const h = state.hist;
  if (h.length < 2) return 0;
  const a = h[h.length - 1].value, b = h[h.length - 2].value;
  return b ? a / b - 1 : 0;
}
const totalReturn = () => totalValue() / state.startCash - 1;
const benchReturn = () => state.index[si(state.day)] / 100 - 1;

/* ============================================================================
 * 11. ENGINE — the teaching layer
 * ========================================================================== */

function coach(id) {
  const spec = COACH[id];
  if (!spec) return;
  const last = state.learn.coach[id];
  if (last != null && !spec.repeat) return;
  if (last != null && spec.repeat && state.day - last < 14) return;
  state.learn.coach[id] = state.day;
  markConcept(spec.c);
  toast('lesson', spec.title, spec.text, spec.c);
}

function markConcept(id) {
  if (!id || !CONCEPT_BY_ID[id]) return;
  if (!state.learn.concepts[id]) state.learn.concepts[id] = { firstDay: state.day, count: 0 };
  state.learn.concepts[id].count++;
}

/* Behavioural checks that run after every trade and every session. */
function checkCoach() {
  const hs = holdings(), tv = totalValue();
  if (hs.length && hs[0].weight > 0.38) coach('concentration');
  if (new Set(hs.map(h => h.co.sector)).size >= 4) coach('diversified');
  if (state.day > 6 && state.cash / tv > 0.80 && state.stats.cashDays > 5) coach('all-cash');
  if (state.stats.maxDD < -0.12 && totalValue() / state.stats.peak - 1 < -0.10) coach('big-drawdown');
  STOCKS.forEach(co => {
    const days = state.schedule.earnings[co.t] || [];
    if (days.includes(state.day) && sharesHeld(co.t) > 0) coach('earnings-hold');
  });
}

/* "What would you do?" — fired by real portfolio conditions, never at random,
   and capped so the simulation teaches without nagging. */
function maybeScenario() {
  if (state.activeScenario) return;
  const done = Object.keys(state.learn.scenarios).length;
  if (done >= 5) return;
  if (state.learn.lastScenarioDay != null && state.day - state.learn.lastScenarioDay < 6) return;

  const hs = holdings();
  const idxNow = si(state.day);
  const mktDay = state.index[idxNow] / state.index[idxNow - 1] - 1;
  const cands = [];

  COMPANIES.forEach(co => {
    if ((state.schedule.earnings[co.t] || []).includes(state.day + 1) && sharesHeld(co.t) > 0) cands.push('sc-earnings-eve');
  });
  if (hs.some(h => h.plPct < -0.18)) cands.push('sc-down-20');
  if (hs.length >= 3 && hs[0].weight > 0.35) cands.push('sc-hot-sector');
  if (state.day > 8 && state.cash / totalValue() > 0.7) cands.push('sc-all-cash');
  if (mktDay < -0.022) cands.push('sc-crash-day');
  if (state.news[0] && state.news[0].tplId === 'earnings' && state.news[0].earnings
      && state.news[0].earnings.surprise > 0.01 && sharesHeld(state.news[0].targets[0]) > 0) cands.push('sc-priced-in');
  if (state.news.slice(0, 3).some(n => n.tplId && n.tplId.startsWith('fed_'))
      && hs.some(h => Math.abs(h.co.rateBeta) > 1.2)) cands.push('sc-rate-shock');
  if (state.news[0] && state.news[0].surprise && sharesHeld(state.news[0].targets[0]) > 0) cands.push('sc-unknown-shock');

  const fresh = cands.filter(id => !state.learn.scenarios[id]);
  if (!fresh.length) return;
  state.activeScenario = pick(fresh);
  state.learn.lastScenarioDay = state.day;
}

/* Freeze the chart at a moment that is actually interesting: a recognised
   pattern on something the player owns or is watching. Capped and spaced so it
   teaches rather than interrupts. */
function maybeChartChallenge() {
  if (state.activeChallenge || state.activeScenario) return;
  if (Object.keys(state.learn.chartReads).length >= 4) return;
  if (state.learn.lastChallengeDay != null && state.day - state.learn.lastChallengeDay < 9) return;
  if (state.day < 12) return;

  const pool = [...new Set([...Object.keys(state.positions), ...state.watch])].filter(t => BY_TICKER[t] && BY_TICKER[t].kind !== 'etf');
  const hits = [];
  pool.forEach(t => {
    const s = state.prices[t], end = si(state.day);
    const bars = s.slice(Math.max(0, end - 24), end + 1);
    const found = detectPatterns(bars, bars.length - 3, bars.length - 1);
    if (found.length) hits.push(t);
  });
  if (!hits.length) return;
  const t = pick(hits);
  state.activeChallenge = buildChartChallenge(t);
  state.activeChallenge.key = t + '-' + state.day;
  state.activeChallenge.auto = true;
  state.learn.lastChallengeDay = state.day;
}

/* ============================================================================
 * 12. ENGINE — end-of-game report
 * ----------------------------------------------------------------------------
 * Profit is ONE of six dimensions and not the most heavily weighted. The report
 * grades process — diversification, sizing, research, reaction to events and
 * trading discipline — because process is the part that transfers to real life.
 * ========================================================================== */

function letter(score) {
  return score >= 85 ? 'A' : score >= 72 ? 'B' : score >= 58 ? 'C' : score >= 42 ? 'D' : 'E';
}

function computeReport() {
  const val = totalValue();
  const ret = val / state.startCash - 1;
  const bench = benchReturn();
  const hs = holdings();
  const L = state.learn, S = state.stats;
  const realized = state.realized || {};

  /* per-company result: realised plus unrealised */
  const perCo = {};
  Object.keys(realized).forEach(t => { perCo[t] = (perCo[t] || 0) + realized[t]; });
  hs.forEach(h => { perCo[h.t] = (perCo[h.t] || 0) + h.pl; });
  const ranked = Object.entries(perCo).map(([t, v]) => ({ t, v })).sort((a, b) => b.v - a.v);
  const best = ranked[0], worst = ranked.length > 1 ? ranked[ranked.length - 1] : null;

  const sectors = new Set(hs.map(h => h.co.sector));
  const weights = hs.map(h => h.value / Math.max(1, val));
  const hhi = weights.reduce((a, w) => a + w * w, 0);
  const topWeight = weights.length ? Math.max(...weights) : 0;
  const trades = S.buys + S.sells;
  const perWeek = trades / Math.max(1, state.length / 5);

  let benchDD = 0, peak = 0;
  state.hist.forEach(h => { peak = Math.max(peak, h.index); benchDD = Math.min(benchDD, h.index / peak - 1); });
  const ddRatio = benchDD < -0.001 ? S.maxDD / benchDD : (S.maxDD < -0.05 ? 2 : 1);

  const qs = Object.values(L.quiz);
  const qCorrect = qs.filter(q => q.correct).length;
  const qAcc = qs.length ? qCorrect / qs.length : 0;
  const cq = Object.values(L.candleQuiz);
  const cqCorrect = cq.filter(q => q.correct).length;
  const cqAcc = cq.length ? cqCorrect / cq.length : 0;
  const cqHard = cq.filter(q => q.level === 'advanced').length;
  const patternsRead = Object.keys(L.patterns).length;
  const chartReads = Object.keys(L.chartReads).length;
  const scenarios = Object.keys(L.scenarios).length;
  const researchedPct = S.buys ? S.researchedBeforeBuy / S.buys : 0;
  const pagesRead = Object.keys(L.research).length;
  const flipsRead = Object.keys(L.flipsSeen).length;
  const labUse = L.lab.opens + L.lab.levels + L.lab.trends + Object.keys(L.lab.indicators).length * 2;

  const D = (k, s2, w, note, next) => ({ k, s: Math.round(clamp(s2, 0, 100)), w, note, next });

  const dims = [
    D('Market knowledge', qAcc * 60 + clamp(qs.length / 8, 0, 1) * 25 + clamp(Object.keys(L.concepts).length / CONCEPTS.length, 0, 1) * 15, 0.15,
      qs.length ? `You answered ${qs.length} of ${QUIZ.length} challenge questions and got ${qCorrect} right (${fmtPct(qAcc, 0).replace('+', '')}). You met ${Object.keys(L.concepts).length} of ${CONCEPTS.length} concepts in play.`
        : 'You did not attempt the challenge questions, so there is no evidence here either way. They are the fastest way to find out which market mechanics you have actually absorbed.',
      qAcc < 0.7 || qs.length < 5 ? 'Work through the remaining challenge questions in the Learning Center — each one explains why every option is right or wrong.' : 'Try a longer run with a different market seed and see whether your reasoning holds in a different regime.'),

    D('Research', researchedPct * 55 + clamp(pagesRead / 10, 0, 1) * 25 + clamp(L.eventReads / 12, 0, 1) * 20, 0.15,
      S.buys ? `You opened research on ${pagesRead} instrument${pagesRead === 1 ? '' : 's'} and read ${L.eventReads} event explanation${L.eventReads === 1 ? '' : 's'}. ${fmtPct(researchedPct, 0).replace('+', '')} of your purchases were in companies whose research card you had opened first${S.boughtUnresearched ? `; ${S.boughtUnresearched} were not` : ''}.`
        : `You opened research on ${pagesRead} instrument${pagesRead === 1 ? '' : 's'} but did not buy anything, so there is nothing to compare research against.`,
      researchedPct < 0.7 ? 'Before your next purchase, answer three questions in your own words: what does this company sell, what is already assumed in its price, and what would prove me wrong?' : 'Good habit. Next step: write down in advance what would make you sell, not just what made you buy.'),

    D('Risk management', clamp((1.6 - ddRatio) / 1.2, 0, 1) * 50 + clamp((0.5 - topWeight) / 0.35, 0, 1) * 30 + (S.panicSells === 0 ? 20 : clamp(20 - S.panicSells * 8, 0, 20)), 0.15,
      `Your deepest fall from peak was ${fmtPct(S.maxDD, 1)} against the market's ${fmtPct(benchDD, 1)}, and your largest single position reached ${fmtPct(topWeight, 0).replace('+', '')} of the portfolio. ` +
      (S.panicSells ? `You sold at a loss immediately after a sharp fall ${S.panicSells} time${S.panicSells > 1 ? 's' : ''} — the most common way a temporary loss becomes a permanent one.` : 'You did not sell into a sharp decline at a loss, which is harder than it sounds.'),
      topWeight > 0.35 ? 'Decide a maximum position size before you buy, not after. A useful test: could you tolerate this holding falling 40% overnight on news nobody predicted?' : 'Try defining your invalidation level in advance — the price or fact that would mean the idea was wrong.'),

    D('Diversification', !hs.length ? (S.buys ? 30 : 10) : clamp(sectors.size / 5, 0, 1) * 50 + clamp((0.45 - hhi) / 0.35, 0, 1) * 30 + clamp((0.45 - topWeight) / 0.30, 0, 1) * 20, 0.15,
      hs.length ? `You finished holding ${hs.length} position${hs.length === 1 ? '' : 's'} across ${sectors.size} sector${sectors.size === 1 ? '' : 's'}, with a concentration index of ${hhi.toFixed(2)}.`
        : 'You finished holding nothing, so there is no diversification to assess. Cash is a position too — it simply has different risks.',
      sectors.size < 4 ? 'Diversification is about owning things that fail for different reasons, not about owning more names. Check the shared-exposure panel on the Analytics screen.' : 'Well spread. The next question is whether each holding earns its place, or whether some are there only to fill a slot.'),

    D('Understanding of news', clamp(L.eventReads / 10, 0, 1) * 45 + clamp(flipsRead / 3, 0, 1) * 35 + clamp(scenarios / 4, 0, 1) * 20, 0.12,
      `You opened ${L.eventReads} "why does this matter?" explanation${L.eventReads === 1 ? '' : 's'} and read ${flipsRead} counter-intuitive reaction${flipsRead === 1 ? '' : 's'} where good news moved a stock down or bad news moved it up.`,
      flipsRead < 2 ? 'The most valuable events in this simulation are the ones where the market did the opposite of what the headline suggests. Open those news cards in full when they appear.' : 'You engaged with the events that break the obvious rule. Next: try predicting the reaction before you open the card, then check yourself.'),

    D('Candlestick knowledge', clamp(patternsRead / 14, 0, 1) * 35 + (cq.length ? cqAcc * 40 : 0) + clamp(cq.length / 8, 0, 1) * 15 + clamp(cqHard / 3, 0, 1) * 10, 0.10,
      patternsRead || cq.length ? `You studied ${patternsRead} of ${PATTERNS.length} patterns and answered ${cq.length} "Read the Candle" question${cq.length === 1 ? '' : 's'} with ${cqCorrect} correct${cqHard ? `, including ${cqHard} at advanced level` : ''}.`
        : 'You have not opened Candlestick School yet. It teaches what each pattern shows about buyers and sellers — and, just as importantly, when each one means nothing.',
      cqAcc < 0.7 || patternsRead < 8 ? 'Work through the single-candle patterns first. Most mistakes come from reading a shape without checking the trend before it and the volume behind it.' : 'Strong pattern recognition. The harder skill is judging when a correctly identified pattern should be ignored.'),

    D('Decision making', clamp(scenarios / 4, 0, 1) * 45 + clamp(chartReads / 3, 0, 1) * 35 + (S.quickFlips === 0 ? 20 : clamp(20 - S.quickFlips * 6, 0, 20)), 0.10,
      `You worked through ${scenarios} "What would you do?" decision${scenarios === 1 ? '' : 's'} and ${chartReads} chart analysis challenge${chartReads === 1 ? '' : 's'}. ` +
      (S.quickFlips ? `${S.quickFlips} position${S.quickFlips === 1 ? ' was' : 's were'} bought and sold within three sessions.` : 'You did not flip any position within three sessions.'),
      scenarios + chartReads < 4 ? 'The decision challenges are where the reasoning is practised. There is no correct answer in them — the value is in weighing the trade-offs before you act.' : 'You practised deciding under uncertainty with incomplete information, which is the actual job.'),

    D('Portfolio management', clamp(1 - Math.abs(S.cashDays / Math.max(1, state.day) - 0.15) * 2.2, 0, 1) * 35 + clamp((6 - perWeek) / 5, 0, 1) * 35 + clamp(S.dividends > 0 ? 1 : 0, 0, 1) * 10 + clamp(hs.length / 6, 0, 1) * 20, 0.08,
      `${trades} trade${trades === 1 ? '' : 's'} over ${state.length} sessions (about ${perWeek.toFixed(1)} a week), costing ${fmtMoney(S.spreadPaid)} in spread. You spent ${S.cashDays} session${S.cashDays === 1 ? '' : 's'} mostly in cash and collected ${fmtMoney(S.dividends)} in dividends.`,
      perWeek > 5 ? 'Activity is a cost, not a contribution. Each round trip needs two correct decisions and pays the spread twice.' : 'A measured pace. Next: think about how you would rebalance deliberately rather than only adding new positions.')
  ];

  const overall = Math.round(dims.reduce((a, d) => a + d.s * d.w, 0) / dims.reduce((a, d) => a + d.w, 0));

  /* "What did you learn?" — evidence drawn from what actually happened, not
     from the profit line. */
  const learned = [];
  if (flipsRead) learned.push(`You saw ${flipsRead} case${flipsRead === 1 ? '' : 's'} where the market moved against the headline, and read why. That is the single most useful thing a beginner can internalise: prices move on the gap between reality and expectation.`);
  if (qCorrect >= 3) learned.push(`You answered ${qCorrect} concept questions correctly, covering ${[...new Set(Object.entries(L.quiz).filter(([, r]) => r.correct).map(([id]) => (QUIZ.find(q => q.id === id) || {}).concept))].filter(Boolean).length} distinct ideas.`);
  if (sectors.size >= 4) learned.push(`You built a portfolio spanning ${sectors.size} sectors, so no single event could damage all of it at once.`);
  if (patternsRead >= 6) learned.push(`You studied ${patternsRead} candlestick patterns — and, more importantly, the conditions under which each one means nothing.`);
  if (S.dividends > 0) learned.push(`You received ${fmtMoney(S.dividends)} in dividends and saw the share price adjust down on the ex-dividend date, so you know that income is not free money.`);
  if (S.panicSells === 0 && S.maxDD < -0.05) learned.push(`You sat through a ${fmtPct(S.maxDD, 1)} drawdown without selling into it at a loss.`);
  if (state.stats.etfBought) learned.push('You used an ETF, which is a decision about how much company-specific risk you want rather than a bet on any one business.');
  if (!learned.length) learned.push('This run was short on evidence. Open a few research cards, read the "why does this matter?" explanation on a news story, and answer a couple of challenge questions — the report gets much more useful with something to go on.');

  const topEvents = Object.entries(state.eventImpact)
    .map(([id, v]) => ({ news: state.news.find(n => n.id === id), v }))
    .filter(x => x.news && Math.abs(x.v) > 1)
    .sort((a, b) => Math.abs(b.v) - Math.abs(a.v)).slice(0, 5);

  const strong = [], weak = [];
  Object.entries(L.quiz).forEach(([qid, r]) => {
    const q = QUIZ.find(x => x.id === qid);
    if (q) (r.correct ? strong : weak).push(q.concept);
  });
  Object.entries(L.candleQuiz).forEach(([, r]) => { if (!r.correct) weak.push('chart-context'); });
  if (sectors.size >= 4) strong.push('diversification'); else if (S.buys) weak.push('diversification');
  if (topWeight > 0.45) weak.push('position-sizing'); else if (hs.length) strong.push('position-sizing');
  if (S.panicSells > 0) weak.push('time-horizon'); else if (state.hist.length > 10) strong.push('time-horizon');
  if (perWeek > 5) weak.push('long-vs-short'); else if (trades > 0) strong.push('long-vs-short');
  if (S.dividends > 0) strong.push('dividends');
  if (flipsRead >= 2) strong.push('priced-in'); else weak.push('priced-in');
  if (patternsRead >= 8 && cqAcc > 0.6) strong.push('candlesticks'); else if (patternsRead || cq.length) weak.push('chart-context');
  if (state.stats.etfBought) strong.push('etfs'); else weak.push('etfs');
  if (researchedPct < 0.5 && S.buys > 2) weak.push('pe-ratio');

  return {
    val, ret, bench, excess: ret - bench, dims, overall, best, worst, ranked,
    sectors: [...sectors], hhi, topWeight, trades, perWeek, topEvents, learned,
    strong: [...new Set(strong)].filter(c => !weak.includes(c)),
    weak: [...new Set(weak)],
    cashPct: state.cash / val, benchDD, qAcc, cqAcc, patternsRead, flipsRead, labUse
  };
}

function endGame() {
  if (state.ended) return;
  state.ended = true;
  state.report = computeReport();
  save();
}

/* ============================================================================
 * 13. ENGINE — persistence
 * ----------------------------------------------------------------------------
 * localStorage can be unavailable (private windows, blocked site data), so
 * every read and write is guarded and the app works fine without it.
 * ========================================================================== */
const SAVE_KEY = 'market-lab-save-v2';
const SAVE_VERSION = 2;

let SAVE_TIMER = null;

/* Writing ~1MB on every click is wasteful, so bursts collapse into one write.
   The page always flushes before it unloads. */
function save(immediate) {
  if (immediate) { saveNow(); return; }
  clearTimeout(SAVE_TIMER);
  SAVE_TIMER = setTimeout(saveNow, 500);
}

function saveNow() {
  clearTimeout(SAVE_TIMER);
  if (!state) return;
  try {
    /* With ~90 instruments over hundreds of sessions a naive save blows past the
       storage quota. Bars are packed as [o,h,l,c,v] arrays, and the driver
       breakdown — which carries long explanatory strings — is kept only for the
       recent sessions the research card can actually display. */
    const keepFrom = si(state.day) - 6;
    const slim = Object.assign({}, state, {
      pk: 1,
      prices: Object.fromEntries(Object.entries(state.prices).map(([t, arr]) => [
        t, arr.map((b, i) => i >= keepFrom && b.drivers
          ? [b.o, b.h, b.l, b.c, b.v, b.drivers.slice(0, 5).map(d => [String(d.l).slice(0, 120), +d.p.toFixed(5), d.ev || 0])]
          : [b.o, b.h, b.l, b.c, b.v])
      ])),
      news: state.news.slice(0, 120)
    });
    localStorage.setItem(SAVE_KEY, JSON.stringify(slim));
  } catch (err) {
    /* Quota exceeded or storage blocked: drop the explanations and retry once,
       then give up silently — play continues perfectly well in memory. */
    try {
      const bare = Object.assign({}, state, {
        pk: 1,
        prices: Object.fromEntries(Object.entries(state.prices).map(([t, arr]) => [t, arr.map(b => [b.o, b.h, b.l, b.c, b.v])])),
        news: state.news.slice(0, 60)
      });
      localStorage.setItem(SAVE_KEY, JSON.stringify(bare));
    } catch (err2) { /* nothing more to do */ }
  }
}

/* Rehydrate packed bars back into objects. */
function unpackPrices(prices) {
  return Object.fromEntries(Object.entries(prices).map(([t, arr]) => [t, arr.map(b => {
    if (!Array.isArray(b)) return b;
    const bar = { o: b[0], h: b[1], l: b[2], c: b[3], v: b[4] };
    if (b[5]) bar.drivers = b[5].map(d => ({ l: d[0], p: d[1], ev: d[2] || undefined }));
    return bar;
  })]));
}

/* Any field added after a save was written must be filled in, and any save that
   does not match this build's universe must be rejected rather than half-loaded.
   A blank screen is the worst possible failure mode, so this is deliberately
   paranoid: anything unexpected falls back to a clean new game. */
function hydrate(s) {
  const d = blankState({ seed: s.seed, length: s.length, cash: s.startCash });
  const fill = (target, defaults) => {
    Object.keys(defaults).forEach(k => {
      if (target[k] == null) target[k] = defaults[k];
      else if (defaults[k] && typeof defaults[k] === 'object' && !Array.isArray(defaults[k]) && typeof target[k] === 'object') fill(target[k], defaults[k]);
    });
  };
  fill(s, d);
  if (!Array.isArray(s.calendar) || !s.calendar.length) s.calendar = buildCalendar(s.length + 2);
  if (!Array.isArray(s.preCal) || !s.preCal.length) s.preCal = buildPreCalendar(BACKFILL);
  return s;
}

function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const s = JSON.parse(raw);
    if (!s || s.v !== SAVE_VERSION || !s.prices || !s.length) return false;
    /* the saved market must contain exactly the instruments this build knows
       about, otherwise charts and the index would reference missing series */
    if (COMPANIES.some(c => !Array.isArray(s.prices[c.t]) || !s.prices[c.t].length)) return false;
    if (!Array.isArray(s.hist) || !Array.isArray(s.index)) return false;
    state = hydrate(s);
    if (state.pk === 1) state.prices = unpackPrices(state.prices);
    if (!state.prices[COMPANIES[0].t][si(state.day)]) return false;
    RNG = mulberry32(hashSeed(String(state.seed)) + state.day * 7919);
    NEWS_SEQ = state.news.reduce((m, n) => Math.max(m, +String(n.id).slice(1) || 0), 0) + 1;
    return true;
  } catch (e) {
    return false;
  }
}

function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }
/* ============================================================================
 * 14. CHARTS
 * ----------------------------------------------------------------------------
 * Hand-built SVG, no chart library. House rules applied throughout:
 *   - 2px lines, >=8px end markers with a 2px surface ring, 10% area washes
 *   - hairline gridlines one step off the surface, never dashed
 *   - a legend whenever there are two or more series; one series needs none
 *   - crosshair + tooltip on every time series (an HTML chart is interactive)
 *   - text always wears text tokens, never the series color
 * ========================================================================== */

const CHARTS = {};
let CHART_SEQ = 0;

function niceTicks(min, max, count) {
  const span = max - min || Math.abs(max) || 1;
  const step0 = span / count;
  const mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const norm = step0 / mag;
  const step = (norm >= 5 ? 10 : norm >= 2 ? 5 : norm >= 1 ? 2 : 1) * mag;
  const out = [];
  for (let v = Math.ceil(min / step) * step; v <= max + 1e-9; v += step) out.push(+v.toFixed(10));
  return out;
}

/* cfg: { series:[{name,color,data:[n]}], xLabels:[], height, yFmt, area, markers } */
function lineChart(cfg) {
  const id = 'ch' + (++CHART_SEQ);
  /* The viewBox is narrower on small screens so that axis text, which scales
     with the box, stays legible on a phone instead of shrinking to 5px. */
  const small = typeof window !== 'undefined' && window.innerWidth < 760;
  const W = small ? 430 : 820;
  const FS = small ? 13 : 12;
  const H = (cfg.height || 230) * (small ? 0.92 : 1);
  const pad = { l: cfg.yFmt === 'none' ? 10 : (small ? 46 : 56), r: small ? 10 : 16, t: 14, b: small ? 24 : 26 };
  const n = Math.max(...cfg.series.map(s => s.data.length));
  const all = cfg.series.flatMap(s => s.data).filter(v => isFinite(v));
  let min = Math.min(...all), max = Math.max(...all);
  if (min === max) { min -= 1; max += 1; }
  const span = max - min;
  min -= span * 0.10; max += span * 0.10;
  if (cfg.zeroBase) min = Math.min(0, min);

  const X = i => pad.l + (n <= 1 ? 0 : (i / (n - 1)) * (W - pad.l - pad.r));
  const Y = v => pad.t + (1 - (v - min) / (max - min)) * (H - pad.t - pad.b);
  const fmt = cfg.fmt || (v => fmtNum(v, 2));

  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(cfg.aria || 'Time series chart')}" data-chart="${id}">`;

  // gridlines + y axis labels. A nearly flat series would otherwise print the
  // same rounded number three times, which reads as a rendering fault.
  const ticks = niceTicks(min, max, 4);
  const seenLabels = new Set();
  ticks.forEach(t => {
    svg += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>`;
    const lab = fmt(t);
    if (cfg.yFmt !== 'none' && !seenLabels.has(lab)) {
      seenLabels.add(lab);
      svg += `<text x="${pad.l - 8}" y="${(Y(t) + 4).toFixed(1)}" text-anchor="end" font-size="${FS}" fill="var(--ink-3)" font-family="var(--sans)">${lab}</text>`;
    }
  });

  // optional reference line (e.g. starting value)
  if (cfg.refLine != null && cfg.refLine >= min && cfg.refLine <= max) {
    svg += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${Y(cfg.refLine).toFixed(1)}" y2="${Y(cfg.refLine).toFixed(1)}" stroke="var(--axis)" stroke-width="1"/>`;
  }

  // event markers sit on the baseline so they never collide with the lines
  (cfg.markers || []).forEach(m => {
    const x = X(m.i);
    svg += `<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${pad.t}" y2="${H - pad.b}" stroke="var(--axis)" stroke-width="1" opacity=".55"/>`;
    svg += `<circle cx="${x.toFixed(1)}" cy="${H - pad.b}" r="3.5" fill="var(--${m.tier === 'market' ? 's7' : m.tier === 'major' ? 'serious' : 'warning'})"/>`;
  });

  cfg.series.forEach((s, si2) => {
    const pts = s.data.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
    /* an area wash only reads on a single series; under two lines it is noise */
    if (cfg.area && si2 === 0 && cfg.series.length === 1) {
      svg += `<polygon points="${X(0).toFixed(1)},${Y(min).toFixed(1)} ${pts} ${X(s.data.length - 1).toFixed(1)},${Y(min).toFixed(1)}" fill="${s.color}" opacity="0.10"/>`;
    }
    svg += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"${s.dash ? ' stroke-dasharray="5 4"' : ''}/>`;
    // end marker with a surface ring so it stays legible where lines cross
    const li = s.data.length - 1;
    svg += `<circle cx="${X(li).toFixed(1)}" cy="${Y(s.data[li]).toFixed(1)}" r="4.5" fill="${s.color}" stroke="var(--surface-1)" stroke-width="2"/>`;
  });

  // x labels: first, middle, last only — enough to orient, never a wall of text
  if (cfg.xLabels && cfg.xLabels.length) {
    const slots = n < 4 ? [0, n - 1] : [0, Math.floor((n - 1) / 2), n - 1];
    [...new Set(slots)].forEach((i, k, arr) => {
      const anchor = k === 0 ? 'start' : k === arr.length - 1 ? 'end' : 'middle';
      svg += `<text x="${X(i).toFixed(1)}" y="${H - 7}" text-anchor="${anchor}" font-size="${FS}" fill="var(--ink-3)" font-family="var(--sans)">${esc(cfg.xLabels[i] || '')}</text>`;
    });
  }

  svg += `<line class="crosshair" x1="0" x2="0" y1="${pad.t}" y2="${H - pad.b}" stroke="var(--ink-3)" stroke-width="1" opacity="0"/>`;
  cfg.series.forEach(s => {
    svg += `<circle class="hoverdot" cx="0" cy="0" r="4.5" fill="${s.color}" stroke="var(--surface-1)" stroke-width="2" opacity="0"/>`;
  });
  svg += `<rect x="${pad.l}" y="${pad.t}" width="${W - pad.l - pad.r}" height="${H - pad.t - pad.b}" fill="transparent" class="hit"/>`;
  svg += `</svg>`;

  CHARTS[id] = { cfg, X, Y, pad, W, H, n, fmt };

  const legend = cfg.series.length > 1
    ? `<div class="legend" style="margin-top:10px">${cfg.series.map(s => `<span class="li"><span class="key" style="background:${s.color}${s.dash ? ';opacity:.7' : ''}"></span>${esc(s.name)}</span>`).join('')}</div>`
    : '';
  return `<div class="chart-box">${svg}</div>${legend}`;
}

/* Small inline trend line for tables and tiles. No axes, no hover — it is a
   shape, not a readable chart, and the number beside it carries the value. */
function sparkline(data, color, w, h) {
  w = w || 92; h = h || 26;
  if (!data || data.length < 2) return '';
  /* colour by the change actually plotted — colouring a falling 30-session line
     green because today ticked up is a small lie the eye believes */
  if (color === 'auto') color = data[data.length - 1] >= data[0] ? 'var(--up)' : 'var(--down)';
  const min = Math.min(...data), max = Math.max(...data), span = (max - min) || 1;
  const pts = data.map((v, i) => `${(i / (data.length - 1) * (w - 2) + 1).toFixed(1)},${(h - 2 - ((v - min) / span) * (h - 4)).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true" style="display:block">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

/* Ranked horizontal bars: the right form for comparing magnitudes, and it
   labels every row directly, which a pie or donut cannot do. */
function allocBars(rows, total) {
  if (!rows.length) return '<div class="empty">Nothing allocated yet.</div>';
  const max = Math.max(...rows.map(r => r.v));
  return `<div class="allocbar">` + rows.map(r => `
    <div class="allocrow">
      <span class="lbl" ${r.other ? `title="${esc(r.members.join(', '))}"` : ''}><span class="swatch" style="background:${allocColor(r)}"></span>${esc(r.k)}</span>
      <span class="track"><span class="fill" style="width:${(r.v / max * 100).toFixed(1)}%;background:${allocColor(r)}"></span></span>
      <span class="num right small">${(r.v / total * 100).toFixed(1)}%</span>
    </div>`).join('') + `</div>`;
}

/* Stacked composition bar with a 2px surface gap between segments. */
const allocColor = r => r.cash ? 'var(--ink-3)' : r.other ? 'var(--axis)' : (SECTOR_COLOR[r.k] || 'var(--s1)');

function compBar(rows, total) {
  return `<div class="compbar">` + rows.map(r =>
    `<span style="width:${(r.v / total * 100).toFixed(2)}%;background:${allocColor(r)}" title="${esc(r.k)}"></span>`
  ).join('') + `</div>`;
}

/* --- hover layer ----------------------------------------------------------- */
function bindCharts(root) {
  root.querySelectorAll('svg[data-chart]').forEach(svg => {
    const rec = CHARTS[svg.dataset.chart];
    if (!rec) return;
    const tip = document.getElementById('chart-tip');
    const cross = svg.querySelector('.crosshair');
    const dots = [...svg.querySelectorAll('.hoverdot')];

    const move = e => {
      const r = svg.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width * rec.W;
      let i = rec.kind === 'candle'
        ? rec.invX(px)
        : Math.round((px - rec.pad.l) / ((rec.W - rec.pad.l - rec.pad.r) || 1) * (rec.n - 1));
      i = clamp(i, 0, rec.n - 1);
      const x = rec.X(i);

      if (rec.kind === 'candle') {
        cross.setAttribute('x1', x); cross.setAttribute('x2', x); cross.setAttribute('opacity', '.55');
        const b = rec.bars[i], prev = rec.bars[i - 1];
        const ch = prev ? b.c / prev.c - 1 : 0;
        const pat = (rec.cfg.markers || []).find(m => m.i === i);
        tip.hidden = false;
        tip.innerHTML = `<div class="tip-h">${esc((rec.cfg.labels && rec.cfg.labels[i]) || '')}</div>`
          + `<div class="tip-r"><span class="sec">Open</span><span>${fmtMoney(b.o)}</span></div>`
          + `<div class="tip-r"><span class="sec">High</span><span>${fmtMoney(b.h)}</span></div>`
          + `<div class="tip-r"><span class="sec">Low</span><span>${fmtMoney(b.l)}</span></div>`
          + `<div class="tip-r"><span class="sec">Close</span><span class="${signClass(b.c - b.o)}">${fmtMoney(b.c)}</span></div>`
          + `<div class="tip-r"><span class="sec">Volume</span><span>${fmtNum(Math.round(b.v / 1000))}K</span></div>`
          + (prev ? `<div class="tip-r"><span class="sec">Change</span><span class="${signClass(ch)}">${arrow(ch)} ${fmtPct(ch)}</span></div>` : '')
          + `<div class="xsmall mut" style="margin-top:6px;line-height:1.4">${esc(describeCandle(b, prev))}</div>`
          + (pat ? `<div class="xsmall" style="margin-top:6px;color:var(--s7)">Pattern here: ${esc(pat.name)} (${esc(pat.bias)}) — context decides what it is worth.</div>` : '');
        const tw2 = tip.offsetWidth, th2 = tip.offsetHeight;
        tip.style.left = Math.min(window.innerWidth - tw2 - 10, e.clientX + 14) + 'px';
        tip.style.top = clamp(e.clientY - th2 - 12, 8, window.innerHeight - th2 - 8) + 'px';
        return;
      }

      cross.setAttribute('x1', x); cross.setAttribute('x2', x); cross.setAttribute('opacity', '.55');
      rec.cfg.series.forEach((s, k) => {
        const v = s.data[i];
        if (v == null || !dots[k]) return;
        dots[k].setAttribute('cx', x); dots[k].setAttribute('cy', rec.Y(v)); dots[k].setAttribute('opacity', '1');
      });
      tip.hidden = false;
      tip.innerHTML = `<div class="tip-h">${esc((rec.cfg.xLabels && rec.cfg.xLabels[i]) || '')}</div>`
        + rec.cfg.series.map(s => `<div class="tip-r"><span class="sec"><span class="swatch" style="display:inline-block;background:${s.color};margin-right:6px"></span>${esc(s.name)}</span><span>${rec.fmt(s.data[i])}</span></div>`).join('')
        + (rec.cfg.tipExtra ? rec.cfg.tipExtra(i) : '');
      const tw = tip.offsetWidth, th = tip.offsetHeight;
      tip.style.left = Math.min(window.innerWidth - tw - 10, e.clientX + 14) + 'px';
      tip.style.top = Math.max(8, e.clientY - th - 12) + 'px';
    };
    const leave = () => {
      tip.hidden = true;
      cross.setAttribute('opacity', '0');
      dots.forEach(d => d.setAttribute('opacity', '0'));
    };
    svg.addEventListener('mousemove', move);
    svg.addEventListener('mouseleave', leave);
    svg.addEventListener('touchmove', e => { if (e.touches[0]) move(e.touches[0]); }, { passive: true });
    svg.addEventListener('touchend', leave);
  });
}

/* ============================================================================
 * 14b. CANDLESTICK CHART
 * ----------------------------------------------------------------------------
 * One SVG containing up to three stacked panels — price, volume and an
 * oscillator — sharing a single x-axis and a single crosshair, so hovering
 * reads all three at once. Colour follows the convention (up / down), and the
 * direction is also encoded geometrically by where the close sits relative to
 * the open, so the information is never carried by hue alone.
 * ========================================================================== */
function candleChart(cfg) {
  const id = 'ch' + (++CHART_SEQ);
  const small = typeof window !== 'undefined' && window.innerWidth < 760;
  const W = small ? 430 : 860;
  const FS = small ? 12 : 12;
  const bars = cfg.bars.filter(b => b && b.c);
  const n = bars.length;
  if (!n) return '<div class="empty">No price data for this range.</div>';

  const ind = cfg.indicators || {};
  const showVol = !!cfg.volume;
  const osc = ind.rsi ? 'rsi' : ind.macd ? 'macd' : null;
  const PH = (cfg.height || 300) * (small ? 0.9 : 1);
  const VH = showVol ? PH * 0.26 : 0;
  const OH = osc ? PH * 0.34 : 0;
  const pad = { l: small ? 44 : 58, r: small ? 8 : 14, t: 12, b: 24 };
  const gap = 10;
  const H = pad.t + PH + (showVol ? gap + VH : 0) + (osc ? gap + OH : 0) + pad.b;

  const closes = bars.map(b => b.c);
  const sma20 = ind.sma20 ? sma(closes, 20) : null;
  const sma50 = ind.sma50 ? sma(closes, 50) : null;
  const bb = ind.bb ? bollinger(closes, 20, 2) : null;
  const rsiV = ind.rsi ? rsi(closes, 14) : null;
  const macdV = ind.macd ? macd(closes) : null;

  let lo = Math.min(...bars.map(b => b.l)), hi = Math.max(...bars.map(b => b.h));
  if (bb) { bb.lo.forEach(v => { if (v != null) lo = Math.min(lo, v); }); bb.up.forEach(v => { if (v != null) hi = Math.max(hi, v); }); }
  (cfg.levels || []).forEach(l => { lo = Math.min(lo, l.p); hi = Math.max(hi, l.p); });
  ((cfg.drawings || {}).levels || []).forEach(p => { lo = Math.min(lo, p); hi = Math.max(hi, p); });
  const spanP = (hi - lo) || 1;
  lo -= spanP * 0.06; hi += spanP * 0.06;

  const plotW = W - pad.l - pad.r;
  const step = plotW / n;
  const cw = Math.max(1.5, Math.min(14, step * 0.62));
  const X = i => pad.l + step * (i + 0.5);
  const Y = v => pad.t + (1 - (v - lo) / (hi - lo)) * PH;
  const volTop = pad.t + PH + gap, maxV = Math.max(...bars.map(b => b.v || 0)) || 1;
  const VY = v => volTop + VH - (v / maxV) * VH;
  const oscTop = pad.t + PH + (showVol ? gap + VH : 0) + gap;

  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(cfg.aria || 'Candlestick chart')}" data-chart="${id}" data-kind="candle" style="touch-action:pan-y">`;

  // price gridlines
  niceTicks(lo, hi, 4).forEach(t => {
    svg += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>`
        +  `<text x="${pad.l - 7}" y="${(Y(t) + 4).toFixed(1)}" text-anchor="end" font-size="${FS}" fill="var(--ink-3)" font-family="var(--sans)">${fmtMoney(t, t > 200 ? 0 : 2)}</text>`;
  });

  // Bollinger band fill first, so it sits behind the candles
  if (bb) {
    const upPts = [], loPts = [];
    bars.forEach((_, i) => { if (bb.up[i] != null) { upPts.push(`${X(i).toFixed(1)},${Y(bb.up[i]).toFixed(1)}`); loPts.unshift(`${X(i).toFixed(1)},${Y(bb.lo[i]).toFixed(1)}`); } });
    if (upPts.length) svg += `<polygon points="${upPts.concat(loPts).join(' ')}" fill="var(--s1)" opacity="0.10"/>`;
  }

  // support / resistance and user drawings
  (cfg.levels || []).forEach(l => {
    svg += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${Y(l.p).toFixed(1)}" y2="${Y(l.p).toFixed(1)}" stroke="${l.kind === 'sup' ? 'var(--s3)' : 'var(--s2)'}" stroke-width="1" opacity=".75"/>`
        + `<text x="${W - pad.r - 2}" y="${(Y(l.p) - 4).toFixed(1)}" text-anchor="end" font-size="${FS - 1}" fill="var(--ink-3)" font-family="var(--sans)">${l.kind === 'sup' ? 'support' : 'resistance'} · ${l.hits}x</text>`;
  });
  ((cfg.drawings || {}).levels || []).forEach((p, k) => {
    svg += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${Y(p).toFixed(1)}" y2="${Y(p).toFixed(1)}" stroke="var(--s7)" stroke-width="1.5" stroke-dasharray="6 4"/>`
        + `<text x="${pad.l + 3}" y="${(Y(p) - 4).toFixed(1)}" font-size="${FS - 1}" fill="var(--s7)" font-family="var(--sans)">${fmtMoney(p)}</text>`;
  });
  ((cfg.drawings || {}).trends || []).forEach(tl => {
    if (tl.i1 == null || tl.i2 == null) return;
    svg += `<line x1="${X(tl.i1).toFixed(1)}" y1="${Y(tl.p1).toFixed(1)}" x2="${X(tl.i2).toFixed(1)}" y2="${Y(tl.p2).toFixed(1)}" stroke="var(--s7)" stroke-width="2" stroke-linecap="round"/>`;
  });

  // candles
  bars.forEach((b, i) => {
    const up = b.c >= b.o;
    const col = up ? 'var(--up)' : 'var(--down)';
    const x = X(i);
    const yO = Y(b.o), yC = Y(b.c);
    const top = Math.min(yO, yC), h = Math.max(1, Math.abs(yC - yO));
    svg += `<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${Y(b.h).toFixed(1)}" y2="${Y(b.l).toFixed(1)}" stroke="${col}" stroke-width="1"/>`
        +  `<rect x="${(x - cw / 2).toFixed(1)}" y="${top.toFixed(1)}" width="${cw.toFixed(1)}" height="${h.toFixed(1)}" fill="${up ? col : col}" opacity="${up ? 1 : 1}" rx="${cw > 5 ? 1 : 0}"/>`;
  });

  // moving averages on top of the candles
  const line = (arr, color) => {
    const pts = [];
    arr.forEach((v, i) => { if (v != null) pts.push(`${X(i).toFixed(1)},${Y(v).toFixed(1)}`); });
    return pts.length > 1 ? `<polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>` : '';
  };
  if (sma20) svg += line(sma20, 'var(--s4)');
  if (sma50) svg += line(sma50, 'var(--s7)');
  if (bb) { svg += line(bb.up, 'var(--s1)').replace('stroke-width="2"', 'stroke-width="1"'); svg += line(bb.lo, 'var(--s1)').replace('stroke-width="2"', 'stroke-width="1"'); }

  // detected pattern markers, placed clear of the candle they belong to
  (cfg.markers || []).forEach(m => {
    const b = bars[m.i]; if (!b) return;
    const bullish = m.bias === 'bullish';
    const y = bullish ? Y(b.l) + 12 : Y(b.h) - 12;
    const col = bullish ? 'var(--up)' : m.bias === 'bearish' ? 'var(--down)' : 'var(--ink-3)';
    svg += `<circle cx="${X(m.i).toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${col}" stroke="var(--surface-1)" stroke-width="2"/>`;
  });

  // quiz highlight band
  if (cfg.highlight) {
    const [a, b2] = cfg.highlight;
    svg += `<rect x="${(X(a) - step * 0.6).toFixed(1)}" y="${pad.t}" width="${(step * (b2 - a + 1.2)).toFixed(1)}" height="${PH}" fill="var(--accent)" opacity="0.10" rx="4"/>`;
  }

  // volume panel
  if (showVol) {
    const avg = sma(bars.map(b => b.v), 20);
    svg += `<text x="${pad.l - 7}" y="${(volTop + 10).toFixed(1)}" text-anchor="end" font-size="${FS - 1}" fill="var(--ink-3)" font-family="var(--sans)">vol</text>`;
    bars.forEach((b, i) => {
      const up = b.c >= b.o;
      svg += `<rect x="${(X(i) - cw / 2).toFixed(1)}" y="${VY(b.v).toFixed(1)}" width="${cw.toFixed(1)}" height="${Math.max(1, volTop + VH - VY(b.v)).toFixed(1)}" fill="${up ? 'var(--up)' : 'var(--down)'}" opacity=".55"/>`;
    });
    const avgPts = [];
    avg.forEach((v, i) => { if (v != null) avgPts.push(`${X(i).toFixed(1)},${VY(v).toFixed(1)}`); });
    if (avgPts.length > 1) svg += `<polyline points="${avgPts.join(' ')}" fill="none" stroke="var(--ink-3)" stroke-width="1" opacity=".85"/>`;
  }

  // oscillator panel
  if (osc === 'rsi') {
    const RY = v => oscTop + OH - (clamp(v, 0, 100) / 100) * OH;
    [30, 50, 70].forEach(lv => {
      svg += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${RY(lv).toFixed(1)}" y2="${RY(lv).toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>`
          +  `<text x="${pad.l - 7}" y="${(RY(lv) + 4).toFixed(1)}" text-anchor="end" font-size="${FS - 1}" fill="var(--ink-3)" font-family="var(--sans)">${lv}</text>`;
    });
    const pts = [];
    rsiV.forEach((v, i) => { if (v != null) pts.push(`${X(i).toFixed(1)},${RY(v).toFixed(1)}`); });
    svg += `<polyline points="${pts.join(' ')}" fill="none" stroke="var(--s5)" stroke-width="2" stroke-linejoin="round"/>`;
  } else if (osc === 'macd') {
    const all = macdV.line.concat(macdV.signal, macdV.hist).filter(v => v != null);
    const mmax = Math.max(0.0001, Math.max(...all.map(Math.abs)));
    const MY = v => oscTop + OH / 2 - (v / mmax) * (OH / 2) * 0.9;
    svg += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${MY(0).toFixed(1)}" y2="${MY(0).toFixed(1)}" stroke="var(--axis)" stroke-width="1"/>`;
    macdV.hist.forEach((v, i) => {
      if (v == null) return;
      const y0 = MY(0), y1 = MY(v);
      svg += `<rect x="${(X(i) - cw / 2).toFixed(1)}" y="${Math.min(y0, y1).toFixed(1)}" width="${cw.toFixed(1)}" height="${Math.max(1, Math.abs(y1 - y0)).toFixed(1)}" fill="${v >= 0 ? 'var(--up)' : 'var(--down)'}" opacity=".5"/>`;
    });
    const ml = [], sl = [];
    macdV.line.forEach((v, i) => { if (v != null) ml.push(`${X(i).toFixed(1)},${MY(v).toFixed(1)}`); });
    macdV.signal.forEach((v, i) => { if (v != null) sl.push(`${X(i).toFixed(1)},${MY(v).toFixed(1)}`); });
    svg += `<polyline points="${ml.join(' ')}" fill="none" stroke="var(--s1)" stroke-width="2"/><polyline points="${sl.join(' ')}" fill="none" stroke="var(--s2)" stroke-width="1.5"/>`;
    svg += `<text x="${pad.l - 7}" y="${(oscTop + 10).toFixed(1)}" text-anchor="end" font-size="${FS - 1}" fill="var(--ink-3)" font-family="var(--sans)">MACD</text>`;
  }

  // x labels
  if (cfg.labels && cfg.labels.length) {
    [0, Math.floor((n - 1) / 2), n - 1].forEach((i, k) => {
      const anchor = k === 0 ? 'start' : k === 2 ? 'end' : 'middle';
      svg += `<text x="${X(i).toFixed(1)}" y="${H - 7}" text-anchor="${anchor}" font-size="${FS}" fill="var(--ink-3)" font-family="var(--sans)">${esc(cfg.labels[i] || '')}</text>`;
    });
  }

  svg += `<line class="crosshair" x1="0" x2="0" y1="${pad.t}" y2="${H - pad.b}" stroke="var(--ink-3)" stroke-width="1" opacity="0"/>`;
  svg += `<rect x="${pad.l}" y="${pad.t}" width="${plotW}" height="${H - pad.t - pad.b}" fill="transparent" class="hit"/></svg>`;

  CHARTS[id] = {
    kind: 'candle', bars, cfg, X, Y, pad, W, H, n, step,
    invY: y => lo + (1 - (y - pad.t) / PH) * (hi - lo),
    invX: x => clamp(Math.round((x - pad.l) / step - 0.5), 0, n - 1),
    priceTop: pad.t, priceH: PH, ind
  };

  const keys = [];
  if (sma20) keys.push(['var(--s4)', '20-session average']);
  if (sma50) keys.push(['var(--s7)', '50-session average']);
  if (bb) keys.push(['var(--s1)', 'Bollinger Bands']);
  if (osc === 'rsi') keys.push(['var(--s5)', 'RSI (14)']);
  if (osc === 'macd') keys.push(['var(--s1)', 'MACD'], ['var(--s2)', 'Signal line']);
  const legend = keys.length ? `<div class="legend" style="margin-top:8px">${keys.map(k => `<span class="li"><span class="key" style="background:${k[0]}"></span>${k[1]}</span>`).join('')}</div>` : '';
  return `<div class="chart-box">${svg}</div>${legend}`;
}

/* Normalised comparison of several instruments, all rebased to 100 so the
   question is "which grew faster", not "which has a bigger share price". */
function compareChart(tickers, n, height) {
  const series = tickers.slice(0, 4).map((t, k) => {
    const d = closes(t, n);
    const base = d[0] || 1;
    return { name: t, color: `var(--s${k + 1})`, data: d.map(v => v / base * 100) };
  });
  return lineChart({ series, xLabels: xLabelsFor(n), height: height || 260, refLine: 100,
    fmt: v => v.toFixed(0), aria: 'Comparison of instruments rebased to 100' });
}

/* --- shared building blocks ------------------------------------------------ */
const barsOf = (t, n) => {
  const s = state.prices[t], end = si(state.day);
  return s.slice(Math.max(0, end - n + 1), end + 1);
};
const closes = (t, n) => {
  const s = state.prices[t], end = si(state.day);
  return s.slice(Math.max(0, end - n + 1), end + 1).map(b => b.c);
};
/* Map a series index to a date label. Indices below BACKFILL belong to the
   simulated history that precedes session 1. */
const labelForIndex = i => {
  const d = i - BACKFILL + 1;
  if (d >= 1) return dateLabel(d);
  return (state.preCal && state.preCal[i]) || 'before the run';
};
const xLabelsFor = n => {
  const end = si(state.day), out = [];
  for (let i = end - n + 1; i <= end; i++) out.push(labelForIndex(Math.max(0, i)));
  return out;
};

function statTile(k, v, d, hero) {
  return `<div class="card stat">
    <span class="k">${esc(k)}</span>
    <span class="v${hero ? ' hero' : ''} num">${v}</span>
    ${d ? `<span class="d">${d}</span>` : ''}
  </div>`;
}
function deltaSpan(pct, abs) {
  const cls = signClass(pct);
  return `<span class="delta ${cls}"><span class="arrow">${arrow(pct)}</span>${fmtPct(pct)}${abs != null ? ' · ' + fmtMoney(abs) : ''}</span>`;
}
function tickerCell(co, extra) {

  </span>`;
}
function newsItemHtml(n) {
  const tickers = (n.targets || []).slice(0, 4).map(t => {
    const r = n.reactions[t];
    return `<span class="tkr ${r > 0.002 ? 'up' : r < -0.002 ? 'down' : ''}">${t}${r ? ' ' + fmtPct(r, 1) : ''}</span>`;
  }).join('');
  return `<button class="news-item" data-act="open-news" data-id="${n.id}">

        ${movers.every(m => Math.abs(m.ch) < 0.0001) ? `<div class="empty small">No session has been traded yet. Advance the market and the biggest movers appear here, each with the reason it moved.</div>` : ''}

          const drivers = (barAt(m.co.t, state.day).drivers || []);
          /* prefer a named cause over "ordinary buying and selling" — if a story
             is in the mix at all, that is the thing worth surfacing */
          const named = drivers.find(d => d.ev) || drivers.find(d => d.l.indexOf('Ordinary buying') !== 0);
          const top = named || drivers[0];
          return `<button class="news-item" style="border:0;padding:9px 0" data-act="open-stock" data-t="${m.co.t}">
            <span class="news-body">
              <span class="spread"><span class="strong">${m.co.t}</span>
              <span class="${signClass(m.ch)} num">${arrow(m.ch)} ${fmtPct(m.ch)}</span></span>
              <span class="xsmall mut" style="display:block;margin-top:2px">${esc(top ? top.l : 'No material move')}</span>

        <div class="news-list">${state.news.slice(0, 4).map(newsItemHtml).join('')}</div>
      </div>
    </div>
  </div>
  ${disclaimer()}`;
};

function avgHold() {
  const buys = state.tx.filter(x => x.side === 'BUY');
  if (!buys.length) return 0;
  const total = buys.reduce((a, b) => a + (state.day - b.day), 0);
  return Math.round(total / buys.length);
}

  const q = (app.marketQuery || '').trim().toLowerCase();
  const list = COMPANIES
    .filter(co => app.assetFilter === 'All' || ASSET_CLASS(co) === app.assetFilter)
    .filter(co => app.marketFilter === 'All' || co.sector === app.marketFilter)
    .filter(co => !q || co.t.toLowerCase().includes(q) || co.name.toLowerCase().includes(q) || co.industry.toLowerCase().includes(q))
    .map(co => {
      const f = fundOf(co.t), px = priceOf(co.t);
      return { co, px, ch: dayChangeOf(co.t), cap: px * co.shares * 1e9, pe: f.eps > 0 ? px / f.eps : null, f };

    cap: (a, b) => b.cap - a.cap, gain: (a, b) => b.ch - a.ch, loss: (a, b) => a.ch - b.ch,

  return `

/* --- Research card ---------------------------------------------------------
 * Everything needed to form a view: what the company does, what it earns, what
 * is already assumed in the price, what could go wrong, and — uniquely to a
 * simulation — the exact breakdown of what moved the price today.
 */

  const t = app.params.t, co = BY_TICKER[t];

  const f = fundOf(t), px = priceOf(t), ch = dayChangeOf(t);

  const pe = f.eps > 0 ? px / f.eps : null;
  const margin = f.revenue ? f.netIncome / f.revenue : 0;

  const held = sharesHeld(t), pos = state.positions[t];
  const n = app.range === 'all' ? si(state.day) + 1 : app.range;

  const bars = barsOf(t, n);

    .filter((m, i, arr) => arr.findIndex(x => x.i === m.i) === i);

  const drivers = (bar.drivers || []).filter(d => Math.abs(d.p) > 0.0002);

  const earnDays = state.schedule.earnings[t] || [];
  const nextEarn = earnDays.find(d => d >= state.day);

  const halted = isHalted(t);

  return `
