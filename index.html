  <div class="card pad-0">
    <div class="card-head" style="padding:16px 16px 0"><div class="card-title">All companies</div></div>
    ${marketTable(list)}
  </div>
  ${disclaimer()}`;
};

function marketTable(rows) {
  return `<div class="table-wrap"><table class="tbl">
    <thead><tr><th>Company</th><th>Sector</th><th class="num">Price</th><th class="num">Today</th>
    <th class="num hide-sm">30 sessions</th><th class="num hide-sm">Market cap</th><th class="num hide-sm">P/E</th><th class="num">Held</th><th></th></tr></thead>
    <tbody>${rows.map(r => {
      const held = sharesHeld(r.co.t);
      const watched = state.watch.includes(r.co.t);
      return `<tr class="clickable" data-act="open-stock" data-t="${r.co.t}">
        <td>${tickerCell(r.co)}</td>
        <td class="small sec">${esc(r.co.sector)}</td>
        <td class="num">${fmtMoney(r.px)}</td>
        <td class="num ${signClass(r.ch)}">${arrow(r.ch)} ${fmtPct(r.ch)}</td>
        <td class="num hide-sm">${sparkline(closes(r.co.t, 30), r.ch >= 0 ? 'var(--up)' : 'var(--down)')}</td>
        <td class="num hide-sm">${fmtCompact(r.cap)}</td>
        <td class="num hide-sm">${r.pe ? r.pe.toFixed(1) : '<span class="mut" title="This company is not profitable, so a price-to-earnings ratio cannot be calculated.">n/a</span>'}</td>
        <td class="num">${held ? fmtNum(held) : '<span class="mut">—</span>'}</td>
        <td class="num nowrap">
          <button class="btn btn-sm btn-ghost" data-act="watch" data-t="${r.co.t}" title="${watched ? 'Remove from watchlist' : 'Add to watchlist'}">${watched ? '★' : '☆'}</button>
          <button class="btn btn-sm" data-act="trade" data-t="${r.co.t}">Trade</button>
        </td>
      </tr>`;
    }).join('')}</tbody></table></div>`;
}

/* --- Research card ---------------------------------------------------------
 * Everything needed to form a view: what the company does, what it earns, what
 * is already assumed in the price, what could go wrong, and — uniquely to a
 * simulation — the exact breakdown of what moved the price today.
 */
V.research = () => {
  const t = app.params.t, co = BY_TICKER[t];
  if (!co) return '<div class="empty">Company not found.</div>';
  const f = fundOf(t), px = priceOf(t), ch = dayChangeOf(t);
  const cap = px * co.shares * 1e9;
  const pe = f.eps > 0 ? px / f.eps : null;
  const margin = f.revenue ? f.netIncome / f.revenue : 0;
  const yld = f.div / px;
  const held = sharesHeld(t), pos = state.positions[t];
  const n = app.range === 'all' ? si(state.day) + 1 : app.range;
  const data = closes(t, n);
  const bar = barAt(t, state.day);
  const drivers = (bar.drivers || []).filter(d => Math.abs(d.p) > 0.0002);
  const maxD = Math.max(0.0001, ...drivers.map(d => Math.abs(d.p)));
  const hi = Math.max(...closes(t, 250)), lo = Math.min(...closes(t, 250));
  const relNews = state.news.filter(x => (x.targets || []).includes(t) || (x.spill || []).includes(t)).slice(0, 6);
  const nextEarn = (state.schedule.earnings[t] || []).find(d => d >= state.day);
  const halted = isHalted(t);

  return `
  <div class="view-head">
    <div>
      <div class="row" style="gap:12px">
        <span class="tick-mark" style="height:34px;width:4px;background:${SECTOR_COLOR[co.sector]}"></span>
        <div>
          <h1>${co.name} <span class="mut">(${co.t})</span></h1>
          <div class="sub">${esc(co.sector)} · ${esc(co.industry)}</div>
        </div>
      </div>
    </div>
    <div class="row wrap">
      <div class="right">
        <div class="num" style="font-size:1.8rem;font-weight:640;line-height:1.1">${fmtMoney(px)}</div>
        <div class="${signClass(ch)} num small">${arrow(ch)} ${fmtPct(ch)} · ${fmtMoney(px - prevCloseOf(t))} today</div>
      </div>
      <button class="btn" data-act="watch" data-t="${t}">${state.watch.includes(t) ? '★ Watching' : '☆ Watch'}</button>
      <button class="btn btn-primary" data-act="trade" data-t="${t}">Trade ${t}</button>
    </div>
  </div>

  ${halted ? `<div class="card" style="border-color:var(--warning);margin-bottom:14px">
    <div class="row"><span class="badge moderate">After the close</span>
    <span class="small">${co.name} has just reported results. The market is shut for this stock until tomorrow's open — any order you place now is queued and will fill at the opening price, which may gap away from ${fmtMoney(px)}.</span></div></div>` : ''}

  <div class="grid g-research">
    <div class="stack">
      <div class="card">
        <div class="card-head">
          <div><div class="card-title">Price history</div><div class="card-sub">Simulated closing prices</div></div>
          <div class="seg">${[[20, '20 sessions'], [60, '60 sessions'], ['all', 'All']].map(([k, l]) =>
            `<button data-act="range" data-k="${k}" aria-pressed="${String(app.range) === String(k)}">${l}</button>`).join('')}</div>
        </div>
        ${lineChart({ series: [{ name: co.t, color: SECTOR_COLOR[co.sector], data }], xLabels: xLabelsFor(data.length),
          height: 260, area: true, fmt: v => fmtMoney(v, 2), aria: co.name + ' simulated price history' })}
      </div>

      <div class="card">
        <div class="card-head"><div><div class="card-title">Why did ${t} move today?</div>
          <div class="card-sub">Every component of today's ${fmtPct(ch)} move, largest first. Nothing in this simulation moves without one of these.</div></div></div>
        ${drivers.length ? `<div class="allocbar">${drivers.map(d => `
          <div class="allocrow drow">
            <span class="lbl" style="white-space:normal">${d.ev ? `<button class="btn btn-sm btn-ghost" style="padding:0;border:0;text-align:left;white-space:normal" data-act="open-news" data-id="${d.ev}">${esc(d.l)} ↗</button>` : esc(d.l)}</span>
            <span class="track"><span class="fill" style="width:${(Math.abs(d.p) / maxD * 100).toFixed(1)}%;background:${d.p >= 0 ? 'var(--up)' : 'var(--down)'}"></span></span>
            <span class="num right small ${signClass(d.p)}">${fmtPct(d.p)}</span>
          </div>`).join('')}</div>`
        : '<div class="empty">No material movement today.</div>'}
        ${noiseNote(drivers)}
      </div>

      <div class="grid g-2">
        <div class="card">
          <div class="card-head"><div class="card-title">Bull case</div><span class="badge good">Why it could work</span></div>
          <p class="small sec">${esc(co.bull)}</p>
        </div>
        <div class="card">
          <div class="card-head"><div class="card-title">Bear case</div><span class="badge bad">Why it might not</span></div>
          <p class="small sec">${esc(co.bear)}</p>
        </div>
      </div>

      <div class="card">
        <div class="card-head"><div class="card-title">Major risks</div></div>
        <ul class="small sec" style="margin:0;padding-left:18px;line-height:1.7">
          ${co.risks.map(r => `<li>${esc(r)}</li>`).join('')}
        </ul>
        ${co.note ? `<div class="lesson" style="margin-top:12px"><div class="lesson-h">Worth noticing</div>${esc(co.note)}</div>` : ''}
      </div>

      <div class="card pad-0">
        <div class="card-head" style="padding:16px 16px 0"><div class="card-title">Recent news affecting ${t}</div></div>
        ${relNews.length ? `<div class="news-list">${relNews.map(newsItemHtml).join('')}</div>`
          : '<div class="empty">No news has affected this company yet.</div>'}
      </div>
    </div>

    <div class="stack">
      <div class="card">
        <div class="card-head"><div class="card-title">What the company does</div></div>
        <p class="small sec">${esc(co.desc)}</p>
      </div>

      <div class="card">
        <div class="card-head"><div class="card-title">Key figures</div><span class="card-sub">Simulated</span></div>
        <dl class="kv">
          <dt>Ticker</dt><dd>${co.t}</dd>
          <dt title="Share price times shares outstanding — the market value of the whole company.">Market capitalisation</dt><dd>${fmtCompact(cap)}</dd>
          <dt>Shares outstanding</dt><dd>${co.shares.toFixed(2)}B</dd>
          <dt title="Total sales over the past twelve months.">Revenue (TTM)</dt><dd>$${f.revenue.toFixed(1)}B</dd>
          <dt title="What is left after all costs — the bottom line.">Net income (TTM)</dt><dd>${f.netIncome < 0 ? '<span class="down">' : ''}$${f.netIncome.toFixed(1)}B${f.netIncome < 0 ? '</span>' : ''}</dd>
          <dt title="Profit as a share of revenue.">Net margin</dt><dd>${(margin * 100).toFixed(1)}%</dd>
          <dt>Earnings per share</dt><dd>${fmtMoney(f.eps)}</dd>
          <dt title="Price divided by earnings per share: how many years of current profit you pay for one share.">P/E ratio</dt>
          <dd>${pe ? pe.toFixed(1) : '<span class="mut">n/a — lossmaking</span>'}</dd>
          <dt>Dividend per share</dt><dd>${f.div > 0 ? fmtMoney(f.div) + '/yr' : '<span class="mut">None</span>'}</dd>
          <dt title="Annual dividend divided by the share price.">Dividend yield</dt><dd>${f.div > 0 ? (yld * 100).toFixed(2) + '%' : '<span class="mut">—</span>'}</dd>
          <dt>52-session range</dt><dd>${fmtMoney(lo)} – ${fmtMoney(hi)}</dd>
          <dt title="Typical size of this stock's daily move.">Daily volatility</dt><dd>${(co.vol * 100).toFixed(1)}%</dd>
          <dt title="How much this stock moves for a given market move.">Market beta</dt><dd>${co.mktBeta.toFixed(2)}</dd>
          <dt title="How this stock reacts when interest rates change.">Rate sensitivity</dt>
          <dd>${co.rateBeta > 0.3 ? 'Helped by rises' : co.rateBeta < -1.0 ? 'Hurt sharply by rises' : co.rateBeta < -0.3 ? 'Hurt by rises' : 'Little effect'}</dd>
          <dt>Next earnings</dt><dd>${nextEarn ? 'Session ' + nextEarn : 'Not this run'}</dd>
        </dl>
        ${f.lastSurprise != null ? `<div class="lesson" style="margin-top:12px"><div class="lesson-h">Last report</div>
          ${f.lastSurprise > 0 ? 'Beat' : f.lastSurprise < 0 ? 'Missed' : 'Met'} expectations by ${(Math.abs(f.lastSurprise) * 100).toFixed(1)}%, guidance ${f.lastGuide === 'raise' ? 'raised' : f.lastGuide === 'cut' ? 'cut' : 'unchanged'}.</div>` : ''}
      </div>

      ${held ? `<div class="card">
        <div class="card-head"><div class="card-title">Your position</div></div>
        <dl class="kv">
          <dt>Shares held</dt><dd>${fmtNum(held)}</dd>
          <dt>Average cost</dt><dd>${fmtMoney(pos.avg)}</dd>
          <dt>Market value</dt><dd>${fmtMoney(held * px)}</dd>
          <dt>Profit / loss</dt><dd class="${signClass(held * px - held * pos.avg)}">${fmtMoney(held * px - held * pos.avg)} (${fmtPct(px / pos.avg - 1)})</dd>
          <dt>Share of portfolio</dt><dd>${fmtPct(held * px / totalValue(), 1).replace('+', '')}</dd>
        </dl>
      </div>` : ''}

      <div class="card">
        <div class="card-head"><div class="card-title">Read the numbers</div></div>
        <p class="small sec">${esc(numbersHint(co, f, pe, margin))}</p>
        <div class="row wrap" style="margin-top:10px">
          ${['pe-ratio', 'market-cap', 'revenue-vs-profit', f.div > 0 ? 'dividends' : 'volatility'].map(c =>
            `<button class="chip" data-act="open-concept" data-id="${c}">${esc(CONCEPT_BY_ID[c].title)}</button>`).join('')}
        </div>
      </div>
    </div>
  </div>
  ${disclaimer()}`;
};

/* When the day's move came mostly from ordinary trading rather than news, say
   so plainly — quiet days are the normal case and pretending otherwise teaches
   people to read meaning into noise. */
function noiseNote(drivers) {
  const total = drivers.reduce((a, d) => a + Math.abs(d.p), 0);
  const noise = drivers.find(d => d.l.indexOf('Ordinary buying') === 0);
  if (!noise || !total) return '';
  const share = Math.abs(noise.p) / total;
  if (share < 0.45) return '';
  return `<div class="lesson" style="margin-top:12px"><div class="lesson-h">Most of today's move was not news</div>
    About ${fmtPct(share, 0).replace('+', '')} of today's movement came from ordinary buying and selling rather than any event. That is the normal case — most trading days contain no real information about a business. Reading a story into a quiet day's move is one of the most common mistakes investors make.</div>`;
}

/* A short, company-specific prompt that turns the numbers above into a question
   worth answering, rather than telling the player what to do. */
function numbersHint(co, f, pe, margin) {
  if (f.eps <= 0) return `${co.t} is currently lossmaking, so its P/E ratio does not exist. You cannot value it on earnings — you have to ask instead what its sales are worth, and whether the losses are an investment in something that will pay off or simply a business in decline. That distinction is the whole question here.`;
  if (pe > 40) return `At roughly ${pe.toFixed(0)} times earnings, the market is paying about ${pe.toFixed(0)} years of today's profit for one share. That price only makes sense if profits grow substantially. Ask yourself what growth rate is implied, and what would happen to the share price if that growth arrived a year late.`;
  if (pe < 12) return `At roughly ${pe.toFixed(0)} times earnings, this is priced as though profits will fall. Sometimes that is wrong and the shares are genuinely cheap; often it means the market thinks current earnings are unsustainable — which is common for cyclical businesses at the top of their cycle. Ask which one you believe.`;
  if (margin < 0.06) return `Net margin is about ${(margin * 100).toFixed(1)}% — it keeps only a few cents of each dollar of sales. That makes the business unusually sensitive to cost increases: a small rise in wages or freight takes a large share of the profit. Compare this with a software or chip company keeping ten times as much.`;
  return `At roughly ${pe.toFixed(0)} times earnings with a ${(margin * 100).toFixed(0)}% net margin, this is priced close to the market average. The interesting question is not whether the company is good — it clearly earns money — but whether it will do better than the market currently assumes. That gap, not the quality of the business, is where a return comes from.`;
}

/* --- News ------------------------------------------------------------------ */
V.news = () => {
  const filters = [['all', 'Everything'], ['market', 'Market-wide'], ['major', 'Major'], ['moderate', 'Moderate'], ['minor', 'Minor'], ['mine', 'Affects my holdings']];
  let list = state.news;
  if (app.newsFilter === 'mine') {
    const own = Object.keys(state.positions);
    list = list.filter(n => (n.targets || []).some(t => own.includes(t)) || (n.spill || []).some(t => own.includes(t)));
  } else if (app.newsFilter !== 'all') list = list.filter(n => n.tier === app.newsFilter);

  return `
  <div class="view-head"><div><h1>News feed</h1>
    <div class="sub">Every story here moved prices. Open one to see what it means and why it mattered.</div></div></div>
  <div class="row wrap" style="margin-bottom:14px">
    ${filters.map(([k, l]) => `<button class="chip" data-act="news-filter" data-k="${k}" aria-pressed="${app.newsFilter === k}">${l}</button>`).join('')}
  </div>
  <div class="card pad-0">
    ${list.length ? `<div class="news-list">${list.slice(0, 80).map(newsItemHtml).join('')}</div>` : '<div class="empty">No stories match this filter yet.</div>'}
  </div>
  ${disclaimer()}`;
};

/* --- Event timeline -------------------------------------------------------- */
V.timeline = () => {
  const big = state.news.filter(n => n.tier !== 'minor');
  const byDay = {};
  big.forEach(n => { (byDay[n.day] = byDay[n.day] || []).push(n); });
  const days = Object.keys(byDay).map(Number).sort((a, b) => b - a);

  return `
  <div class="view-head"><div><h1>Event timeline</h1>
    <div class="sub">The story of this market, session by session, with what each event did to your portfolio.</div></div></div>

  <div class="card" style="margin-bottom:14px">
    <div class="card-head"><div><div class="card-title">Market benchmark</div>
    <div class="card-sub">The cap-weighted average of every company here, indexed to 100 at the start.</div></div></div>
    ${lineChart({
      series: [{ name: 'Market', color: 'var(--s3)', data: state.index.slice(BACKFILL - 20, si(state.day) + 1) }],
      xLabels: Array.from({ length: si(state.day) - (BACKFILL - 20) + 1 }, (_, k) => labelForIndex(BACKFILL - 20 + k)),
      height: 190, area: true, refLine: 100, fmt: v => v.toFixed(1), aria: 'Market benchmark index'
    })}
  </div>

  <div class="card">
    ${days.length ? `<div class="timeline">${days.map(d => `
      <div class="tl-item">
        <span class="tl-dot ${byDay[d][0].tier}"></span>
        <div class="tl-day">Session ${d} · ${esc(byDay[d][0].date || '')}${(state.calendar[d - 1] && state.calendar[d - 1].closedBefore.length) ? ' · market was closed ' + esc(state.calendar[d - 1].closedBefore.join(', ')) : ''}</div>
        ${byDay[d].map(n => {
          const impact = state.eventImpact[n.id];
          return `<button class="news-item" style="border:0;padding:6px 0" data-act="open-news" data-id="${n.id}">
            <span class="news-rail ${n.tier}"></span>
            <span class="news-body"><span class="news-h">${esc(n.head)}</span>
            <span class="news-meta"><span class="badge ${n.tier}">${TIER_LABEL[n.tier]}</span>
            ${impact ? `<span class="${signClass(impact)}">${fmtMoney(impact)} effect on your holdings</span>` : '<span class="mut">no effect on your holdings</span>'}</span></span>
          </button>`;
        }).join('')}
      </div>`).join('')}</div>` : '<div class="empty">No significant events yet. Advance a few sessions.</div>'}
  </div>
  ${disclaimer()}`;
};

/* --- Analytics ------------------------------------------------------------- */
V.analytics = () => {
  const hs = holdings(), val = totalValue(), alloc = sectorAllocation();
  const weights = hs.map(h => h.value / val);
  const hhi = weights.reduce((a, w) => a + w * w, 0);
  const sectors = new Set(hs.map(h => h.co.sector));
  const topW = weights.length ? Math.max(...weights) : 0;
  const pVol = hs.reduce((a, h) => a + (h.value / val) * h.co.vol, 0);
  const pBeta = hs.reduce((a, h) => a + (h.value / val) * h.co.mktBeta, 0);
  const pRate = hs.reduce((a, h) => a + (h.value / val) * h.co.rateBeta, 0);

  // drawdown series
  let peak = 0;
  const dd = state.hist.map(h => { peak = Math.max(peak, h.value); return (h.value / peak - 1) * 100; });
  const labels = state.hist.map(h => h.day === 0 ? 'Start' : dateLabel(h.day));

  // shared-exposure check: holdings that respond to the same forces
  const tagCount = {};
  hs.forEach(h => h.co.tags.forEach(tg => { tagCount[tg] = (tagCount[tg] || 0) + h.value; }));
  const shared = Object.entries(tagCount)
    .filter(([k, v]) => RISK_TAGS[k] && v / Math.max(1, investedValue()) > 0.55)
    .sort((a, b) => b[1] - a[1]).slice(0, 3);

  const divVerdict = !hs.length ? 'You hold no companies, so there is nothing to diversify yet. Cash is a position too — it protects you from falls and earns nothing.'
    : sectors.size >= 4 && topW < 0.35 ? `Well spread: ${sectors.size} sectors with a largest position of ${fmtPct(topW, 0).replace('+', '')}. No single event should be able to damage everything you own at once.`
    : sectors.size >= 3 ? `Reasonably spread across ${sectors.size} sectors, but your largest position is ${fmtPct(topW, 0).replace('+', '')} of the portfolio. Check whether that size is deliberate.`
    : `Concentrated: ${sectors.size} sector${sectors.size === 1 ? '' : 's'}, largest position ${fmtPct(topW, 0).replace('+', '')}. Concentration magnifies results in both directions — which is fine if it is a decision rather than an accident.`;

  return `
  <div class="view-head"><div><h1>Portfolio analytics</h1>
    <div class="sub">Not how much you made — what you are actually exposed to.</div></div></div>

  <div class="grid g-4" style="margin-bottom:14px">
    ${statTile('Sectors held', String(sectors.size), '<span class="mut">out of ' + SECTORS.length + ' available</span>')}
    ${statTile('Largest position', fmtPct(topW, 1).replace('+', ''), '<span class="mut">' + (hs[0] ? hs[0].t : '—') + '</span>')}
    ${statTile('Concentration index', hhi ? hhi.toFixed(2) : '—', '<span class="mut">' + (hhi > 0.4 ? 'High — few, large bets' : hhi > 0.2 ? 'Moderate' : 'Low — well spread') + '</span>')}
    ${statTile('Deepest fall from peak', fmtPct(state.stats.maxDD, 1), '<span class="mut">market: ' + fmtPct(benchDrawdown(), 1) + '</span>')}
  </div>

  <div class="grid g-2" style="margin-bottom:14px">
    <div class="card">
      <div class="card-head"><div class="card-title">Allocation by sector</div></div>
      ${compBar(alloc, val)}<div style="height:12px"></div>${allocBars(alloc, val)}
      <div class="lesson" style="margin-top:14px"><div class="lesson-h">Diversification check</div>${esc(divVerdict)}</div>
      ${shared.length ? `<div class="why" style="margin-top:10px"><div class="why-h">Shared exposure</div>
        More than half of what you own moves with <strong>${shared.map(s => esc(RISK_TAGS[s[0]])).join('</strong>, <strong>')}</strong>. Holdings with different names can still be one bet — the question is not how many companies you own but how many distinct ways they can fail.</div>` : ''}
    </div>

    <div class="card">
      <div class="card-head"><div><div class="card-title">Drawdown</div>
      <div class="card-sub">How far below its own peak the portfolio has traded. Every strategy has these; what matters is whether you can sit through them.</div></div></div>
      ${lineChart({ series: [{ name: 'Drawdown', color: 'var(--s8)', data: dd }], xLabels: labels, height: 200,
        area: true, refLine: 0, fmt: v => v.toFixed(1) + '%', aria: 'Portfolio drawdown from peak' })}
      <div class="lesson" style="margin-top:12px"><div class="lesson-h">Risk vs. volatility</div>
        A drawdown is only a loss if you sell during it or need the money before it recovers. That is the difference between volatility — how much the price moves — and risk, which is the chance of ending up permanently poorer.</div>
    </div>
  </div>

  <div class="card pad-0" style="margin-bottom:14px">
    <div class="card-head" style="padding:16px 16px 0"><div class="card-title">Risk profile of your holdings</div>
      <span class="card-sub">Portfolio beta ${pBeta.toFixed(2)} · average daily volatility ${(pVol * 100).toFixed(2)}% · rate sensitivity ${pRate > 0.2 ? 'positive' : pRate < -0.6 ? 'strongly negative' : 'mildly negative'}</span></div>
    ${hs.length ? `<div class="table-wrap"><table class="tbl">
      <thead><tr><th>Company</th><th class="num">Weight</th><th class="num">Daily volatility</th><th class="num">Market beta</th><th>If rates rise</th><th>Economic sensitivity</th></tr></thead>
      <tbody>${hs.map(h => `<tr class="clickable" data-act="open-stock" data-t="${h.t}">
        <td>${tickerCell(h.co)}</td>
        <td class="num">${fmtPct(h.weight, 1).replace('+', '')}</td>
        <td class="num">${(h.co.vol * 100).toFixed(1)}%</td>
        <td class="num">${h.co.mktBeta.toFixed(2)}</td>
        <td class="small ${h.co.rateBeta > 0 ? 'up' : 'down'}">${h.co.rateBeta > 0.3 ? 'Benefits' : h.co.rateBeta < -1.0 ? 'Hurt sharply' : h.co.rateBeta < -0.3 ? 'Hurt' : 'Little effect'}</td>
        <td class="small sec">${h.co.cyclical > 0.7 ? 'Highly cyclical' : h.co.cyclical > 0.4 ? 'Moderately cyclical' : 'Defensive'}</td>
      </tr>`).join('')}</tbody></table></div>` : '<div class="empty">No holdings to analyse.</div>'}
  </div>

  <div class="grid g-2">
    <div class="card">
      <div class="card-head"><div class="card-title">Cash position</div></div>
      <dl class="kv">
        <dt>Cash</dt><dd>${fmtMoney(state.cash)}</dd>
        <dt>Share of portfolio</dt><dd>${fmtPct(state.cash / val, 1).replace('+', '')}</dd>
        <dt>Sessions mostly in cash</dt><dd>${state.stats.cashDays} of ${state.day}</dd>
      </dl>
      <p class="small sec" style="margin-top:10px">Cash is a position, not the absence of one. It cannot fall, it gives you the ability to act when others cannot, and it earns nothing here while inflation runs at ${state.macro.inflation.toFixed(1)}%. Holding it deliberately is strategy; holding it because you have not decided is not.</p>
    </div>
    <div class="card">
      <div class="card-head"><div class="card-title">Events that moved your portfolio most</div></div>
      ${topEventList()}
    </div>
  </div>
  ${disclaimer()}`;
};

function benchDrawdown() {
  let peak = 0, dd = 0;
  state.hist.forEach(h => { peak = Math.max(peak, h.index); dd = Math.min(dd, h.index / peak - 1); });
  return dd;
}
function topEventList() {
  const rows = Object.entries(state.eventImpact)
    .map(([id, v]) => ({ n: state.news.find(x => x.id === id), v }))
    .filter(r => r.n && Math.abs(r.v) > 1)
    .sort((a, b) => Math.abs(b.v) - Math.abs(a.v)).slice(0, 6);
  if (!rows.length) return '<div class="empty">No events have moved your holdings yet.</div>';
  return `<div class="stack" style="gap:8px">${rows.map(r => `
    <button class="news-item" style="border:0;padding:6px 0" data-act="open-news" data-id="${r.n.id}">
      <span class="news-rail ${r.n.tier}"></span>
      <span class="news-body"><span class="news-h">${esc(r.n.head)}</span>
      <span class="news-meta"><span class="${signClass(r.v)} strong">${fmtMoney(r.v)}</span><span>Session ${r.n.day}</span></span></span>
    </button>`).join('')}</div>`;
}

/* --- Learning center -------------------------------------------------------- */
V.learn = () => {
  const groups = [...new Set(CONCEPTS.map(c => c.group))];
  const seenCount = Object.keys(state.learn.concepts).length;
  const answered = Object.keys(state.learn.quiz).length;
  const correct = Object.values(state.learn.quiz).filter(q => q.correct).length;

  return `
  <div class="view-head"><div><h1>Learning center</h1>
    <div class="sub">The ideas this simulation is built on. Concepts you have met in play are marked.</div></div></div>

    ${statTile('Concepts encountered', `${seenCount} / ${CONCEPTS.length}`, '<span class="mut">Met through your own trades and the news</span>')}
    ${statTile('Questions answered', `${answered} / ${QUIZ.length}`, `<span class="mut">${correct} correct</span>`)}
    ${statTile('Event explanations read', String(state.learn.eventReads), '<span class="mut">"Why does this matter?" openings</span>')}
  </div>

  <div class="card" style="margin-bottom:14px">
    <div class="card-head"><div><div class="card-title">Challenge questions</div>
      <div class="card-sub">Short scenarios with a best answer and an explanation for every option.</div></div></div>

        return `<button class="concept ${r ? 'seen' : ''}" data-act="open-quiz" data-id="${q.id}" style="text-align:left">
          <span class="ct">${esc(q.q.length > 96 ? q.q.slice(0, 96) + '…' : q.q)}</span>
          <span class="cs">${r ? (r.correct ? '<span class="up">✓ Answered correctly</span>' : '<span class="down">✗ Answered — worth revisiting</span>') : 'Not attempted'} · ${esc(CONCEPT_BY_ID[q.concept].title)}</span>
        </button>`;
      }).join('')}

  ${groups.map(g => `
    <div class="card" style="margin-bottom:14px">

      <div class="grid g-3">
        ${CONCEPTS.filter(c => c.group === g).map(c => `
          <button class="concept ${state.learn.concepts[c.id] ? 'seen' : ''}" data-act="open-concept" data-id="${c.id}">
            <span class="ct">${esc(c.title)}</span>
            <span class="cs">${esc(c.short)}</span>
            ${state.learn.concepts[c.id] ? `<span class="xsmall up">Encountered in play — session ${state.learn.concepts[c.id].firstDay}</span>` : '<span class="xsmall mut">Not met yet</span>'}
          </button>`).join('')}
      </div>
    </div>`).join('')}
  ${disclaimer()}`;
};

/* --- Prompts shown on the dashboard ----------------------------------------- */
function challengeCard() {
  const met = Object.keys(state.learn.concepts);
  const q = QUIZ.find(x => !state.learn.quiz[x.id] && met.includes(x.concept))
         || QUIZ.find(x => !state.learn.quiz[x.id]);
  if (!q) return `<div class="card"><div class="card-head"><div class="card-title">Learning</div></div>
    <p class="small sec">You have answered every challenge question. The Learning center still holds all ${CONCEPTS.length} concepts for reference.</p>
    <button class="btn btn-sm" data-act="nav" data-route="learn">Open learning center</button></div>`;
  return `<div class="card" style="border-color:color-mix(in srgb, var(--s7) 35%, transparent)">

    <p class="small sec">${esc(q.q)}</p>
    <button class="btn btn-sm btn-primary" data-act="open-quiz" data-id="${q.id}">Answer it</button>

}

function scenarioCard() {
  const sc = SCENARIOS.find(s => s.id === state.activeScenario);
  if (!sc) return '';
  return `<div class="card" style="margin-bottom:14px;border-color:color-mix(in srgb, var(--accent) 45%, transparent);background:var(--accent-wash)">
    <div class="card-head"><div><div class="card-title">What would you do? — ${esc(sc.title)}</div>

}

          <dt>Market return</dt><dd>${fmtPct(r.bench)}</dd>

/* ============================================================================
 * 16. MODALS
 * ========================================================================== */

let ticket = { t: null, side: 'BUY', sh: 1 };

function tradeModalHtml(t) {
  const co = BY_TICKER[t], px = priceOf(t), held = sharesHeld(t);
  const halted = isHalted(t);
  const side = ticket.side, sh = Math.max(0, ticket.sh | 0);
  const unit = side === 'BUY' ? askOf(t) : bidOf(t);
  const gross = sh * px, total = sh * unit;
  const spreadCost = Math.abs(total - gross);
  const maxAfford = Math.floor(state.cash / askOf(t));
  const after = side === 'BUY' ? state.cash - total : state.cash + total;
  const newShares = side === 'BUY' ? held + sh : held - sh;
  const tv = totalValue();
  const newWeight = tv ? (newShares * px) / (side === 'BUY' ? tv : tv) : 0;
  const tooMuch = side === 'BUY' && total > state.cash;
  const tooMany = side === 'SELL' && sh > held;
  const concentrated = side === 'BUY' && newWeight > 0.3;

  return `
  <div class="modal">
    <div class="modal-head">
      <div>
        <h2>${side === 'BUY' ? 'Buy' : 'Sell'} ${co.t}</h2>
        <div class="card-sub">${esc(co.name)} · ${fmtMoney(px)} <span class="${signClass(dayChangeOf(t))}">${arrow(dayChangeOf(t))} ${fmtPct(dayChangeOf(t))}</span></div>
      </div>
      <button class="icon-btn" data-act="close-modal" aria-label="Close">✕</button>
    </div>
    <div class="modal-body">
      <div class="seg" style="margin-bottom:14px">
        <button data-act="ticket-side" data-k="BUY" aria-pressed="${side === 'BUY'}">Buy</button>
        <button data-act="ticket-side" data-k="SELL" aria-pressed="${side === 'SELL'}">Sell</button>
      </div>

      ${halted ? `<div class="why" style="margin-bottom:14px"><div class="why-h">Market closed for this stock</div>
        ${co.t} reported results after today's close. Your order will be queued and filled at tomorrow's <strong>opening</strong> price, which can be well away from ${fmtMoney(px)}. That difference is called a gap, and it is the risk of committing to a price you cannot see yet.</div>` : ''}

      <div class="field" style="margin-bottom:12px">
        <label for="qty">Number of shares</label>
        <div class="qty-row">
          <input class="input" id="qty" type="text" inputmode="numeric" pattern="[0-9]*" value="${sh}" aria-label="Number of shares" autocomplete="off">
          <button class="btn btn-sm" data-act="qty" data-v="-10">−10</button>
          <button class="btn btn-sm" data-act="qty" data-v="10">+10</button>
          <button class="btn btn-sm" data-act="qty-set" data-v="${side === 'BUY' ? Math.max(1, Math.floor(maxAfford / 4)) : Math.max(1, Math.floor(held / 4))}">25%</button>
          <button class="btn btn-sm" data-act="qty-set" data-v="${side === 'BUY' ? maxAfford : held}">Max</button>
        </div>
      </div>

      <div class="card" style="background:var(--surface-2)">
        <div class="ticket-row"><span class="mut">Mid price</span><span class="v">${fmtMoney(px)}</span></div>
        <div class="ticket-row"><span class="mut">${side === 'BUY' ? 'You pay (ask)' : 'You receive (bid)'}</span><span class="v">${fmtMoney(unit)}</span></div>
        <div class="ticket-row"><span class="mut">Shares</span><span class="v">${fmtNum(sh)}</span></div>
        <div class="ticket-row"><span class="mut">Spread cost</span><span class="v">${fmtMoney(spreadCost)}</span></div>
        <div class="ticket-row"><span class="ticket-total">Estimated ${side === 'BUY' ? 'cost' : 'proceeds'}</span><span class="v ticket-total">${fmtMoney(total)}</span></div>
      </div>

      <div class="grid g-2" style="margin-top:12px">
        <div class="card" style="background:var(--surface-2)">
          <div class="ticket-row"><span class="mut">Cash now</span><span class="v">${fmtMoney(state.cash)}</span></div>
          <div class="ticket-row"><span class="mut">Cash after</span><span class="v ${after < 0 ? 'down' : ''}">${fmtMoney(after)}</span></div>
        </div>
        <div class="card" style="background:var(--surface-2)">
          <div class="ticket-row"><span class="mut">Shares held</span><span class="v">${fmtNum(held)} → ${fmtNum(Math.max(0, newShares))}</span></div>
          <div class="ticket-row"><span class="mut">Share of portfolio</span><span class="v ${concentrated ? 'down' : ''}">${fmtPct(Math.max(0, newWeight), 1).replace('+', '')}</span></div>
        </div>
      </div>

      ${tooMuch ? `<div class="why danger" style="margin-top:12px"><div class="why-h">Not enough cash</div>
        This order costs ${fmtMoney(total)} and you hold ${fmtMoney(state.cash)}. There is no borrowing in this simulation, so you can never lose more than you put in — the constraint is deliberate.</div>` : ''}
      ${tooMany ? `<div class="why danger" style="margin-top:12px"><div class="why-h">You do not hold that many shares</div>
        You hold ${fmtNum(held)}. Selling shares you do not own is short selling, which is not available here because its potential loss has no ceiling.</div>` : ''}
      ${concentrated && !tooMuch ? `<div class="lesson" style="margin-top:12px"><div class="lesson-h">Position size check</div>
        After this trade ${co.t} would be ${fmtPct(newWeight, 0).replace('+', '')} of your portfolio. There is no universally correct limit — but decide it deliberately. If ${co.t} fell 40% on news nobody predicted, this position alone would cost you about ${fmtPct(newWeight * 0.4, 1).replace('+', '')} of everything you own.</div>` : ''}

      ${side === 'BUY' ? `<p class="xsmall mut" style="margin-top:12px">You are buying a claim on this company's future profits from someone who preferred the cash. To profit, the company does not merely need to do well — it needs to do better than the market already assumes at ${fmtMoney(px)} a share.</p>`
        : held ? `<p class="xsmall mut" style="margin-top:12px">Selling turns a paper result into a realised one. Your average cost is ${fmtMoney(state.positions[t] ? state.positions[t].avg : 0)}, so this would realise ${fmtMoney((bidOf(t) - (state.positions[t] ? state.positions[t].avg : 0)) * Math.min(sh, held))}. The price you paid is a fact about your past, not about this company's future.</p>` : ''}
    </div>
    <div class="modal-foot">
      <button class="btn" data-act="close-modal">Cancel</button>
      <button class="btn ${side === 'BUY' ? 'btn-buy' : 'btn-sell'}" data-act="confirm-trade" ${(tooMuch || tooMany || sh < 1) ? 'disabled' : ''}>
        ${halted ? 'Queue' : 'Confirm'} ${side === 'BUY' ? 'purchase' : 'sale'} · ${fmtMoney(total)}
      </button>
    </div>
  </div>`;
}

        <div class="allocbar">${reactions.slice(0, 8).map(([t, v]) => `

        <p class="xsmall mut" style="margin-top:10px">This is the part of each stock's move attributable to this story specifically — separate from ordinary buying and selling, valuation drift and other news on the same day.</p>

/* --- modals ---------------------------------------------------------------- */
function openModal(html) {
  closeModal();
  const back = document.createElement('div');
  back.className = 'backdrop';
  back.innerHTML = html;
  back.addEventListener('click', e => { if (e.target === back) closeModal(); });
  $('#modal-root').appendChild(back);
  bindTicketInput();
  const focusable = back.querySelector('input, button.btn-primary, button');
  if (focusable) focusable.focus();
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  $('#modal-root').innerHTML = '';
  document.body.style.overflow = '';
}
function refreshModal(html) {
  const back = document.querySelector('.backdrop');
  if (!back) return openModal(html);
  back.innerHTML = html;
  bindTicketInput();
}

/* --- toasts ---------------------------------------------------------------- */
function toast(kind, title, text, conceptId) {
  const root = $('#toast-root');
  if (!root) return;
  const el = document.createElement('div');
  el.className = 'toast ' + (kind === 'lesson' ? 'lesson-toast' : kind === 'warn' ? 'warn' : kind === 'bad' ? 'bad' : '');
  el.innerHTML = `<div class="th"><span>${esc(title)}</span><button class="tclose" aria-label="Dismiss">✕</button></div>
    <div class="small sec">${esc(text)}</div>
    ${conceptId && CONCEPT_BY_ID[conceptId] ? `<button class="btn btn-sm btn-ghost" style="margin-top:8px" data-act="open-concept" data-id="${conceptId}">Read more: ${esc(CONCEPT_BY_ID[conceptId].title)}</button>` : ''}`;
  el.querySelector('.tclose').addEventListener('click', () => el.remove());
  root.appendChild(el);
  const ttl = kind === 'lesson' ? 16000 : 9000;
  setTimeout(() => { el.style.transition = 'opacity .4s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 420); }, ttl);
  while (root.children.length > 4) root.firstChild.remove();
}

/* --- trade ticket ---------------------------------------------------------- */
function bindTicketInput() {
  const q = document.getElementById('qty');
  if (!q) return;
  q.addEventListener('input', () => {
    ticket.sh = Math.max(0, parseInt(String(q.value).replace(/[^0-9]/g, ''), 10) || 0);
    refreshModal(tradeModalHtml(ticket.t));
    const nq = document.getElementById('qty');
    if (nq) {
      nq.focus();
      try { nq.setSelectionRange(nq.value.length, nq.value.length); } catch (e) { /* not selectable */ }
    }
  });
}
function openTicket(t, side) {
  ticket = { t, side: side || (sharesHeld(t) > 0 && side === 'SELL' ? 'SELL' : 'BUY'), sh: ticket.t === t ? ticket.sh : 1 };
  if (!ticket.sh) ticket.sh = 1;
  openModal(tradeModalHtml(t));
}

/* --- search ---------------------------------------------------------------- */
let searchIdx = -1;
function runSearch() {
  const q = $('#search').value.trim().toLowerCase();
  const box = $('#search-results');
  if (!q) { box.innerHTML = ''; return; }

    || c.sector.toLowerCase().includes(q) || c.industry.toLowerCase().includes(q)).slice(0, 7);

  box.innerHTML = hits.length ? hits.map((c, i) => `
    <button class="sr-item" data-act="open-stock" data-t="${c.t}" data-i="${i}">
      <span class="sr-tick">${c.t}</span>
      <span class="grow"><span class="small">${esc(c.name)}</span><br><span class="xsmall mut">${esc(c.sector)}</span></span>
      <span class="num small">${fmtMoney(priceOf(c.t))}</span>
      <span class="num xsmall ${signClass(dayChangeOf(c.t))}">${fmtPct(dayChangeOf(c.t))}</span>
    </button>`).join('')
    : `<div class="empty small">No company matches “${esc(q)}”.</div>`;

/* --- actions --------------------------------------------------------------- */
const ACTIONS = {
  nav: el => go(el.dataset.route),

  'open-stock': el => {
    const t = el.dataset.t;

    app.range = 60;

  trade: el => openTicket(el.dataset.t, 'BUY'),
  'ticket-side': el => { ticket.side = el.dataset.k; refreshModal(tradeModalHtml(ticket.t)); },
  qty: el => { ticket.sh = Math.max(0, ticket.sh + parseInt(el.dataset.v, 10)); refreshModal(tradeModalHtml(ticket.t)); },
  'qty-set': el => { ticket.sh = Math.max(0, parseInt(el.dataset.v, 10) || 0); refreshModal(tradeModalHtml(ticket.t)); },

  'confirm-trade': () => {
    const res = ticket.side === 'BUY' ? buy(ticket.t, ticket.sh) : sell(ticket.t, ticket.sh);
    if (!res.ok) { toast('bad', 'Order rejected', res.msg); return; }
    closeModal();
    toast(res.queued ? 'warn' : '', res.queued ? 'Order queued' : 'Order filled', res.msg);

  'close-modal': () => closeModal(),

  'open-news': el => {
    const n = state.news.find(x => x.id === el.dataset.id);

      if (!state.learn.newsRead) state.learn.newsRead = {};

function startAuto() {

/* --- global listeners ------------------------------------------------------ */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) { if (!e.target.closest('.search-wrap')) closeSearch(); return; }
  const fn = ACTIONS[el.dataset.act];
  if (!fn) return;
  e.preventDefault();
  e.stopPropagation();
  fn(el);
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); closeSearch(); }
  if (e.key === '/' && document.activeElement !== $('#search') && !document.querySelector('.backdrop')) {
    e.preventDefault(); $('#search').focus();
  }
  if (document.activeElement === $('#search')) {
    const items = [...document.querySelectorAll('.sr-item')];
    if (!items.length) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      searchIdx = clamp(searchIdx + (e.key === 'ArrowDown' ? 1 : -1), 0, items.length - 1);
      items.forEach((it, i) => it.classList.toggle('active', i === searchIdx));
    }
    if (e.key === 'Enter') { e.preventDefault(); (items[Math.max(0, searchIdx)] || items[0]).click(); }
  }
});

/* ============================================================================
 * 18. OPTIONAL LIVE-DATA ADAPTER
 * ----------------------------------------------------------------------------
 * The simulation is self-contained and needs no network access. If you want it
 * seeded from real quotes, define this global BEFORE the page loads:
 *
 *   window.MARKET_LAB_API = {
 *     quoteUrl: t => `https://your-api.example/quote?symbol=${t}&token=KEY`,
 *     parse:    json => json.price          // must return a positive number
 *   };
 *
 * Only the STARTING price is taken from the API. Everything after that — the
 * simulated price path, the events, the earnings — is generated locally, and no
 * order placed here ever reaches a real venue. Keep it that way: this is a
 * teaching tool, not a brokerage, and it must never be wired to one.
 * ========================================================================== */
const DataAdapter = {
  get enabled() { return !!(window.MARKET_LAB_API && typeof window.MARKET_LAB_API.quoteUrl === 'function'); },
  async seedStartingPrices() {
    if (!this.enabled) return { ok: false, reason: 'no adapter configured — using the bundled simulated dataset' };
    const cfg = window.MARKET_LAB_API;
    let n = 0;
    await Promise.all(COMPANIES.map(async co => {
      try {
        const res = await fetch(cfg.quoteUrl(co.t), { headers: cfg.headers || {} });
        if (!res.ok) throw new Error(res.status);
        const px = cfg.parse ? cfg.parse(await res.json()) : null;
        if (typeof px === 'number' && isFinite(px) && px > 0) { co.price = +px.toFixed(2); n++; }
      } catch (err) { /* a failed symbol simply keeps its simulated starting price */ }
    }));
    return { ok: n > 0, count: n };
  }
};

/* ============================================================================
 * 19. BOOT
 * ========================================================================== */
async function boot() {
  try {
    const th = localStorage.getItem('market-lab-theme');
    if (th) document.documentElement.setAttribute('data-theme', th);
  } catch (e) {}

  if (DataAdapter.enabled) {
    const r = await DataAdapter.seedStartingPrices();
    if (r.ok) setTimeout(() => toast('', 'Starting prices seeded from live data',
      `${r.count} of ${COMPANIES.length} opening prices came from the configured market-data API. Everything after this first tick is simulated locally — no real orders are ever placed.`), 800);
  }

  if (loadSave()) {
    go('dashboard');
    toast('', 'Session restored', `Picked up where you left off — session ${state.day} of ${state.length}. Use “Restart simulation” in the sidebar to begin a fresh market.`);
  } else {
    // a placeholder state so the shell can render behind the start dialog
    newGame({ length: 60, cash: 100000, seed: String(Math.floor(Math.random() * 1e9)) });
    go('dashboard');
    openModal(startModalHtml());
  }
  $('#search').addEventListener('input', runSearch);
  $('#search').addEventListener('focus', runSearch);

  // charts are sized for the viewport, so re-draw them when it changes
  let rt = null;
  window.addEventListener('resize', () => {
    clearTimeout(rt);
    rt = setTimeout(() => { if (state && !document.querySelector('.backdrop')) render(); }, 250);
  });
}
boot();

</script>
</body>
</html>
